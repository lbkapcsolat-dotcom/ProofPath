name: ess-docker-mcp-secretless-shortlist-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-secretless-shortlist-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  shortlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-shortlist "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-shortlist/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-shortlist/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-shortlist/docker-mcp-version.txt

      - name: Freeze complete official catalog server inventory
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" 2>&1 | tee evidence/docker-mcp-shortlist/catalog-pull.log
          docker mcp catalog server ls "$DOCKER_MCP_CATALOG" --format json > evidence/docker-mcp-shortlist/all-servers.json
          test -s evidence/docker-mcp-shortlist/all-servers.json

      - name: Build bounded secretless ESS shortlist
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('evidence/docker-mcp-shortlist')
          obj=json.loads((root/'all-servers.json').read_text())
          servers=obj.get('servers',obj if isinstance(obj,list) else [])
          if not isinstance(servers,list): raise SystemExit('HOLD_UNEXPECTED_CATALOG_SERVER_LIST_SCHEMA')
          positive={
            'science':5,'scientific':5,'research':5,'academic':5,'paper':5,'arxiv':5,'pubmed':5,'biology':4,'physics':5,'mathematics':5,'math':5,
            'documentation':4,'developer-tools':3,'code-examples':3,'knowledge':3,'search':2,
            'security':4,'verification':5,'testing':4,'static-analysis':4,'observability':3,'monitoring':3,'debugging':3,'logs':2,'trace':2,
            'github':2,'git':2,'docker':2,'devops':1,'database':1,'sql':1
          }
          risky_words={'write','create','delete','remove','update','edit','send','post','publish','deploy','execute','run_command','shell','terminal','purchase','pay','transfer','upload','download','merge','close','approve','invite','message','email','issue_create','pr_create'}
          rows=[]
          for entry in servers:
            s=(entry.get('snapshot') or {}).get('server') or entry
            name=s.get('name','')
            title=s.get('title','')
            desc=s.get('description','') or ''
            meta=s.get('metadata') or {}
            tags=[str(x).lower() for x in (meta.get('tags') or [])]
            category=str(meta.get('category') or '').lower()
            secrets=s.get('secrets') or []
            tools=s.get('tools') or []
            tool_names=[str(t.get('name','')) for t in tools if isinstance(t,dict)]
            blob=' '.join([name,title,desc,category,' '.join(tags),' '.join(tool_names)]).lower()
            score=0
            hits=[]
            for k,v in positive.items():
              if k in blob:
                score+=v; hits.append(k)
            risky=[]
            for tn in tool_names:
              low=tn.lower()
              if any(w in low for w in risky_words): risky.append(tn)
            remote=s.get('remote') or {}
            row={
              'name':name,'title':title,'description':desc,'category':category,'tags':tags,
              'secretless':len(secrets)==0,'required_secrets':[x.get('env') for x in secrets if isinstance(x,dict)],
              'server_type':'remote' if remote else 'image','image':s.get('image',''),'remote_url':remote.get('url',''),
              'tool_count':len(tool_names),'tool_names':tool_names,'risk_flagged_tools':risky,
              'risk_flag_count':len(risky),'relevance_score':score,'relevance_hits':sorted(set(hits))
            }
            if row['secretless'] and score>0:
              rows.append(row)
          rows.sort(key=lambda r:(-r['relevance_score'],r['risk_flag_count'],r['name']))
          # Conservative controlled tier: relevant, secretless, and no obvious write/actuation tool name.
          controlled=[r for r in rows if r['risk_flag_count']==0]
          (root/'secretless-relevant-all.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          (root/'controlled-readonly-candidates.json').write_text(json.dumps(controlled,indent=2,sort_keys=True))
          top=controlled[:20]
          (root/'top20-controlled-readonly.json').write_text(json.dumps(top,indent=2,sort_keys=True))
          md=['# ESS Docker MCP Secretless Shortlist','','| Rank | Server | Score | Tools | Category | Hits |','|---:|---|---:|---:|---|---|']
          for i,r in enumerate(top,1):
            md.append(f"| {i} | `{r['name']}` | {r['relevance_score']} | {r['tool_count']} | {r['category']} | {', '.join(r['relevance_hits'])} |")
          (root/'top20-controlled-readonly.md').write_text('\n'.join(md)+'\n')
          summary={'catalog_server_count':len(servers),'secretless_relevant_count':len(rows),'controlled_readonly_candidate_count':len(controlled),'top20_names':[r['name'] for r in top]}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Build SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('evidence/docker-mcp-shortlist')
          rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Upload shortlist evidence
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-secretless-shortlist-v1
          path: evidence/docker-mcp-shortlist/
          if-no-files-found: error
          retention-days: 30
