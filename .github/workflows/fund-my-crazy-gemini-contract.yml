name: Fund My Crazy Gemini Contract

on:
  push:
    branches: [fund-my-crazy-gemini-delta]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gemini authority contract
        run: node test-gemini-contract.mjs
