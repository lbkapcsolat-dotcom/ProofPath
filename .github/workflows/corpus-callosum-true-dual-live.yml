name: Corpus Callosum True Dual-Live Gate

on:
  push:
    branches: [corpus-callosum-gemini-readonly-v1]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Semantic fail-closed contract
        run: node test-true-dual-live-failclosed.mjs
      - name: Canonical claim ontology contract
        run: node test-dual-live-structured-claim.mjs
      - name: OpenAI true-live provider contract
        run: node test-openai-live-dual-structured-contract.mjs
      - name: OpenAI live runner zero-spend RED gate
        run: node test-openai-live-runner-failclosed.mjs
