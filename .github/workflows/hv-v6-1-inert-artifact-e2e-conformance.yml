name: HV V6.1 Inert Artifact Fresh Process E2E Conformance V1

on:
  push:
    branches:
      - ess-v6-1-real-repository-control-plane-canary-v1
    paths:
      - 'control-plane-canary/v6_1/hv_v6_1_restart_worker_v1.py'
      - 'control-plane-canary/v6_1/hv_v6_1_runtime_enforcement_v1.py'
      - 'control-plane-canary/v6_1/test_hv_v6_1_inert_artifact_e2e_v1.py'
      - 'control-plane-canary/v6_1/run_hv_v6_1_inert_artifact_conformance_v1.py'
      - '.github/workflows/hv-v6-1-inert-artifact-e2e-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-artifact-e2e-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact provider commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned cryptography dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.1'

      - name: Record provider identity
        run: |
          python --version
          git rev-parse HEAD
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"

      - name: Run inert artifact fresh-process conformance
        working-directory: control-plane-canary/v6_1
        run: |
          mkdir -p out
          python -m py_compile test_hv_v6_1_inert_artifact_e2e_v1.py run_hv_v6_1_inert_artifact_conformance_v1.py
          python run_hv_v6_1_inert_artifact_conformance_v1.py > out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['tests_total'] == 3
          assert r['tests_passed'] == 3
          assert r['write_close_reopen_exact_bytes'] is True
          assert r['fresh_process_autoload'] is True
          assert r['inert_marker_remains_data'] is True
          assert r['horizontal_to_vertical_mint_rejected'] is True
          assert r['authority_minted'] is False
          assert r['executable'] is False
          assert r['claims']['general_runtime_admission'] is False
          assert r['claims']['production_readiness'] is False
          assert r['claims']['global_bind'] is False
          assert r['claims']['pointer_promotion'] is False
          assert r['verdict'] == 'PASS_HV_V6_1_INERT_ARTIFACT_FRESH_PROCESS_H_TO_V_REJECTION_3_OF_3'
          PY
          sha256sum out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json > out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json.sha256

      - name: Run previous restart durability nonregression
        working-directory: control-plane-canary/v6_1
        run: python test_hv_v6_1_restart_durability_v1.py

      - name: Run previous runtime enforcement nonregression
        working-directory: control-plane-canary/v6_1
        run: python test_hv_v6_1_runtime_enforcement_v1.py

      - name: Upload provider-native inert artifact receipt
        uses: actions/upload-artifact@v4
        with:
          name: hv-v6-1-inert-artifact-e2e-conformance-${{ github.run_id }}
          path: |
            control-plane-canary/v6_1/out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json
            control-plane-canary/v6_1/out/HV_V6_1_INERT_ARTIFACT_E2E_RECEIPT_V1.json.sha256
          if-no-files-found: error
          retention-days: 7
