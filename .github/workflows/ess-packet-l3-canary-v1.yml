name: ESS Packet L3 Canary V1

on:
  push:
    branches:
      - canary/packet-l3-20260913-v1
    paths:
      - .github/workflows/ess-packet-l3-canary-v1.yml

permissions:
  contents: read

jobs:
  client_c_partition:
    name: client-c-partition
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      API_URL: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_packet_l3_gateway_v1
      API_KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
      TARGET_HOST: vuzphrlgkgxswjnexszw.supabase.co
    steps:
      - name: Runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_c
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "hostname=$(hostname)"
            echo "kernel=$(uname -srmo)"
            echo "boot_id=$(cat /proc/sys/kernel/random/boot_id)"
            echo "iptables=$(iptables --version 2>&1 || true)"
          } | tee evidence_c/runtime_identity.txt

      - name: Signed genesis and arm partition window
        shell: bash
        run: |
          set -euo pipefail
          rpc() {
            local action="$1" msg="${2:-}" sig="${3:-}"
            local body
            body=$(jq -nc --arg a "$action" --arg m "$msg" --arg s "$sig" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API_URL" -H "apikey: $API_KEY" -H 'Content-Type: application/json' --data "$body"
          }

          init=$(rpc init_c "INIT_V1|REQ_GHA_INIT_C_01|ESS_GHA_CLIENT_C_20260913|ESS_GHA_PACKET_L3_CANARY_20260913_01|TARGET_CONTROL_PACKET_L3|1|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739|11111111111|GHA_PACKET_L3_INIT_C_01|1dbb8e99bbec0f068c9fa88f98b843a38cec8036751117a339cd3ac9ddc8ac85" "1c653a5eb6ac82c9dd480e4e51513d6b68aca29058e9c2ceb0d548db08eeb82d904c5de6a9b18503d0fa7d15c66ba51ee3b0c44a94e1b21681ba2797f85ea608")
          echo "$init" | tee evidence_c/init_c.json
          test "$(jq -r .status <<<"$init")" = "GENESIS_COMMITTED"

          pre=$(rpc state)
          echo "$pre" | tee evidence_c/state_pre_open.json
          test "$(jq -r .head_version <<<"$pre")" = "1"
          test "$(jq -r .holder <<<"$pre")" = "ESS_GHA_CLIENT_C_20260913"

          opened=$(rpc open_c "OPEN_PACKET_L3_V1|GHA_PACKET_L3_20260913_01|ESS_GHA_CLIENT_C_20260913|ESS_GHA_PACKET_L3_CANARY_20260913_01|TARGET_CONTROL_PACKET_L3|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739" "c8e68404dd2e2dc5e0c865069890f5ee1181349d75f1cefc69bb3acbe4b14711db7dbc00b508fa7eba051cb68d7a9309f585c84991f3893bcf4b78ae03b36d00")
          echo "$opened" | tee evidence_c/open_c.json
          test "$(jq -r .status <<<"$opened")" = "PARTITION_WINDOW_ARMED"

      - name: Same-runtime fixed-route L3 cutoff, restore, and stale replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_c
          rpc() {
            local action="$1" msg="${2:-}" sig="${3:-}"
            local body
            body=$(jq -nc --arg a "$action" --arg m "$msg" --arg s "$sig" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API_URL" -H "apikey: $API_KEY" -H 'Content-Type: application/json' --data "$body"
          }
          rpc_fixed() {
            local ip="$1"
            local body
            body=$(jq -nc '{p_action:"state",p_message:null,p_signature_hex:null}')
            curl -sS --fail-with-body --connect-timeout 4 --max-time 8 --resolve "$TARGET_HOST:443:$ip" "$API_URL" -H "apikey: $API_KEY" -H 'Content-Type: application/json' --data "$body"
          }

          TARGET_IP=$(getent ahostsv4 "$TARGET_HOST" | awk 'NR==1{print $1}')
          test -n "$TARGET_IP"
          echo "$TARGET_IP" | tee evidence_c/target_ip.txt

          before=$(rpc_fixed "$TARGET_IP")
          echo "$before" | tee evidence_c/fixed_route_before.json
          test "$(jq -r .status <<<"$before")" = "STATE"
          echo "cutoff_apply_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" | tee evidence_c/cutoff_timestamps.txt

          cleanup() {
            sudo iptables -D OUTPUT -d "$TARGET_IP" -p tcp --dport 443 -j REJECT 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo iptables -I OUTPUT 1 -d "$TARGET_IP" -p tcp --dport 443 -j REJECT
          sudo iptables -C OUTPUT -d "$TARGET_IP" -p tcp --dport 443 -j REJECT
          sudo iptables -S OUTPUT | tee evidence_c/iptables_during.txt

          blocked=0
          for i in 1 2 3; do
            if rpc_fixed "$TARGET_IP" >"evidence_c/blocked_attempt_${i}.out" 2>"evidence_c/blocked_attempt_${i}.err"; then
              echo "unexpected_reachability_attempt=$i" >&2
              exit 1
            else
              blocked=$((blocked+1))
            fi
          done
          test "$blocked" = "3"
          echo "blocked_attempts=$blocked" | tee evidence_c/block_summary.txt

          sleep 35

          cleanup
          trap - EXIT
          echo "restore_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" | tee -a evidence_c/cutoff_timestamps.txt

          after=$(rpc_fixed "$TARGET_IP")
          echo "$after" | tee evidence_c/fixed_route_after.json
          test "$(jq -r .status <<<"$after")" = "STATE"
          test "$(jq -r .holder <<<"$after")" = "ESS_GHA_CLIENT_D_20260913"
          test "$(jq -r .head_version <<<"$after")" = "2"
          test "$(jq -r .head_receipt_sha256 <<<"$after")" = "61dbcd1e7992f83630d65595ee418763e8ec86014157d075a25ab5eb94157d34"

          stale=$(rpc stale_c "APPEND_V1|REQ_GHA_STALE_C_01|ESS_GHA_CLIENT_C_20260913|ESS_GHA_PACKET_L3_CANARY_20260913_01|TARGET_CONTROL_PACKET_L3|1|1|2|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739|7a234261abedc79328a6dbdd2c0061f78f2527b8c210651dfafc33ee47b15f27|7a234261abedc79328a6dbdd2c0061f78f2527b8c210651dfafc33ee47b15f27|11111111111|GHA_PACKET_L3_STALE_C_V2_01|c263eb33562d3e418b080e52448fa204591a843f3f7b80b7f3115b0725514789" "afb88d3d1f1112a67b106376c11ba0b89d12e745d00be7c27f8d062c045887e9fcf537d77e475cad50ac98b207fd1ca6c2dc1b51dab1e3f6dcf57e1b73737d08")
          echo "$stale" | tee evidence_c/stale_c.json
          test "$(jq -r .status <<<"$stale")" = "REJECT_STALE_WRITER"

          final=$(rpc state)
          echo "$final" | tee evidence_c/final_state.json
          test "$(jq -r .c_stale_outcome <<<"$final")" = "REJECT_STALE_WRITER"
          test "$(jq -r .holder <<<"$final")" = "ESS_GHA_CLIENT_D_20260913"
          test "$(jq -r .head_version <<<"$final")" = "2"

      - name: Upload client C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-packet-l3-client-c
          path: evidence_c
          if-no-files-found: error

  client_d_progress:
    name: client-d-progress
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      API_URL: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_packet_l3_gateway_v1
      API_KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
    steps:
      - name: Runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_d
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "hostname=$(hostname)"
            echo "kernel=$(uname -srmo)"
            echo "boot_id=$(cat /proc/sys/kernel/random/boot_id)"
          } | tee evidence_d/runtime_identity.txt

      - name: Wait for armed window, takeover, and commit v2
        shell: bash
        run: |
          set -euo pipefail
          rpc() {
            local action="$1" msg="${2:-}" sig="${3:-}"
            local body
            body=$(jq -nc --arg a "$action" --arg m "$msg" --arg s "$sig" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API_URL" -H "apikey: $API_KEY" -H 'Content-Type: application/json' --data "$body"
          }

          success=0
          for i in $(seq 1 60); do
            takeover=$(rpc takeover_d "TAKEOVER_V1|REQ_GHA_TAKEOVER_D_01|ESS_GHA_CLIENT_D_20260913|ESS_GHA_PACKET_L3_CANARY_20260913_01|TARGET_CONTROL_PACKET_L3|ESS_GHA_CLIENT_C_20260913|1|1|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739" "7e5c03253115f73366ad71cd82ee7d0835459a3e5d8d4ba9aea241dc49d09e7378b325c3ef14460c2ae3137f99d70ba82eedb6fb81eccb2ed0744afdeb09240c")
            echo "$takeover" > "evidence_d/takeover_attempt_${i}.json"
            status=$(jq -r .status <<<"$takeover")
            if [ "$status" = "TAKEOVER_COMMITTED" ]; then
              echo "takeover_local_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" | tee evidence_d/timestamps.txt
              success=1
              break
            fi
            if [ "$status" != "WAIT_ACTIVATION" ]; then
              echo "unexpected_takeover_status=$status" >&2
              exit 1
            fi
            sleep 1
          done
          test "$success" = "1"

          append=$(rpc append_d "APPEND_V1|REQ_GHA_APPEND_D_01|ESS_GHA_CLIENT_D_20260913|ESS_GHA_PACKET_L3_CANARY_20260913_01|TARGET_CONTROL_PACKET_L3|2|2|2|c1b354160402f22bcc5711013bc1ff049c9652ae5341464300f3971e6a657739|61dbcd1e7992f83630d65595ee418763e8ec86014157d075a25ab5eb94157d34|61dbcd1e7992f83630d65595ee418763e8ec86014157d075a25ab5eb94157d34|11111111111|GHA_PACKET_L3_D_V2_01|faaa2e3c3c928be5b56468cecb5f88ea1bd2efdbe65de2ce6500610c2bac3514" "e2e4e1a4b3b784e7c941462cd4eb5273aa7106e0e9bb0d296da3cefdcaed98accd62262196dec542c572dad46b207b24d476f8d110ef1a8bd9ef9440b9398e04")
          echo "$append" | tee evidence_d/append_d.json
          test "$(jq -r .status <<<"$append")" = "RECEIPT_COMMITTED"
          echo "append_local_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" | tee -a evidence_d/timestamps.txt

          final=$(rpc state)
          echo "$final" | tee evidence_d/final_state.json
          test "$(jq -r .holder <<<"$final")" = "ESS_GHA_CLIENT_D_20260913"
          test "$(jq -r .head_version <<<"$final")" = "2"
          test "$(jq -r .head_receipt_sha256 <<<"$final")" = "61dbcd1e7992f83630d65595ee418763e8ec86014157d075a25ab5eb94157d34"

      - name: Upload client D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-packet-l3-client-d
          path: evidence_d
          if-no-files-found: error
