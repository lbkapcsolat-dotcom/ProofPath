name: ESS Full Egress V1
on:
  push:
    branches: [canary/full-egress-20260913-v1]
    paths: [.github/workflows/ess-full-egress-v1.yml]
permissions:
  contents: read
jobs:
  egress_cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      API: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_full_egress_gateway_v1
      KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
      SUPA: vuzphrlgkgxswjnexszw.supabase.co
    steps:
      - name: full-egress-canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ev
          echo "runner=$RUNNER_NAME" > ev/runtime.txt
          echo "boot=$(cat /proc/sys/kernel/random/boot_id)" >> ev/runtime.txt
          echo "kernel=$(uname -srmo)" >> ev/runtime.txt
          rpc() {
            b=$(jq -nc --arg a "$1" --arg m "${2:-}" --arg s "${3:-}" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data "$b"
          }
          init=$(rpc init_e 'INIT_V1|REQ_GHA_EGRESS_INIT_E_01|ESS_GHA_EGRESS_CLIENT_E_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_01|TARGET_CONTROL_FULL_EGRESS|1|54454bcb30ef60d594c1f29bd8ad835cf8c389d6d113e863f1e90b73eb8c1fee|54454bcb30ef60d594c1f29bd8ad835cf8c389d6d113e863f1e90b73eb8c1fee|11111111111|GHA_FULL_EGRESS_INIT_E_01|0d3a9bf98af3fd07617e2e296c9969c297f4b5ec8bad2a6f47226114132164de' 'da804197273770b1ccd6126aa9e6d3f28a1326ed0ee1a04320ecc6c4b57ae1f005f261c70a045579085692d6b590b58a8ac9ea9e091dcc7a5195622646337b09')
          echo "$init" > ev/init.json
          test "$(jq -r .status <<<"$init")" = GENESIS_COMMITTED
          arm=$(rpc arm_e 'ARM_FULL_EGRESS_V1|GHA_FULL_EGRESS_20260913_01|ESS_GHA_EGRESS_CLIENT_E_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_01|TARGET_CONTROL_FULL_EGRESS|54454bcb30ef60d594c1f29bd8ad835cf8c389d6d113e863f1e90b73eb8c1fee' '710f6017cd1f53bd08cea5ab1a3aacbcb3cb3b177eb6c5335c0092b605e1cab382c61161e3d1fc11057736df79a96b13e6b7f805e46febd1e2b2e7948803cd03')
          echo "$arm" > ev/arm.json
          test "$(jq -r .status <<<"$arm")" = EGRESS_WINDOW_ARMED

          S4=$(getent ahostsv4 "$SUPA" | awk 'NR==1{print $1}')
          G4=$(getent ahostsv4 api.github.com | awk 'NR==1{print $1}')
          E4=$(getent ahostsv4 example.com | awk 'NR==1{print $1}')
          test -n "$S4"; test -n "$G4"; test -n "$E4"
          printf 'supa=%s\ngithub=%s\nexample=%s\n' "$S4" "$G4" "$E4" > ev/ipv4.txt

          curl -4 -fsS --resolve "$SUPA:443:$S4" "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_action":"state","p_message":null,"p_signature_hex":null}' > ev/before-supa.json
          curl -4 -fsS --resolve "api.github.com:443:$G4" https://api.github.com/meta > ev/before-gh.json
          curl -4 -fsS --resolve "example.com:443:$E4" https://example.com/ > ev/before-example.html

          V6=$(getent ahostsv6 example.com | awk 'NR==1{print $1}' || true)
          IPV6=0
          if [ -n "${V6:-}" ] && curl -6 -fsS --connect-timeout 3 --max-time 6 --resolve "example.com:443:[$V6]" https://example.com/ > ev/before-v6.html 2>ev/before-v6.err; then IPV6=1; fi
          printf 'ipv6_addr=%s\nipv6_active=%s\n' "${V6:-}" "$IPV6" > ev/ipv6.txt

          sudo iptables-save > ev/v4.before
          sudo ip6tables-save > ev/v6.before
          restore() { sudo iptables-restore < ev/v4.before || true; sudo ip6tables-restore < ev/v6.before || true; }
          trap restore EXIT
          echo "deny=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" > ev/time.txt
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
          sudo ip6tables -I OUTPUT 2 -j REJECT
          sudo iptables -S OUTPUT > ev/v4.during
          sudo ip6tables -S OUTPUT > ev/v6.during

          fail4=0
          for x in "$SUPA|$S4|$API" "api.github.com|$G4|https://api.github.com/meta" "example.com|$E4|https://example.com/"; do
            IFS='|' read -r h ip u <<<"$x"
            if curl -4 -fsS --connect-timeout 2 --max-time 4 --resolve "$h:443:$ip" "$u" > /dev/null 2>>ev/blocked4.err; then exit 21; else fail4=$((fail4+1)); fi
          done
          echo "blocked_ipv4=$fail4" > ev/blocked.txt
          test "$fail4" = 3
          if [ "$IPV6" = 1 ]; then
            if curl -6 -fsS --connect-timeout 2 --max-time 4 --resolve "example.com:443:[$V6]" https://example.com/ > /dev/null 2>ev/blocked6.err; then exit 22; fi
            echo "blocked_ipv6=1" >> ev/blocked.txt
          else
            echo "blocked_ipv6=NOT_TESTABLE_NO_PREEXISTING_IPV6_EGRESS" >> ev/blocked.txt
          fi
          sleep 12
          restore
          trap - EXIT
          echo "restore=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> ev/time.txt

          after=$(rpc state)
          echo "$after" > ev/after.json
          test "$(jq -r .holder <<<"$after")" = ESS_GHA_EGRESS_CLIENT_F_20260913
          test "$(jq -r .head_version <<<"$after")" = 2
          curl -4 -fsS --resolve "$SUPA:443:$S4" "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_action":"state","p_message":null,"p_signature_hex":null}' > ev/after-supa.json
          curl -4 -fsS --resolve "api.github.com:443:$G4" https://api.github.com/meta > ev/after-gh.json
          curl -4 -fsS --resolve "example.com:443:$E4" https://example.com/ > ev/after-example.html
          if [ "$IPV6" = 1 ]; then curl -6 -fsS --resolve "example.com:443:[$V6]" https://example.com/ > ev/after-v6.html; echo "ipv6_restore=PASS" >> ev/ipv6.txt; else echo "ipv6_restore=HOLD_ACTIVE_PATH_NOT_AVAILABLE" >> ev/ipv6.txt; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-full-egress-e
          path: ev
          if-no-files-found: error

  independent_progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      API: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_full_egress_gateway_v1
      KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
    steps:
      - name: takeover-and-commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evf
          echo "runner=$RUNNER_NAME" > evf/runtime.txt
          echo "boot=$(cat /proc/sys/kernel/random/boot_id)" >> evf/runtime.txt
          rpc() {
            b=$(jq -nc --arg a "$1" --arg m "${2:-}" --arg s "${3:-}" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data "$b"
          }
          ok=0
          for i in $(seq 1 40); do
            r=$(rpc takeover_f 'TAKEOVER_V1|REQ_GHA_EGRESS_TAKEOVER_F_01|ESS_GHA_EGRESS_CLIENT_F_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_01|TARGET_CONTROL_FULL_EGRESS|ESS_GHA_EGRESS_CLIENT_E_20260913|1|1|54454bcb30ef60d594c1f29bd8ad835cf8c389d6d113e863f1e90b73eb8c1fee' '831c04de6e3bf3413f43d6e2e533efd9d0bae881a490f6cd5cf0147fec30974ab162f07a2f3cbfd850a2f34aa26f0890978df8885fc42b79a9be0e763d92de0e')
            echo "$r" > "evf/takeover-$i.json"
            s=$(jq -r .status <<<"$r")
            if [ "$s" = TAKEOVER_COMMITTED ]; then ok=1; echo "takeover=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" > evf/time.txt; break; fi
            test "$s" = WAIT_ARM -o "$s" = WAIT_ACTIVATION
            sleep 1
          done
          test "$ok" = 1
          a=$(rpc append_f 'APPEND_V1|REQ_GHA_EGRESS_APPEND_F_01|ESS_GHA_EGRESS_CLIENT_F_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_01|TARGET_CONTROL_FULL_EGRESS|2|2|2|54454bcb30ef60d594c1f29bd8ad835cf8c389d6d113e863f1e90b73eb8c1fee|656ec7bb2ae602ab9c1e53cd1361e86cdfcdc931b2562260ddd9fd92d1dd007b|656ec7bb2ae602ab9c1e53cd1361e86cdfcdc931b2562260ddd9fd92d1dd007b|11111111111|GHA_FULL_EGRESS_APPEND_F_V2_01|aa5c74cd0c8d5ea39a12cd35a065855101c64797c52b1b6c9ff88c4de9799bb0' 'aa3899a08a66581e32c8d90692eb5c7090315c50b4c628db4f095cc8bc80115460e1e9fdfaa29f6bbf4b54e9007f9fde494597a36ae82aa2f9c862d85e9a5f08')
          echo "$a" > evf/append.json
          test "$(jq -r .status <<<"$a")" = RECEIPT_COMMITTED
          echo "append=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> evf/time.txt
          rpc state > evf/state.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-full-egress-f
          path: evf
          if-no-files-found: error
