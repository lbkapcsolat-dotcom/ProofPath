name: Mathlib Runtime Bind Canary TDD

on:
  push:
    branches:
      - impl/mathlib-runtime-bind-canary
    paths:
      - 'formal/namespace-safe-eq64/**'
      - '.github/workflows/mathlib-runtime-bind-canary.yml'

permissions:
  contents: read

jobs:
  runtime-bind-tdd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Lean and build existing default target
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/namespace-safe-eq64
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Run runtime oracle contract
        working-directory: formal/namespace-safe-eq64
        run: |
          set -euo pipefail
          ~/.elan/bin/lake env lean RuntimeBindOracleTest.lean

      - name: Execute positive and negative oracle with exact readback
        working-directory: formal/namespace-safe-eq64
        run: |
          set -euo pipefail

          expected_positive='{"schema":"MATHLIB_RUNTIME_ORACLE_V1","witness":"ZMOD4_H1_BOUNDARY_TIMES_2","degree":1,"representatives":[0,1,2,3],"custom_class_equality":[[true,false,true,false],[false,true,false,true],[true,false,true,false],[false,true,false,true]],"mathlib_class_equality":[[true,false,true,false],[false,true,false,true],[true,false,true,false],[false,true,false,true]],"class_equal":true,"negative_control":false}'
          expected_negative='{"schema":"MATHLIB_RUNTIME_ORACLE_V1","witness":"ZMOD4_H1_BOUNDARY_TIMES_2","degree":1,"representatives":[0,1,2,3],"custom_class_equality":[[true,false,true,false],[false,true,false,true],[true,false,true,false],[false,true,false,true]],"mathlib_class_equality":[[true,false,false,false],[false,true,false,false],[false,false,true,false],[false,false,false,true]],"class_equal":false,"negative_control":true}'

          positive="$(~/.elan/bin/lake exe runtimeBindOracle)"
          negative="$(~/.elan/bin/lake exe runtimeBindOracle --negative-control)"

          printf 'POSITIVE_READBACK=%s\n' "$positive"
          printf 'NEGATIVE_READBACK=%s\n' "$negative"

          test "$positive" = "$expected_positive"
          test "$negative" = "$expected_negative"

          printf '%s\n' "$positive" > runtime-oracle-positive.json
          printf '%s\n' "$negative" > runtime-oracle-negative.json

          test "$(cat runtime-oracle-positive.json)" = "$expected_positive"
          test "$(cat runtime-oracle-negative.json)" = "$expected_negative"

      - name: Run RED exact-engine replay receipt contract
        working-directory: formal/namespace-safe-eq64
        run: |
          set -euo pipefail
          python3 -m unittest runtime.test_runtime_bind_canary -v
