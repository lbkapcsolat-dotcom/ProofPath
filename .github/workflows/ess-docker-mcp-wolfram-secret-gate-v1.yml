name: ess-docker-mcp-wolfram-secret-gate-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-wolfram-secret-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  wolfram-secret-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-wolfram "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-wolfram/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-wolfram/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-wolfram/docker-mcp-version.txt

      - name: Prove Wolfram catalog contract and secret requirement
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" 2>&1 | tee evidence/docker-mcp-wolfram/catalog-pull.log
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" wolfram-alpha --format json > evidence/docker-mcp-wolfram/wolfram-inspect.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/docker-mcp-wolfram/wolfram-inspect.json')
          o=json.loads(p.read_text())
          server=o.get('snapshot',{}).get('server',{})
          tools=[x.get('name') for x in server.get('tools',[])]
          secrets=server.get('secrets',[])
          assert 'query-wolfram-alpha' in tools, tools
          assert any(s.get('env')=='WOLFRAM_API_KEY' for s in secrets), secrets
          image=server.get('image','')
          assert image.startswith('mcp/wolfram-alpha@sha256:'), image
          pathlib.Path('evidence/docker-mcp-wolfram/contract-summary.json').write_text(json.dumps({'image':image,'tool':'query-wolfram-alpha','required_secret_env':'WOLFRAM_API_KEY','required_secret_name':'wolfram-alpha.api_key'},indent=2,sort_keys=True))
          print('PASS_WOLFRAM_CATALOG_CONTRACT_AND_SECRET_DECLARATION')
          PY

      - name: Signature-verified no-secret runtime boundary probe
        run: |
          set -euxo pipefail
          : > /tmp/empty-secrets.env
          docker mcp gateway run --dry-run --servers wolfram-alpha --secrets=/tmp/empty-secrets.env --verify-signatures \
            > evidence/docker-mcp-wolfram/no-secret-dry-run.out \
            2> evidence/docker-mcp-wolfram/no-secret-dry-run.err
          # Runtime tool exposure must not be treated as callable without its required secret.
          set +e
          timeout --signal=TERM --kill-after=10s 90s \
            docker mcp tools --format json \
              --gateway-arg=--servers=wolfram-alpha \
              --gateway-arg=--secrets=/tmp/empty-secrets.env \
              --gateway-arg=--verify-signatures \
              ls \
            > evidence/docker-mcp-wolfram/no-secret-tools.json \
            2> evidence/docker-mcp-wolfram/no-secret-tools.err
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/docker-mcp-wolfram/no-secret-tools.exit
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/docker-mcp-wolfram/no-secret-tools.json')
          raw=p.read_text() if p.exists() else ''
          callable_now=False
          if raw.strip():
              try: callable_now='query-wolfram-alpha' in json.dumps(json.loads(raw))
              except Exception: callable_now='query-wolfram-alpha' in raw
          summary={'required_secret_present':False,'query_wolfram_alpha_callable_without_secret':callable_now,'expected_status':'HOLD_WOLFRAM_API_KEY_REQUIRED'}
          pathlib.Path('evidence/docker-mcp-wolfram/runtime-boundary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          assert not callable_now, 'FAIL_OPEN_WOLFRAM_TOOL_EXPOSED_WITHOUT_REQUIRED_SECRET'
          print('PASS_FAIL_CLOSED_NO_SECRET_BOUNDARY')
          PY

      - name: Build bounded HOLD receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-mcp-wolfram')
          receipt={
            'gate':'ESS_DOCKER_MCP_WOLFRAM_LIVE_CALLABLE_CANARY_V1',
            'status':'HOLD_WOLFRAM_API_KEY_REQUIRED',
            'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
            'server':'wolfram-alpha',
            'tool':'query-wolfram-alpha',
            'catalog_contract':'PASS',
            'signature_verified_configuration_probe':'PASS',
            'required_secret_env':'WOLFRAM_API_KEY',
            'secret_available_in_this_runner':False,
            'live_call_performed':False,
            'zero_spend':True,
            'secret_fabrication':False,
            'production_ready':False,
            'global_bind':False,
            'external_actuation':False
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='sha256-manifest.txt':
                  b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-wolfram-secret-gate-v1
          path: evidence/docker-mcp-wolfram/
          if-no-files-found: error
          retention-days: 30
