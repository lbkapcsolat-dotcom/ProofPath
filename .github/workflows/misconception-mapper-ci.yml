name: Misconception Mapper CI

on:
  push:
    branches:
      - prometheus-misconception-mapper
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Misconception Mapper tests
        working-directory: misconception-mapper
        run: npm test
