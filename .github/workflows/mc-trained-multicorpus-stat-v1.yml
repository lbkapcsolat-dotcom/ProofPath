name: MC Trained Multicorpus Statistical Replay V1

on:
  push:
    branches:
      - alpha/mc-trained-multicorpus-stat-v1
    paths:
      - .github/workflows/mc-trained-multicorpus-stat-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multicorpus-stat-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout ProofPath
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.3.1'
          python -m pip install 'transformers==4.45.2' 'safetensors==0.4.5' 'huggingface_hub==0.25.2' 'numpy==1.26.4'
          mkdir -p outputs/mc_multicorpus_stat

      - name: Run trained multicorpus knockout and statistical replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, math, random, statistics, sys, time, urllib.request, zipfile
          from pathlib import Path
          import torch
          import torch.nn.functional as F
          from huggingface_hub import snapshot_download, model_info
          from safetensors.torch import load_file

          OUT = Path('outputs/mc_multicorpus_stat')
          OUT.mkdir(parents=True, exist_ok=True)
          REPO_ID = 'Quazim0t0/Byrne-100M-Ultra-MC'
          STAGE = 'base_62k'
          SEED = 20260905
          torch.manual_seed(SEED)
          torch.set_num_threads(1)

          # Freeze the exact public model revision before download.
          info = model_info(REPO_ID)
          HF_REVISION = info.sha
          root = Path(snapshot_download(
              repo_id=REPO_ID,
              revision=HF_REVISION,
              allow_patterns=[
                  'config.py', 'model_v2.py', 'spike_tokenizer.py', 'special_tokens.py', 'fractal.py',
                  f'safetensors/{STAGE}/config.json',
                  f'safetensors/{STAGE}/model.safetensors',
                  f'safetensors/{STAGE}/tokenizer.json',
              ],
          ))
          stage = root / 'safetensors' / STAGE
          sys.path.insert(0, str(root))
          from config import SpikeWhaleConfig
          from model_v2 import SpikeWhaleLM
          from spike_tokenizer import SpikeTokenizer

          cfg_data = json.loads((stage/'config.json').read_text(encoding='utf-8'))
          cfg = SpikeWhaleConfig(**cfg_data)
          model = SpikeWhaleLM(cfg)
          state = load_file(str(stage/'model.safetensors'), device='cpu')
          missing, unexpected = model.load_state_dict(state, strict=False)
          model.tie_weights()
          model.eval()
          tok = SpikeTokenizer(vocab_file=str(stage/'tokenizer.json'))

          gate_names = [n for n,_ in model.named_parameters() if 'mc_gate' in n]
          if not gate_names:
              raise RuntimeError('No mc_gate parameters found; fail closed.')
          gate_backup = {n:p.detach().clone() for n,p in model.named_parameters() if n in gate_names}
          gate_values = torch.cat([p.detach().flatten().float() for n,p in model.named_parameters() if n in gate_names])
          gate_mean_abs_tanh = float(torch.tanh(gate_values).abs().mean().item())

          # One frozen NLTK Gutenberg archive, four distinct public-domain corpora.
          archive_url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/gutenberg.zip'
          req = urllib.request.Request(archive_url, headers={'User-Agent':'mc-multicorpus-audit/1.0'})
          archive_bytes = urllib.request.urlopen(req, timeout=60).read()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          wanted = {
              'emma':'gutenberg/austen-emma.txt',
              'alice':'gutenberg/carroll-alice.txt',
              'moby_dick':'gutenberg/melville-moby_dick.txt',
              'hamlet':'gutenberg/shakespeare-hamlet.txt',
          }
          zf = zipfile.ZipFile(io.BytesIO(archive_bytes))
          corpus_meta = {}
          tokenized = {}
          for name,path in wanted.items():
              raw = zf.read(path)
              text = raw.decode('utf-8', errors='ignore')
              ids = tok.encode(text, add_special_tokens=False)
              if len(ids) < 2000:
                  raise RuntimeError(f'Corpus too short after tokenization: {name} {len(ids)}')
              corpus_meta[name] = {
                  'archive_member':path,
                  'raw_sha256':hashlib.sha256(raw).hexdigest(),
                  'raw_bytes':len(raw),
                  'token_count':len(ids),
              }
              tokenized[name] = ids

          bos = tok.bos_token_id
          if bos is None:
              bos = int(getattr(cfg, 'bos_token_id', 0))
          window_len = 300
          positions = [0.10,0.30,0.50,0.70,0.90]
          windows=[]
          frozen_window_manifest=[]
          for cname, ids in tokenized.items():
              max_start=max(0,len(ids)-window_len)
              for pos in positions:
                  s=min(max_start, max(0, int(round(pos*max_start))))
                  body=ids[s:s+window_len]
                  if len(body)!=window_len:
                      raise RuntimeError('Frozen window length mismatch')
                  tensor=torch.tensor([[bos]+body],dtype=torch.long)
                  h=hashlib.sha256(tensor.numpy().tobytes()).hexdigest()
                  windows.append((cname,pos,s,tensor,h))
                  frozen_window_manifest.append({'corpus':cname,'fraction':pos,'token_start':s,'body_tokens':window_len,'tensor_sha256':h})

          def evaluate(label:str):
              rows=[]; hashes=[]
              with torch.no_grad():
                  for wi,(cname,pos,start,ids,input_sha) in enumerate(windows):
                      t0=time.perf_counter()
                      out=model(input_ids=ids,use_cache=False)
                      dt=(time.perf_counter()-t0)*1000
                      logits=out.logits
                      loss=F.cross_entropy(logits[:,:-1,:].reshape(-1,logits.shape[-1]),ids[:,1:].reshape(-1))
                      b=logits.detach().cpu().numpy().tobytes()
                      h=hashlib.sha256(b).hexdigest(); hashes.append(h)
                      rows.append({
                          'window_id':wi,'corpus':cname,'fraction':pos,'token_start':start,
                          'tokens':int(ids.numel()),'input_sha256':input_sha,
                          'loss':float(loss.item()),'ppl':float(math.exp(min(20.0,loss.item()))),
                          'latency_ms':dt,'logits_sha256':h,
                      })
              return rows,hashes

          on_rows,on_hashes=evaluate('MC_ON')
          with torch.no_grad():
              for n,p in model.named_parameters():
                  if n in gate_names: p.zero_()
          off_rows,off_hashes=evaluate('MC_OFF_KNOCKOUT')
          with torch.no_grad():
              for n,p in model.named_parameters():
                  if n in gate_backup: p.copy_(gate_backup[n])
          replay_rows,replay_hashes=evaluate('MC_ON_REPLAY')

          exact_replay = on_hashes == replay_hashes
          effects=[]
          latency_deltas=[]
          per_corpus={k:[] for k in wanted}
          for a,b in zip(on_rows,off_rows):
              if a['window_id']!=b['window_id'] or a['input_sha256']!=b['input_sha256']:
                  raise RuntimeError('Pairing mismatch')
              dloss=b['loss']-a['loss']
              dppl=b['ppl']-a['ppl']
              dlat=b['latency_ms']-a['latency_ms']
              effects.append(dloss); latency_deltas.append(dlat); per_corpus[a['corpus']].append(dloss)
              a['off_loss']=b['loss']; a['off_ppl']=b['ppl']; a['off_latency_ms']=b['latency_ms']
              a['delta_loss_off_minus_on']=dloss; a['delta_ppl_off_minus_on']=dppl; a['delta_latency_ms_off_minus_on']=dlat

          def quantile(xs,q):
              ys=sorted(xs); x=(len(ys)-1)*q; lo=int(math.floor(x)); hi=int(math.ceil(x))
              if lo==hi:return ys[lo]
              return ys[lo]*(hi-x)+ys[hi]*(x-lo)

          def bootstrap_mean_ci(values,seed,reps=20000):
              rng=random.Random(seed); n=len(values); means=[]
              for _ in range(reps):
                  means.append(sum(values[rng.randrange(n)] for _ in range(n))/n)
              means.sort()
              return {
                  'seed':seed,'reps':reps,
                  'mean_observed':statistics.mean(values),
                  'ci95_low':quantile(means,0.025),
                  'ci95_high':quantile(means,0.975),
              }

          boot_a=bootstrap_mean_ci(effects,20260905)
          boot_b=bootstrap_mean_ci(effects,260224281)
          corpus_effects={c:{'mean_delta_loss_off_minus_on':statistics.mean(v),'positive_windows':sum(x>0 for x in v),'windows':len(v)} for c,v in per_corpus.items()}
          positive_windows=sum(x>0 for x in effects)

          def binomial_two_sided_ge(k,n):
              # Exact two-sided sign-test p for p=0.5 using symmetric tail.
              kk=max(k,n-k)
              tail=sum(math.comb(n,i) for i in range(kk,n+1))/(2**n)
              return min(1.0,2*tail)

          sign_p=binomial_two_sided_ge(positive_windows,len(effects))

          on_lat=[r['latency_ms'] for r in on_rows]; off_lat=[r['latency_ms'] for r in off_rows]
          latency_summary={
              'mc_on':{'median_ms':statistics.median(on_lat),'p25_ms':quantile(on_lat,0.25),'p75_ms':quantile(on_lat,0.75),'p95_ms':quantile(on_lat,0.95)},
              'mc_off':{'median_ms':statistics.median(off_lat),'p25_ms':quantile(off_lat,0.25),'p75_ms':quantile(off_lat,0.75),'p95_ms':quantile(off_lat,0.95)},
              'paired_off_minus_on':{'mean_ms':statistics.mean(latency_deltas),'median_ms':statistics.median(latency_deltas)},
          }

          checkpoint_recovered=(stage/'model.safetensors').exists() and len(state)>0
          real_task=(len(on_rows)==20 and all(r['tokens']>256 for r in on_rows))
          all_corpus_means_positive=all(v['mean_delta_loss_off_minus_on']>0 for v in corpus_effects.values())
          bootstrap_stable=(boot_a['ci95_low']>0 and boot_b['ci95_low']>0)
          statistical_pass=all_corpus_means_positive and bootstrap_stable
          verdict='PASS_BOUNDED_COMMUNITY_TRAINED_MULTICORPUS_STATISTICAL_EFFECT' if (checkpoint_recovered and real_task and exact_replay and statistical_pass) else 'HOLD_STATISTICAL_EFFECT_INCONSISTENT'

          weight_sha=hashlib.sha256((stage/'model.safetensors').read_bytes()).hexdigest()
          config_sha=hashlib.sha256((stage/'config.json').read_bytes()).hexdigest()
          tokenizer_sha=hashlib.sha256((stage/'tokenizer.json').read_bytes()).hexdigest()

          receipt={
              'gate':'MC_TRAINED_MULTI_CORPUS_KNOCKOUT_EFFECT_AND_STATISTICAL_REPLAY_V1',
              'verdict':verdict,
              'zero_spend':True,
              'checkpoint':{
                  'repo_id':REPO_ID,'hf_revision':HF_REVISION,'stage':STAGE,'trained':True,
                  'community_model':True,'official_paper_author_checkpoint':False,
                  'weight_sha256':weight_sha,'config_sha256':config_sha,'tokenizer_sha256':tokenizer_sha,
                  'tensors_loaded':len(state),'missing_keys':list(missing),'unexpected_keys':list(unexpected),
              },
              'model':{
                  'class':'SpikeWhaleLM','parameter_count':sum(p.numel() for p in model.parameters()),
                  'mc_gate_parameter_count':len(gate_names),'mc_gate_mean_abs_tanh':gate_mean_abs_tanh,
                  'mc_segment_len':int(getattr(cfg,'mc_segment_len',0)),
              },
              'corpora':{
                  'archive_url':archive_url,'archive_sha256':archive_sha,'members':corpus_meta,
                  'frozen_positions':positions,'window_body_tokens':window_len,'total_windows':len(windows),
                  'window_manifest':frozen_window_manifest,
              },
              'paired_windows':on_rows,
              'effect':{
                  'mean_delta_loss_off_minus_on':statistics.mean(effects),
                  'median_delta_loss_off_minus_on':statistics.median(effects),
                  'positive_windows':positive_windows,'total_windows':len(effects),
                  'positive_fraction':positive_windows/len(effects),
                  'sign_test_two_sided_p':sign_p,
                  'per_corpus':corpus_effects,
                  'all_corpus_means_positive':all_corpus_means_positive,
              },
              'bootstrap':{'seed_a':boot_a,'seed_b':boot_b,'both_ci95_above_zero':bootstrap_stable},
              'latency':latency_summary,
              'replay':{
                  'exact_logit_hash_equality':exact_replay,
                  'first_run_hashes':on_hashes,'replay_hashes':replay_hashes,
              },
              'claim_ceiling':{
                  'trained_checkpoint_recovered':checkpoint_recovered,'real_multicorpus_lm_task':real_task,
                  'inference_mc_gate_knockout':True,'paired_effect_estimate':True,'bootstrap_ci':True,
                  'official_author_checkpoint':False,'paper_parity':False,'matched_training_ablation':False,
                  'production_latency_claim':False,'universal_mc_quality_claim':False,
              },
          }
          pre=json.dumps(receipt,sort_keys=True,indent=2).encode()
          receipt['receipt_sha256_pre_field']=hashlib.sha256(pre).hexdigest()
          (OUT/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2),encoding='utf-8')
          (OUT/'paired_windows.json').write_text(json.dumps(on_rows,sort_keys=True,indent=2),encoding='utf-8')
          (OUT/'summary.json').write_text(json.dumps({
              'verdict':verdict,'mean_delta_loss':statistics.mean(effects),
              'positive_windows':positive_windows,'total_windows':len(effects),'positive_fraction':positive_windows/len(effects),
              'sign_test_p':sign_p,'bootstrap_a':boot_a,'bootstrap_b':boot_b,'per_corpus':corpus_effects,
              'latency':latency_summary,'exact_replay':exact_replay,
          },sort_keys=True,indent=2),encoding='utf-8')

          print('VERDICT',verdict)
          print('HF_REVISION',HF_REVISION)
          print('PARAMETER_COUNT',receipt['model']['parameter_count'])
          print('TOTAL_WINDOWS',len(effects))
          print('MEAN_DELTA_LOSS_OFF_MINUS_ON',statistics.mean(effects))
          print('MEDIAN_DELTA_LOSS_OFF_MINUS_ON',statistics.median(effects))
          print('POSITIVE_WINDOWS',positive_windows,'OF',len(effects))
          print('SIGN_TEST_TWO_SIDED_P',sign_p)
          print('PER_CORPUS',json.dumps(corpus_effects,sort_keys=True))
          print('BOOTSTRAP_A',json.dumps(boot_a,sort_keys=True))
          print('BOOTSTRAP_B',json.dumps(boot_b,sort_keys=True))
          print('LATENCY',json.dumps(latency_summary,sort_keys=True))
          print('EXACT_REPLAY',exact_replay)
          print('WEIGHT_SHA256',weight_sha)
          print('CORPUS_ARCHIVE_SHA256',archive_sha)
          print('RECEIPT_SHA256_PRE_FIELD',receipt['receipt_sha256_pre_field'])
          PY

      - name: Upload multicorpus statistical evidence
        uses: actions/upload-artifact@v4
        with:
          name: mc-trained-multicorpus-stat-v1
          path: outputs/mc_multicorpus_stat/
          if-no-files-found: error
          retention-days: 7
