name: ess-docker-mcp-context7-boundary-gate-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-context7-boundary-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest
  CONTEXT7_PROFILE: ess-context7-v1

jobs:
  context7-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-context7 "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-context7/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-context7/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-context7/docker-mcp-version.txt

      - name: Prove Context7 catalog remote contract and secret declaration
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" 2>&1 | tee evidence/docker-mcp-context7/catalog-pull.log
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" context7 --format json > evidence/docker-mcp-context7/context7-inspect.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/docker-mcp-context7/context7-inspect.json')
          o=json.loads(p.read_text())
          s=o.get('snapshot',{}).get('server',{})
          remote=s.get('remote',{})
          secrets=s.get('secrets',[])
          assert not s.get('image'), s.get('image')
          assert remote.get('url')=='https://mcp.context7.com/mcp', remote
          assert remote.get('transport_type')=='streamable-http', remote
          assert remote.get('headers',{}).get('CONTEXT7_API_KEY')=='${CONTEXT7_API_KEY}', remote
          assert any(x.get('env')=='CONTEXT7_API_KEY' for x in secrets), secrets
          summary={'remote_url':remote['url'],'transport_type':remote['transport_type'],'required_secret_env':'CONTEXT7_API_KEY','required_secret_name':'context7.api_key','image_backed':False}
          pathlib.Path('evidence/docker-mcp-context7/contract-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PASS_CONTEXT7_REMOTE_CONTRACT_AND_SECRET_DECLARATION')
          PY

      - name: Probe profile-bound remote compatibility without fabricating secrets
        run: |
          set -euo pipefail
          docker mcp feature enable profiles > evidence/docker-mcp-context7/profile-feature-enable.log 2>&1 || true
          set +e
          docker mcp profile create --name ESS_CONTEXT7_V1 --id "$CONTEXT7_PROFILE" \
            --server catalog://mcp/docker-mcp-catalog/context7 \
            > evidence/docker-mcp-context7/profile-create.out \
            2> evidence/docker-mcp-context7/profile-create.err
          create_rc=$?
          set -e
          printf '%s\n' "$create_rc" > evidence/docker-mcp-context7/profile-create.exit
          if [ "$create_rc" -eq 0 ]; then
            docker mcp profile show "$CONTEXT7_PROFILE" --format yaml > evidence/docker-mcp-context7/profile-show.yaml
            docker mcp profile export "$CONTEXT7_PROFILE" evidence/docker-mcp-context7/profile-export.json
            set +e
            timeout --signal=TERM --kill-after=5s 60s docker mcp gateway run --dry-run --profile "$CONTEXT7_PROFILE" --verify-signatures \
              > evidence/docker-mcp-context7/profile-dry-run.out \
              2> evidence/docker-mcp-context7/profile-dry-run.err
            profile_rc=$?
            set -e
            printf '%s\n' "$profile_rc" > evidence/docker-mcp-context7/profile-dry-run.exit
          else
            printf '%s\n' 'NOT_RUN_PROFILE_CREATE_FAILED' > evidence/docker-mcp-context7/profile-dry-run.exit
          fi

      - name: Probe Engine-only legacy no-secret boundary
        run: |
          set -euo pipefail
          : > /tmp/empty-secrets.env
          set +e
          timeout --signal=TERM --kill-after=5s 60s \
            docker mcp gateway run --dry-run --servers context7 --secrets=/tmp/empty-secrets.env --verify-signatures \
            > evidence/docker-mcp-context7/no-secret-dry-run.out \
            2> evidence/docker-mcp-context7/no-secret-dry-run.err
          dry_rc=$?
          timeout --signal=TERM --kill-after=10s 90s \
            docker mcp tools --format json \
              --gateway-arg=--servers=context7 \
              --gateway-arg=--secrets=/tmp/empty-secrets.env \
              --gateway-arg=--verify-signatures \
              ls \
            > evidence/docker-mcp-context7/no-secret-tools.json \
            2> evidence/docker-mcp-context7/no-secret-tools.err
          tools_rc=$?
          set -e
          printf '%s\n' "$dry_rc" > evidence/docker-mcp-context7/no-secret-dry-run.exit
          printf '%s\n' "$tools_rc" > evidence/docker-mcp-context7/no-secret-tools.exit
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence/docker-mcp-context7')
          raw=(root/'no-secret-tools.json').read_text() if (root/'no-secret-tools.json').exists() else ''
          tool_count=None
          if raw.strip():
              try:
                  obj=json.loads(raw)
                  tool_count=len(obj) if isinstance(obj,list) else None
              except Exception:
                  tool_count=None
          summary={'required_secret_present':False,'runtime_tool_count_without_secret':tool_count,'live_call_performed':False,'expected_status':'HOLD_CONTEXT7_API_KEY_REQUIRED'}
          (root/'runtime-boundary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Classify profile compatibility and build bounded HOLD receipt
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-mcp-context7')
          def readint(name):
              p=root/name
              try:return int(p.read_text().strip())
              except:return None
          create_rc=readint('profile-create.exit')
          profile_rc=readint('profile-dry-run.exit')
          profile_state='PROFILE_CREATE_FAILED' if create_rc not in (0,None) else ('PROFILE_DRY_RUN_PASS' if profile_rc==0 else 'PROFILE_DRY_RUN_HOLD')
          receipt={
            'gate':'ESS_DOCKER_MCP_CONTEXT7_LIVE_CALLABLE_CANARY_V1',
            'status':'HOLD_CONTEXT7_API_KEY_REQUIRED',
            'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
            'server':'context7',
            'remote_url':'https://mcp.context7.com/mcp',
            'transport_type':'streamable-http',
            'required_secret_env':'CONTEXT7_API_KEY',
            'catalog_contract':'PASS',
            'profile_compatibility_probe':profile_state,
            'secret_available_in_this_runner':False,
            'live_call_performed':False,
            'zero_spend':True,
            'secret_fabrication':False,
            'production_ready':False,
            'global_bind':False,
            'external_actuation':False
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='sha256-manifest.txt':
                  b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-context7-boundary-gate-v1
          path: evidence/docker-mcp-context7/
          if-no-files-found: error
          retention-days: 30
