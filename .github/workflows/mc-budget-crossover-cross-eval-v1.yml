name: MC Budget Crossover Cross Eval V1

on:
  push:
    branches:
      - alpha/mc-budget-crossover-cross-eval-v1
    paths:
      - .github/workflows/mc-budget-crossover-cross-eval-v1.yml
      - scripts/mc_budget_crossover_v1.py
      - scripts/mc_budget_crossover_v2.py
      - tests/test_mc_budget_crossover_v1.py
      - scripts/mc_matched_training_v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-crossover-cross-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ProofPath
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'numpy==1.26.4' 'pytest==8.3.5'
      - name: Focused preregistration tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -m pytest -q tests/test_mc_budget_crossover_v1.py
      - name: Run checkpoint cross-eval replication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/mc_budget_crossover_v1
          python scripts/mc_budget_crossover_v2.py --outdir outputs/mc_budget_crossover_v1
      - name: Hash evidence files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d outputs/mc_budget_crossover_v1 ]; then
            find outputs/mc_budget_crossover_v1 -maxdepth 1 -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > outputs/mc_budget_crossover_v1/EVIDENCE_SHA256SUMS.txt || true
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-budget-crossover-cross-eval-v1
          path: outputs/mc_budget_crossover_v1/
          if-no-files-found: error
          retention-days: 7
