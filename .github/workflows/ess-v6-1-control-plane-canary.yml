name: ESS V6.1 Real Repository Control Plane Canary

on:
  push:
    branches:
      - ess-v6-1-real-repository-control-plane-canary-v1
    paths:
      - 'control-plane-canary/v6_1/**'
      - '.github/workflows/ess-v6-1-control-plane-canary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V61_OLD_SHA256: '19864775eeebb8a1fab2fec269ac9573a6f8463efb61244fe808c0927655ecd4'
      V61_UNWORDS_SHA256: '86d0778e1327ff91fef459114ad9e9a25b6afb082fa9ad543726d97752cabf01'
    steps:
      - name: Checkout exact canary commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record provider runtime identity
        run: |
          python --version || true
          node --version
          git rev-parse HEAD
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "GITHUB_REF=${GITHUB_REF}"

      - name: Run existing ProofPath regression suite
        run: |
          node tests.mjs
          node test-ui.mjs
          node csc-2026/test.cjs

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned cryptography dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.1'

      - name: Apply Unwords patch fail closed when needed
        working-directory: control-plane-canary/v6_1
        run: |
          current="$(sha256sum alpha_full_6d_local_control_plane_v6_1.py | awk '{print $1}')"
          echo "PRE_APPLY_SOURCE_SHA256=${current}"
          if [ "${current}" = "${V61_OLD_SHA256}" ]; then
            git apply -p1 --check UNWORDS_V6_1_PATCH.diff
            git apply -p1 UNWORDS_V6_1_PATCH.diff
          elif [ "${current}" = "${V61_UNWORDS_SHA256}" ]; then
            echo "Unwords source already integrated; patch application skipped."
          else
            echo "HOLD_UNEXPECTED_V6_1_SOURCE_SHA256=${current}"
            exit 1
          fi
          echo "${V61_UNWORDS_SHA256}  alpha_full_6d_local_control_plane_v6_1.py" | sha256sum -c -

      - name: Pre-commit V6.1 and Unwords verification
        working-directory: control-plane-canary/v6_1
        run: |
          python -m py_compile alpha_full_6d_local_control_plane_v6_1.py test_canary.py test_ess_unwords_abstain_trigger_v1.py run_ess_unwords_12_case_mutation_canary_v1.py
          python test_canary.py
          mkdir -p out
          python run_ess_unwords_12_case_mutation_canary_v1.py > out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json')
          r = json.loads(p.read_text())
          assert r['cases_total'] == 12
          assert r['cases_passed'] == 12
          assert r['failures'] == 0
          assert r['errors'] == 0
          assert r['skipped'] == 0
          assert r['verdict'] == 'PASS_12_OF_12'
          PY
          sha256sum out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json > out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json.sha256
          python run_canary.py --receipt out/ESS_V6_1_GITHUB_ACTIONS_CANARY_RECEIPT_V1.json
          python run_canary.py --verify-receipt out/ESS_V6_1_GITHUB_ACTIONS_CANARY_RECEIPT_V1.json

      - name: Commit exact integrated V6.1 source if changed
        id: commit
        run: |
          if git diff --quiet -- control-plane-canary/v6_1/alpha_full_6d_local_control_plane_v6_1.py; then
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "SOURCE_ALREADY_INTEGRATED=true"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add control-plane-canary/v6_1/alpha_full_6d_local_control_plane_v6_1.py
            git commit -m 'feat: integrate Unwords semantic abstention gate into V6.1'
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "POST_COMMIT_HEAD=$(git rev-parse HEAD)"

      - name: Provider-native post-commit readback and rerun
        working-directory: control-plane-canary/v6_1
        run: |
          echo "POST_COMMIT_HEAD=$(git rev-parse HEAD)"
          echo "${V61_UNWORDS_SHA256}  alpha_full_6d_local_control_plane_v6_1.py" | sha256sum -c -
          python test_canary.py
          python run_ess_unwords_12_case_mutation_canary_v1.py > out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json').read_text())
          assert r['verdict'] == 'PASS_12_OF_12'
          assert r['cases_total'] == r['cases_passed'] == 12
          assert not r['failures'] and not r['errors'] and not r['skipped']
          PY
          sha256sum out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json > out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json.sha256

      - name: Upload provider-native canary receipts
        uses: actions/upload-artifact@v4
        with:
          name: ess-v6-1-unwords-control-plane-canary-receipts-${{ github.run_id }}
          path: |
            control-plane-canary/v6_1/out/ESS_V6_1_GITHUB_ACTIONS_CANARY_RECEIPT_V1.json
            control-plane-canary/v6_1/out/ESS_V6_1_GITHUB_ACTIONS_CANARY_RECEIPT_V1.json.sha256
            control-plane-canary/v6_1/out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json
            control-plane-canary/v6_1/out/ESS_UNWORDS_GITHUB_ACTIONS_RECEIPT_V1.json.sha256
            control-plane-canary/v6_1/out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json
            control-plane-canary/v6_1/out/ESS_UNWORDS_GITHUB_ACTIONS_POST_COMMIT_RECEIPT_V1.json.sha256
          if-no-files-found: error
          retention-days: 7
