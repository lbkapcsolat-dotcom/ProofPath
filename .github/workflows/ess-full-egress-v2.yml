name: ESS Full Egress V2
on:
  push:
    branches: [canary/full-egress-20260913-v1]
    paths: [.github/workflows/ess-full-egress-v2.yml]
permissions:
  contents: read
jobs:
  egress_cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      API: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_full_egress_gateway_v2
      KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
      SUPA: vuzphrlgkgxswjnexszw.supabase.co
    steps:
      - name: full-egress-canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ev
          printf 'runner=%s\nboot=%s\nkernel=%s\n' "$RUNNER_NAME" "$(cat /proc/sys/kernel/random/boot_id)" "$(uname -srmo)" > ev/runtime.txt
          ip route > ev/ip-route.txt
          ip -6 route > ev/ip6-route.txt || true
          rpc() {
            b=$(jq -nc --arg a "$1" --arg m "${2:-}" --arg s "${3:-}" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data "$b"
          }
          init=$(rpc init_g 'INIT_V1|REQ_GHA_EGRESS_INIT_G_02|ESS_GHA_EGRESS_CLIENT_G_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_02|TARGET_CONTROL_FULL_EGRESS|1|0888c1ceda4499a45c9dcf0559139c8f520e47aaa59155578702061604c97205|0888c1ceda4499a45c9dcf0559139c8f520e47aaa59155578702061604c97205|11111111111|GHA_FULL_EGRESS_INIT_G_02|09f28a9c757f54f085fa6c53d77345edbe43f8cc136761b2267218b960a191b2' 'd3897719f217f5645fd019596501a0ba72e5657407aa8cfb689a2f553d5d5cad80a18c1e2715c1b01277dcfac84a742c7704dbab62ca8eeb19271c4f13832f0e')
          echo "$init" > ev/init.json
          test "$(jq -r .status <<<"$init")" = GENESIS_COMMITTED
          arm=$(rpc arm_g 'ARM_FULL_EGRESS_V2|GHA_FULL_EGRESS_20260913_02|ESS_GHA_EGRESS_CLIENT_G_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_02|TARGET_CONTROL_FULL_EGRESS|0888c1ceda4499a45c9dcf0559139c8f520e47aaa59155578702061604c97205' 'ab1d976f161e0094e614e3efe20a2478c4d1efa69de572a0bb7d35bb5e8c29015c1fe1eb855be91c8c72a6a885dc951294c6f43dd8d29332a9162426b9902809')
          echo "$arm" > ev/arm.json
          test "$(jq -r .status <<<"$arm")" = EGRESS_WINDOW_ARMED

          S4=$(getent ahostsv4 "$SUPA" | awk 'NR==1{print $1}')
          G4=$(getent ahostsv4 api.github.com | awk 'NR==1{print $1}')
          E4=$(getent ahostsv4 example.com | awk 'NR==1{print $1}')
          test -n "$S4"; test -n "$G4"; test -n "$E4"
          printf 'supa=%s\ngithub=%s\nexample=%s\n' "$S4" "$G4" "$E4" > ev/ipv4.txt

          curl -4 -fsS --resolve "$SUPA:443:$S4" "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_action":"state","p_message":null,"p_signature_hex":null}' > ev/before-supa.json
          curl -4 -fsS --resolve "api.github.com:443:$G4" https://api.github.com/meta > ev/before-gh.json
          curl -4 -fsS --resolve "example.com:443:$E4" https://example.com/ > ev/before-example.html

          V6=$(getent ahostsv6 example.com | awk 'NR==1{print $1}' || true)
          IPV6=0
          if [ -n "${V6:-}" ] && curl -6 -fsS --connect-timeout 3 --max-time 6 --resolve "example.com:443:[$V6]" https://example.com/ > ev/before-v6.html 2>ev/before-v6.err; then IPV6=1; fi
          printf 'ipv6_addr=%s\nipv6_active=%s\n' "${V6:-}" "$IPV6" > ev/ipv6.txt

          sudo iptables-save > ev/v4.before
          sudo ip6tables-save > ev/v6.before
          restore() { sudo iptables-restore < ev/v4.before || true; sudo ip6tables-restore < ev/v6.before || true; }
          trap restore EXIT
          echo "deny=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" > ev/time.txt
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
          sudo ip6tables -I OUTPUT 2 -j REJECT
          sudo iptables -C OUTPUT -o lo -j ACCEPT
          sudo iptables -C OUTPUT -j REJECT
          sudo ip6tables -C OUTPUT -o lo -j ACCEPT
          sudo ip6tables -C OUTPUT -j REJECT
          sudo iptables -S OUTPUT > ev/v4.during
          sudo ip6tables -S OUTPUT > ev/v6.during

          fail4=0
          for x in "$SUPA|$S4|$API" "api.github.com|$G4|https://api.github.com/meta" "example.com|$E4|https://example.com/"; do
            IFS='|' read -r h ip u <<<"$x"
            if curl -4 -fsS --connect-timeout 2 --max-time 4 --resolve "$h:443:$ip" "$u" > /dev/null 2>>ev/blocked4.err; then exit 21; else fail4=$((fail4+1)); fi
          done
          test "$fail4" = 3
          echo "blocked_ipv4=$fail4" > ev/blocked.txt
          if [ "$IPV6" = 1 ]; then
            if curl -6 -fsS --connect-timeout 2 --max-time 4 --resolve "example.com:443:[$V6]" https://example.com/ > /dev/null 2>ev/blocked6.err; then exit 22; fi
            echo "blocked_ipv6=1" >> ev/blocked.txt
          else
            echo "blocked_ipv6=NOT_TESTABLE_NO_PREEXISTING_IPV6_EGRESS" >> ev/blocked.txt
          fi

          sleep 10
          restore
          trap - EXIT
          echo "restore=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> ev/time.txt

          success=0
          for i in $(seq 1 15); do
            after=$(rpc state)
            echo "$after" > ev/after.json
            if [ "$(jq -r .holder <<<"$after")" = ESS_GHA_EGRESS_CLIENT_H_20260913 ] && [ "$(jq -r .head_version <<<"$after")" = 2 ]; then success=1; break; fi
            sleep 1
          done
          test "$success" = 1

          curl -4 -fsS --resolve "$SUPA:443:$S4" "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{"p_action":"state","p_message":null,"p_signature_hex":null}' > ev/after-supa.json
          curl -4 -fsS --resolve "api.github.com:443:$G4" https://api.github.com/meta > ev/after-gh.json
          curl -4 -fsS --resolve "example.com:443:$E4" https://example.com/ > ev/after-example.html
          if [ "$IPV6" = 1 ]; then curl -6 -fsS --resolve "example.com:443:[$V6]" https://example.com/ > ev/after-v6.html; echo "ipv6_restore=PASS" >> ev/ipv6.txt; else echo "ipv6_restore=HOLD_ACTIVE_PATH_NOT_AVAILABLE" >> ev/ipv6.txt; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-full-egress-g
          path: ev
          if-no-files-found: error

  independent_progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      API: https://vuzphrlgkgxswjnexszw.supabase.co/rest/v1/rpc/ess_full_egress_gateway_v2
      KEY: sb_publishable_ZMfNGwnPuVmIrFXW5lmivA_aZ0gGwZk
    steps:
      - name: takeover-and-commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evh
          printf 'runner=%s\nboot=%s\nkernel=%s\n' "$RUNNER_NAME" "$(cat /proc/sys/kernel/random/boot_id)" "$(uname -srmo)" > evh/runtime.txt
          rpc() {
            b=$(jq -nc --arg a "$1" --arg m "${2:-}" --arg s "${3:-}" '{p_action:$a,p_message:(if $m=="" then null else $m end),p_signature_hex:(if $s=="" then null else $s end)}')
            curl -sS --fail-with-body "$API" -H "apikey: $KEY" -H 'Content-Type: application/json' --data "$b"
          }
          ok=0
          for i in $(seq 1 40); do
            r=$(rpc takeover_h 'TAKEOVER_V1|REQ_GHA_EGRESS_TAKEOVER_H_02|ESS_GHA_EGRESS_CLIENT_H_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_02|TARGET_CONTROL_FULL_EGRESS|ESS_GHA_EGRESS_CLIENT_G_20260913|1|1|0888c1ceda4499a45c9dcf0559139c8f520e47aaa59155578702061604c97205' 'b332832f8f00b6f95eb099371fb1d4e33225cc848800c8af08712db51eeaa835316812ab241882e359345c14d6a38387015537f6191393a73895cf26bb33ee0d')
            echo "$r" > "evh/takeover-$i.json"
            s=$(jq -r .status <<<"$r")
            if [ "$s" = TAKEOVER_COMMITTED ]; then ok=1; echo "takeover=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" > evh/time.txt; break; fi
            test "$s" = WAIT_ARM -o "$s" = WAIT_ACTIVATION
            sleep 1
          done
          test "$ok" = 1
          a=$(rpc append_h 'APPEND_V1|REQ_GHA_EGRESS_APPEND_H_02|ESS_GHA_EGRESS_CLIENT_H_20260913|ESS_GHA_FULL_EGRESS_CANARY_20260913_02|TARGET_CONTROL_FULL_EGRESS|2|2|2|0888c1ceda4499a45c9dcf0559139c8f520e47aaa59155578702061604c97205|68086248696f39fbf473a9ae3f591fcb74cfaf9acfb81209223f81913961054b|68086248696f39fbf473a9ae3f591fcb74cfaf9acfb81209223f81913961054b|11111111111|GHA_FULL_EGRESS_APPEND_H_V2_02|591b2e73640233a5e8f3d6c1d446a75c16bb30d0658100d89e53d0f60017f502' 'fbbdb0ca5e3934bd9cca4ae77152270f9af4d57d86760f12959c9cfb4a7fd73ffc46bfdecdbdafce314d2c91d96dc05a772aa9e9744c01878cb7a358e5b43407')
          echo "$a" > evh/append.json
          test "$(jq -r .status <<<"$a")" = RECEIPT_COMMITTED
          echo "append=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> evh/time.txt
          rpc state > evh/state.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-full-egress-h
          path: evh
          if-no-files-found: error
