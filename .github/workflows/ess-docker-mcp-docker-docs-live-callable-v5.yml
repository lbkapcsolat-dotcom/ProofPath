name: ess-docker-mcp-docker-docs-live-callable-v5

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-docker-docs-live-callable-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  docker-docs-dynamic-session-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-docs-v5 "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
            f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
            headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-docs-v5/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-docs-v5/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-docs-v5/docker-mcp-version.txt

      - name: Freeze official Docker Docs contract and enable dynamic tools
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > evidence/docker-docs-v5/catalog-pull.log 2>&1
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" docker-docs --format json > evidence/docker-docs-v5/docker-docs-inspect.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence/docker-docs-v5')
          o=json.loads((root/'docker-docs-inspect.json').read_text()); s=o['snapshot']['server']; r=s.get('remote') or {}
          assert o.get('type')=='remote' and s.get('type')=='remote'
          assert o.get('endpoint')=='https://mcp-docs.docker.com/mcp'
          assert r.get('transport_type')=='streamable-http' and r.get('url')=='https://mcp-docs.docker.com/mcp'
          assert not s.get('secrets')
          (root/'contract-summary.json').write_text(json.dumps({'server':'docker-docs','type':'remote','remote_url':r['url'],'transport_type':r['transport_type'],'secret_required':False,'catalog_contract':'PASS'},indent=2,sort_keys=True))
          print('PASS_DOCKER_DOCS_CATALOG_CONTRACT')
          PY
          docker mcp feature enable dynamic-tools > evidence/docker-docs-v5/dynamic-tools-enable.log 2>&1 || true
          docker mcp feature list > evidence/docker-docs-v5/features.txt
          grep -A1 'dynamic-tools' evidence/docker-docs-v5/features.txt | grep -F 'enabled'

      - name: Build persistent MCP client with direct and mcp-exec paths
        run: |
          set -euxo pipefail
          mkdir -p /tmp/docker-docs-client-v5
          cat > /tmp/docker-docs-client-v5/go.mod <<'EOF'
          module ess-docker-docs-canary-v5
          go 1.25.0
          require github.com/modelcontextprotocol/go-sdk v1.4.1
          EOF
          cat > /tmp/docker-docs-client-v5/main.go <<'EOF'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "os"
            "os/exec"
            "path/filepath"
            "strings"
            "time"
            "github.com/modelcontextprotocol/go-sdk/mcp"
          )

          func must(err error) { if err != nil { panic(err) } }
          func writeJSON(path string, v any) {
            b, err := json.MarshalIndent(v, "", "  "); must(err)
            must(os.WriteFile(path, append(b,'\n'),0644))
          }
          func generic(v any) map[string]any {
            b,_:=json.Marshal(v); var m map[string]any; must(json.Unmarshal(b,&m)); return m
          }
          func textFromResult(v any) string {
            b,_:=json.Marshal(v); var x any; _=json.Unmarshal(b,&x)
            var walk func(any) string
            walk=func(n any) string {
              switch t:=n.(type) {
              case map[string]any:
                if s,ok:=t["text"].(string); ok { return s }
                for _,v:=range t { if s:=walk(v); s!="" { return s } }
              case []any:
                for _,v:=range t { if s:=walk(v); s!="" { return s } }
              }
              return ""
            }
            return walk(x)
          }
          func toolsFromAddText(s string) []map[string]any {
            i:=strings.Index(s,"```json")
            if i<0 { return nil }
            rest:=s[i+7:]; j:=strings.Index(rest,"```")
            if j<0 { return nil }
            var x struct{ Tools []map[string]any `json:"tools"` }
            if json.Unmarshal([]byte(strings.TrimSpace(rest[:j])),&x)!=nil { return nil }
            return x.Tools
          }
          func chooseTool(tools []map[string]any) (map[string]any,string) {
            preferred:=[]string{"query","search_query","q","text","question","topic"}
            for _,t:=range tools {
              name,_:=t["name"].(string); desc,_:=t["description"].(string)
              low:=strings.ToLower(name+" "+desc)
              if strings.HasPrefix(name,"mcp-") || name=="code-mode" { continue }
              if !(strings.Contains(low,"search")||strings.Contains(low,"doc")||strings.Contains(low,"query")||strings.Contains(low,"docker")) { continue }
              schema,_:=t["inputSchema"].(map[string]any); if schema==nil { schema,_=t["input_schema"].(map[string]any) }
              props,_:=schema["properties"].(map[string]any)
              for _,k:=range preferred { if _,ok:=props[k]; ok { return t,k } }
            }
            return nil,""
          }

          func main() {
            root:=os.Getenv("EVIDENCE_DIR")
            ctx,cancel:=context.WithTimeout(context.Background(),120*time.Second); defer cancel()
            // IMPORTANT: no --servers flag. Docker's gateway source explicitly disables
            // dynamic-tools whenever --servers is supplied.
            cmd:=exec.CommandContext(ctx,"docker","mcp","gateway","run")
            stderr,err:=os.Create(filepath.Join(root,"gateway-stderr.log")); must(err); defer stderr.Close(); cmd.Stderr=stderr
            client:=mcp.NewClient(&mcp.Implementation{Name:"ess-docker-docs-canary-v5",Version:"1.0.0"},nil)
            session,err:=client.Connect(ctx,&mcp.CommandTransport{Command:cmd},nil); must(err); defer session.Close()

            before,err:=session.ListTools(ctx,&mcp.ListToolsParams{}); must(err); writeJSON(filepath.Join(root,"tools-before-add.json"),before)
            hasAdd:=false
            for _,t:=range before.Tools { if t.Name=="mcp-add" { hasAdd=true } }
            if !hasAdd { panic("dynamic-tools enabled in CLI but mcp-add absent without --servers") }

            add,err:=session.CallTool(ctx,&mcp.CallToolParams{Name:"mcp-add",Arguments:map[string]any{"name":"docker-docs"}})
            if err!=nil { panic(fmt.Errorf("mcp-add failed: %w",err)) }
            writeJSON(filepath.Join(root,"mcp-add-result.json"),add)
            if add.IsError { panic("mcp-add returned IsError") }
            addText:=textFromResult(add)
            must(os.WriteFile(filepath.Join(root,"mcp-add-result.txt"),[]byte(addText+"\n"),0644))
            if !strings.Contains(strings.ToLower(addText),"successfully added") { panic("mcp-add did not report successful server addition") }

            after,err:=session.ListTools(ctx,&mcp.ListToolsParams{}); must(err); writeJSON(filepath.Join(root,"tools-after-add.json"),after)
            visible:=make([]map[string]any,0,len(after.Tools))
            for _,t:=range after.Tools { visible=append(visible,generic(t)) }
            selected,key:=chooseTool(visible)
            callPath:="direct"
            if selected==nil {
              selected,key=chooseTool(toolsFromAddText(addText))
              callPath="mcp-exec"
            }
            if selected==nil || key=="" { panic("no callable Docker Docs search/query tool found after successful mcp-add") }
            writeJSON(filepath.Join(root,"selected-tool.json"),selected)
            name,_:=selected["name"].(string)
            query:="Docker Compose depends_on service_healthy healthcheck semantics and recommended configuration"
            args:=map[string]any{key:query}
            var res *mcp.CallToolResult
            if callPath=="direct" {
              res,err=session.CallTool(ctx,&mcp.CallToolParams{Name:name,Arguments:args})
            } else {
              res,err=session.CallTool(ctx,&mcp.CallToolParams{Name:"mcp-exec",Arguments:map[string]any{"name":name,"arguments":args}})
            }
            if err!=nil { panic(fmt.Errorf("Docker Docs tool call failed via %s: %w",callPath,err)) }
            writeJSON(filepath.Join(root,"live-docs-query.json"),res)
            if res.IsError { panic("Docker Docs tool returned IsError") }
            rb,_:=json.Marshal(res); low:=strings.ToLower(string(rb))
            if !(strings.Contains(low,"compose")||strings.Contains(low,"depends_on")||strings.Contains(low,"health")||strings.Contains(low,"docker")) { panic("live Docker Docs response lacks expected query evidence") }
            writeJSON(filepath.Join(root,"selected-call-summary.json"),map[string]any{"tool":name,"argument_key":key,"query":query,"call_path":callPath})
            fmt.Println("PASS_DOCKER_MCP_DOCKER_DOCS_DYNAMIC_SESSION_LIVE_CALLABLE")
          }
          EOF
          cd /tmp/docker-docs-client-v5
          go mod tidy
          sha256sum main.go go.mod go.sum | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v5/client-source-sha256.txt"
          go build -o /tmp/docker-docs-client-v5/canary .
          sha256sum /tmp/docker-docs-client-v5/canary | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v5/client-binary-sha256.txt"
          go version | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v5/go-version.txt"

      - name: Execute final persistent-session live canary
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence/docker-docs-v5
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=10s 150s /tmp/docker-docs-client-v5/canary \
            > "$EVIDENCE_DIR/persistent-client.out" \
            2> "$EVIDENCE_DIR/persistent-client.err"
          grep -F 'PASS_DOCKER_MCP_DOCKER_DOCS_DYNAMIC_SESSION_LIVE_CALLABLE' "$EVIDENCE_DIR/persistent-client.out"
          echo PASS_DOCKER_MCP_DOCKER_DOCS_LIVE_CALLABLE | tee "$EVIDENCE_DIR/gate-status.txt"

      - name: Build bounded receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-docs-v5')
          c=json.loads((root/'contract-summary.json').read_text()); s=json.loads((root/'selected-call-summary.json').read_text())
          receipt={
            'gate':'DOCKER_DOCS_LIVE_CALLABLE_V1',
            'implementation':'V5_DYNAMIC_SESSION_NO_SERVERS_FLAG',
            'status':'PASS_DOCKER_MCP_DOCKER_DOCS_LIVE_CALLABLE',
            'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
            'server':'docker-docs','tool':s['tool'],'argument_key':s['argument_key'],'call_path':s['call_path'],
            'remote_url':c['remote_url'],'transport_type':c['transport_type'],'query_scope':s['query'],
            'zero_spend':True,'secret_injected':False,'read_only_query':True,'external_actuation':False,
            'production_ready':False,'global_bind':False,
            'session_chain':['initialize','tools/list(mcp-add present)','mcp-add(docker-docs)','tools/list','direct-or-mcp-exec docs query'],
            'v4_root_cause':'--servers intentionally disables dynamic-tools in Docker gateway source'
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-docker-docs-live-callable-v5
          path: evidence/docker-docs-v5/
          if-no-files-found: error
          retention-days: 30
