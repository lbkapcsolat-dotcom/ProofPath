name: ESS HGraph Runtime Admission Custody

on:
  push:
    branches:
      - ess-hgraph-native-cpp-parity-canary-v1
    paths:
      - 'hgraph_canary/cpp/**'
      - 'hgraph_canary/native_cpp_super/**'
      - 'hgraph_canary/runtime_admission.py'
      - 'hgraph_canary/wolfram_oracle_v1.json'
      - '.github/workflows/ess-hgraph-runtime-admission-custody.yml'
  workflow_dispatch:

jobs:
  runner_a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ProofPath exact commit
        uses: actions/checkout@v4

      - name: Checkout exact hgraph 0.8.23 source
        uses: actions/checkout@v4
        with:
          repository: hhenson/hgraph
          ref: f3713aeecc97597ec2bd623f7d41687e62c03b77
          path: _vendor/hgraph

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned native dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'cmake==4.4.2' 'ninja==1.13.0' 'pyarrow==25.0.0'

      - name: Expose Arrow runtime libraries
        shell: python
        run: |
          import os
          from pathlib import Path
          import pyarrow
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(Path(pyarrow.__file__).resolve().parent) + '\n')

      - name: Configure exact-source hgraph plus ESS C++ canary
        run: |
          cmake -S hgraph_canary/native_cpp_super -B _build/ess-hgraph-cpp -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHGRAPH_SOURCE_DIR="$PWD/_vendor/hgraph" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build exact native executable
        run: cmake --build _build/ess-hgraph-cpp --target ess_hgraph_cpp_canary --parallel 2

      - name: Replay A and materialize exact-byte custody bundle
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          bundle = Path('custody_bundle')
          bundle.mkdir(exist_ok=True)
          binary = Path('_build/ess-hgraph-cpp/ess_canary/ess_hgraph_cpp_canary')
          oracle = Path('hgraph_canary/wolfram_oracle_v1.json')

          run = subprocess.run([str(binary)], check=True, text=True, capture_output=True)
          (bundle / 'run_a.log').write_text(run.stdout, encoding='utf-8')
          lines = dict(line.split('=', 1) for line in run.stdout.splitlines() if '=' in line)
          observed = lines['OBSERVED_VECTOR']
          state_count = int(lines['STATE_COUNT'])
          parity_pass = lines.get('WOLFRAM_PARITY_256_256') == 'PASS'

          oracle_data = json.loads(oracle.read_text(encoding='utf-8'))
          expected_vector = oracle_data['vector']
          output_bytes = (observed + '\n').encode()
          expected_bytes = (expected_vector + '\n').encode()

          evidence = {
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'hgraph_commit': subprocess.check_output(['git','-C','_vendor/hgraph','rev-parse','HEAD'], text=True).strip(),
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'oracle_sha256': hashlib.sha256(oracle.read_bytes()).hexdigest(),
              'expected_output_sha256': hashlib.sha256(expected_bytes).hexdigest(),
              'output_sha256': hashlib.sha256(output_bytes).hexdigest(),
              'state_count': state_count,
              'parity_pass': parity_pass,
              'runner': 'A',
          }
          assert state_count == 256
          assert parity_pass
          assert observed == expected_vector
          assert evidence['output_sha256'] == evidence['expected_output_sha256']

          shutil.copy2(binary, bundle / 'ess_hgraph_cpp_canary')
          shutil.copy2(oracle, bundle / 'wolfram_oracle_v1.json')
          (bundle / 'observed_vector_a.txt').write_bytes(output_bytes)
          (bundle / 'custody_a.json').write_text(json.dumps(evidence, sort_keys=True, indent=2), encoding='utf-8')
          print(json.dumps(evidence, sort_keys=True))

      - name: Upload exact executable custody bundle
        uses: actions/upload-artifact@v4
        with:
          name: ess-hgraph-runtime-custody-bundle
          path: custody_bundle/
          if-no-files-found: error
          retention-days: 7

  runner_b:
    needs: runner_a
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout same ProofPath commit
        uses: actions/checkout@v4

      - name: Checkout same exact hgraph source identity
        uses: actions/checkout@v4
        with:
          repository: hhenson/hgraph
          ref: f3713aeecc97597ec2bd623f7d41687e62c03b77
          path: _vendor/hgraph

      - name: Set up Python 3.12 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependency only
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'pyarrow==25.0.0'

      - name: Expose Arrow runtime libraries
        shell: python
        run: |
          import os
          from pathlib import Path
          import pyarrow
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(Path(pyarrow.__file__).resolve().parent) + '\n')

      - name: Download Runner A exact-byte bundle
        uses: actions/download-artifact@v4
        with:
          name: ess-hgraph-runtime-custody-bundle
          path: custody_bundle

      - name: Verify exact-byte custody, replay B, and decide admission
        shell: python
        run: |
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from hgraph_canary.runtime_admission import evaluate_runtime_admission

          bundle = Path('custody_bundle')
          binary = bundle / 'ess_hgraph_cpp_canary'
          oracle = bundle / 'wolfram_oracle_v1.json'
          custody_a = json.loads((bundle / 'custody_a.json').read_text(encoding='utf-8'))

          binary.chmod(binary.stat().st_mode | stat.S_IXUSR)
          source_commit_b = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          hgraph_commit_b = subprocess.check_output(['git','-C','_vendor/hgraph','rev-parse','HEAD'], text=True).strip()
          binary_sha_b = hashlib.sha256(binary.read_bytes()).hexdigest()
          oracle_sha_b = hashlib.sha256(oracle.read_bytes()).hexdigest()

          run = subprocess.run([str(binary)], check=True, text=True, capture_output=True)
          (bundle / 'run_b.log').write_text(run.stdout, encoding='utf-8')
          lines = dict(line.split('=', 1) for line in run.stdout.splitlines() if '=' in line)
          observed_b = lines['OBSERVED_VECTOR']
          state_count_b = int(lines['STATE_COUNT'])
          parity_b = lines.get('WOLFRAM_PARITY_256_256') == 'PASS'
          output_sha_b = hashlib.sha256((observed_b + '\n').encode()).hexdigest()

          evidence = {
              'source_commit_a': custody_a['source_commit'],
              'source_commit_b': source_commit_b,
              'hgraph_commit_a': custody_a['hgraph_commit'],
              'hgraph_commit_b': hgraph_commit_b,
              'binary_sha256_a': custody_a['binary_sha256'],
              'binary_sha256_b': binary_sha_b,
              'oracle_sha256_a': custody_a['oracle_sha256'],
              'oracle_sha256_b': oracle_sha_b,
              'output_sha256_a': custody_a['output_sha256'],
              'output_sha256_b': output_sha_b,
              'expected_output_sha256': custody_a['expected_output_sha256'],
              'state_count_a': custody_a['state_count'],
              'state_count_b': state_count_b,
              'parity_pass_a': custody_a['parity_pass'],
              'parity_pass_b': parity_b,
          }
          decision = evaluate_runtime_admission(evidence)
          receipt = {
              'gate': 'HGRAPH_NATIVE_CPP_EXECUTABLE_BYTE_CUSTODY_AND_RUNTIME_ADMISSION_V1',
              'mode': 'EXACT_BINARY_CUSTODY__TWO_ISOLATED_REPLAYS__FAIL_CLOSED',
              'evidence': evidence,
              'decision': decision,
              'claim_boundary': {
                  'production_readiness': False,
                  'pointer_promotion': False,
                  'global_bind': False,
                  'main_merge': False,
              },
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          (bundle / 'runtime_admission_receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2), encoding='utf-8')

          print('RUNTIME_ADMISSION_VERDICT=' + decision['verdict'])
          print('RUNTIME_ADMISSION=' + str(decision['runtime_admission']).upper())
          print('RECEIPT_SHA256=' + receipt['receipt_sha256'])
          if not decision['runtime_admission']:
              raise SystemExit(1)

      - name: Upload runtime admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: ess-hgraph-runtime-admission-receipt
          path: custody_bundle/runtime_admission_receipt.json
          if-no-files-found: error
          retention-days: 7
