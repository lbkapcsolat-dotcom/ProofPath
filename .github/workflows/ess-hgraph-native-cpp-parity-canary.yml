name: ESS HGraph Native C++ Parity Canary

on:
  push:
    branches:
      - ess-hgraph-native-cpp-parity-canary-v1
    paths:
      - 'hgraph_canary/cpp/**'
      - '.github/workflows/ess-hgraph-native-cpp-parity-canary.yml'
  workflow_dispatch:

jobs:
  native-cpp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ProofPath exact commit
        uses: actions/checkout@v4

      - name: Checkout exact hgraph 0.8.23 source
        uses: actions/checkout@v4
        with:
          repository: hhenson/hgraph
          ref: f3713aeecc97597ec2bd623f7d41687e62c03b77
          path: _vendor/hgraph

      - name: Set up Python 3.12 for upstream Arrow build contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install upstream native build dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'cmake==4.4.2' 'ninja==1.13.0' 'pyarrow==25.0.0'

      - name: Expose Arrow runtime libraries
        shell: python
        run: |
          import os
          from pathlib import Path
          import pyarrow
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(Path(pyarrow.__file__).resolve().parent) + '\n')

      - name: Record source identities
        run: |
          git rev-parse HEAD
          git -C _vendor/hgraph rev-parse HEAD
          cmake --version
          c++ --version
          python --version
          python -c "import pyarrow; print('pyarrow=', pyarrow.__version__)"

      - name: Configure hgraph SDK
        run: |
          cmake -S _vendor/hgraph -B _build/hgraph -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHGRAPH_BUILD_PYTHON_BINDINGS=OFF \
            -DHGRAPH_ENABLE_PYTHON_USER_NODES=OFF \
            -DHGRAPH_ENABLE_IDE_PYTHON_HEADER_HINTS=OFF \
            -DHGRAPH_USE_PYARROW_ARROW=ON \
            -DHGRAPH_FETCH_DATE=ON \
            -DHGRAPH_FETCH_SIMDJSON=ON \
            -DHGRAPH_ENABLE_PCH=OFF \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build and install hgraph SDK
        run: |
          cmake --build _build/hgraph --target hgraph_stdlib --parallel 2
          cmake --install _build/hgraph --prefix "$PWD/_install/hgraph"

      - name: Configure downstream C++ canary
        run: |
          cmake -S hgraph_canary/cpp -B _build/ess-hgraph-cpp -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/_install/hgraph"

      - name: Build RED C++ canary
        run: cmake --build _build/ess-hgraph-cpp --parallel 2
