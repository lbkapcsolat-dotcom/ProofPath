name: ESS HGraph Native C++ Parity Canary

on:
  push:
    branches:
      - ess-hgraph-native-cpp-parity-canary-v1
    paths:
      - 'hgraph_canary/cpp/**'
      - 'hgraph_canary/native_cpp_super/**'
      - '.github/workflows/ess-hgraph-native-cpp-parity-canary.yml'
  workflow_dispatch:

jobs:
  native-cpp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ProofPath exact commit
        uses: actions/checkout@v4

      - name: Checkout exact hgraph 0.8.23 source
        uses: actions/checkout@v4
        with:
          repository: hhenson/hgraph
          ref: f3713aeecc97597ec2bd623f7d41687e62c03b77
          path: _vendor/hgraph

      - name: Set up Python 3.12 for upstream Arrow build contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded native build dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'cmake==4.4.2' 'ninja==1.13.0' 'pyarrow==25.0.0'

      - name: Expose Arrow runtime libraries
        shell: python
        run: |
          import os
          from pathlib import Path
          import pyarrow
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(Path(pyarrow.__file__).resolve().parent) + '\n')

      - name: Record source identities
        run: |
          git rev-parse HEAD
          git -C _vendor/hgraph rev-parse HEAD
          cmake --version
          c++ --version
          python --version
          python -c "import pyarrow; print('pyarrow=', pyarrow.__version__)"

      - name: Configure exact-source hgraph plus ESS C++ canary
        run: |
          cmake -S hgraph_canary/native_cpp_super -B _build/ess-hgraph-cpp -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHGRAPH_SOURCE_DIR="$PWD/_vendor/hgraph" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build GREEN C++ parity canary
        run: cmake --build _build/ess-hgraph-cpp --target ess_hgraph_cpp_canary --parallel 2

      - name: Run native 256-state Wolfram parity canary
        run: ./_build/ess-hgraph-cpp/ess_canary/ess_hgraph_cpp_canary
