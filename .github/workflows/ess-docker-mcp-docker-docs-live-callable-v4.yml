name: ess-docker-mcp-docker-docs-live-callable-v4

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-docker-docs-live-callable-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  docker-docs-persistent-session-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-docs-v4 "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
            f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
            headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-docs-v4/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-docs-v4/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-docs-v4/docker-mcp-version.txt

      - name: Freeze official Docker Docs contract
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > evidence/docker-docs-v4/catalog-pull.log 2>&1
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" docker-docs --format json > evidence/docker-docs-v4/docker-docs-inspect.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence/docker-docs-v4')
          o=json.loads((root/'docker-docs-inspect.json').read_text()); s=o['snapshot']['server']; r=s.get('remote') or {}
          assert o.get('type')=='remote' and s.get('type')=='remote'
          assert o.get('endpoint')=='https://mcp-docs.docker.com/mcp'
          assert r.get('transport_type')=='streamable-http' and r.get('url')=='https://mcp-docs.docker.com/mcp'
          assert not s.get('secrets')
          (root/'contract-summary.json').write_text(json.dumps({'server':'docker-docs','type':'remote','remote_url':r['url'],'transport_type':r['transport_type'],'secret_required':False,'catalog_contract':'PASS'},indent=2,sort_keys=True))
          print('PASS_DOCKER_DOCS_CATALOG_CONTRACT')
          PY
          docker mcp feature enable dynamic-tools > evidence/docker-docs-v4/dynamic-tools-enable.log 2>&1 || true
          docker mcp feature list > evidence/docker-docs-v4/features.txt

      - name: Rehydrate exact V3 persistent client and resolve module graph
        run: |
          set -euxo pipefail
          mkdir -p /tmp/docker-docs-client
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/ess-docker-mcp-docker-docs-live-callable-v3.yml').read_text()
          start="          cat > main.go <<'EOF'\n"
          i=src.index(start)+len(start)
          j=src.index("\n          EOF",i)
          block=src[i:j]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/docker-docs-client/main.go').write_text('\n'.join(lines)+'\n')
          PY
          cat > /tmp/docker-docs-client/go.mod <<'EOF'
          module ess-docker-docs-canary
          go 1.25.0
          require github.com/modelcontextprotocol/go-sdk v1.4.1
          EOF
          cd /tmp/docker-docs-client
          go mod tidy
          sha256sum main.go go.mod go.sum | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v4/client-source-sha256.txt"
          go version | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v4/go-version.txt"
          go build -o /tmp/docker-docs-client/canary .
          sha256sum /tmp/docker-docs-client/canary | tee "$GITHUB_WORKSPACE/evidence/docker-docs-v4/client-binary-sha256.txt"

      - name: Execute persistent-session live canary
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence/docker-docs-v4
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=10s 150s /tmp/docker-docs-client/canary \
            > "$EVIDENCE_DIR/persistent-client.out" \
            2> "$EVIDENCE_DIR/persistent-client.err"
          grep -F 'PASS_DOCKER_MCP_DOCKER_DOCS_PERSISTENT_SESSION_LIVE_CALLABLE' "$EVIDENCE_DIR/persistent-client.out"
          echo PASS_DOCKER_MCP_DOCKER_DOCS_LIVE_CALLABLE | tee "$EVIDENCE_DIR/gate-status.txt"

      - name: Build bounded receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-docs-v4')
          c=json.loads((root/'contract-summary.json').read_text()); s=json.loads((root/'selected-call-summary.json').read_text())
          receipt={'gate':'DOCKER_DOCS_LIVE_CALLABLE_V1','implementation':'V4_SINGLE_PERSISTENT_MCP_SESSION_RESOLVED_MODULE_GRAPH','status':'PASS_DOCKER_MCP_DOCKER_DOCS_LIVE_CALLABLE','gateway_version':os.environ['MCP_GATEWAY_VERSION'],'server':'docker-docs','tool':s['tool'],'argument_key':s['argument_key'],'remote_url':c['remote_url'],'transport_type':c['transport_type'],'query_scope':s['query'],'zero_spend':True,'secret_injected':False,'read_only_query':True,'external_actuation':False,'production_ready':False,'global_bind':False,'session_chain':['initialize','tools/list','mcp-add(docker-docs)','tools/list','docs tool call'],'v3_failure_boundary':'GO_SUM_NOT_MATERIALIZED_BEFORE_RUN'}
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-docker-docs-live-callable-v4
          path: evidence/docker-docs-v4/
          if-no-files-found: error
          retention-days: 30
