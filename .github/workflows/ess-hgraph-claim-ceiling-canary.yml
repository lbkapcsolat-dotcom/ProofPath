name: ESS HGraph Claim Ceiling Canary

on:
  push:
    branches:
      - ess-hgraph-claim-ceiling-canary-v1
    paths:
      - 'hgraph_canary/**'
      - '.github/workflows/ess-hgraph-claim-ceiling-canary.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact event-window commit
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bounded hgraph runtime
        run: |
          python -m pip install --disable-pip-version-check 'hgraph>=0.8,<0.9' pytest

      - name: Record runtime identity
        run: |
          python --version
          python - <<'PY'
          import hgraph
          print('hgraph_module=', hgraph.__file__)
          print('hgraph_version=', getattr(hgraph, '__version__', 'UNKNOWN'))
          PY
          git rev-parse HEAD

      - name: Run RED contract tests
        run: pytest -q hgraph_canary/test_claim_gate.py
