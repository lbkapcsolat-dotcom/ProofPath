name: HV V6.1 Runtime CI Stability V1

on:
  push:
    branches:
      - ess-v6-1-real-repository-control-plane-canary-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-ci-stability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact provider commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned cryptography dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.1'

      - name: Record provider identity
        run: |
          python --version
          git rev-parse HEAD
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"

      - name: Run repeated cold-start double-spend stability test
        working-directory: control-plane-canary/v6_1
        run: python test_hv_v6_1_ci_stability_v1.py
