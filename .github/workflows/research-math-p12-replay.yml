name: Research Math P12 Isolated Replay

on:
  push:
    branches:
      - research-math-p0-verifier
    paths:
      - "research_math/**"
      - ".github/workflows/research-math-p0.yml"
      - ".github/workflows/research-math-p3.yml"
      - ".github/workflows/research-math-p12-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-lean:
    name: P12 Replay Lean + Mathlib
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install hash-verified Elan 4.2.4
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -o /tmp/elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Materialize pinned Lake manifest
        working-directory: research_math/lean
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" update
          test -s lake-manifest.json

      - name: Kernel build + independent leanchecker
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: research_math/lean
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          leanchecker: true
          nanoda: false

      - name: Negative placeholder gate + replay receipt
        run: |
          set -euo pipefail
          if git grep --line-number -E '\b(sorry|admit)\b' -- 'research_math/lean/*.lean'; then
            echo 'Forbidden proof placeholder found in tracked project source.' >&2
            exit 1
          fi
          mkdir -p out/replay/lean
          (
            cd research_math/lean
            lake env lean --version
            echo 'PROOFPATH_EVIDENCE THM-LIVE formal_kernel_proof formal_target=ResearchMathP0.square_nonnegative'
            echo 'lean_kernel_build=PASS'
            echo 'leanchecker=PASS'
            echo 'placeholder_gate=PASS'
          ) | tee out/replay/lean/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile lean --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/replay/lean/raw.log --repo-root . \
            --output out/replay/lean/receipt.json

      - name: Preserve replay Lean receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-replay-lean-${{ github.sha }}
          path: out/replay/lean
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  replay-arb:
    name: P12 Replay FLINT/Arb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip --version
      - name: Install hash-pinned python-flint
        run: .venv/bin/python -m pip install --require-hashes -r research_math/flint/requirements.txt
      - name: Execute replay Arb witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/replay/arb
          .venv/bin/python research_math/flint/canary.py | tee out/replay/arb/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile arb --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/replay/arb/raw.log --repo-root . \
            --output out/replay/arb/receipt.json
      - name: Preserve replay Arb receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-replay-arb-${{ github.sha }}
          path: out/replay/arb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  replay-julia:
    name: P12 Replay Julia/HPC
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install exact Julia 1.12.7
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12.7'
          arch: 'x64'
      - name: Execute replay Julia witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/replay/julia
          julia research_math/julia/canary.jl | tee out/replay/julia/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile julia --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/replay/julia/raw.log --repo-root . \
            --output out/replay/julia/receipt.json
      - name: Preserve replay Julia receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-replay-julia-${{ github.sha }}
          path: out/replay/julia
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  replay-sage:
    name: P12 Replay SageMath
    runs-on: ubuntu-latest
    env:
      SAGE_IMAGE: sagemath/sagemath@sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Pull exact SageMath 10.9 image digest
        run: |
          set -euo pipefail
          docker pull "$SAGE_IMAGE"
          resolved="$(docker image inspect --format='{{index .RepoDigests 0}}' "$SAGE_IMAGE")"
          test "$resolved" = "$SAGE_IMAGE"
      - name: Execute replay Sage witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/replay/sage
          docker run --rm -v "$PWD:/work:ro" -w /work "$SAGE_IMAGE" \
            sage -python research_math/sage/canary.py | tee out/replay/sage/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile sage --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/replay/sage/raw.log --repo-root . \
            --output out/replay/sage/receipt.json
      - name: Preserve replay Sage receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-replay-sage-${{ github.sha }}
          path: out/replay/sage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  replay-bind-and-compare:
    name: P12 Second isolated bind + cross-run consistency
    needs: [replay-lean, replay-arb, replay-julia, replay-sage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read back replay engine artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-replay-*-${{ github.sha }}
          path: out/replay-input
          merge-multiple: false

      - name: Build second isolated live binding
        run: |
          set -euo pipefail
          mkdir -p out/replay-bound
          python3 research_math/orchestrator/live_evidence.py bind \
            --receipts-root out/replay-input --repo-root . \
            --claims research_math/orchestrator/live_claims.json \
            --source-sha "$GITHUB_SHA" \
            --output out/replay-bound/live-math-assurance.json

      - name: Resolve successful primary run for exact SHA
        id: primary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/primary-meta
          primary_run=''
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/research-math-p0.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=10" \
              > out/primary-meta/runs.json
            primary_run="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('out/primary-meta/runs.json').read_text())
          for run in data.get('workflow_runs', []):
              if run.get('head_sha') == __import__('os').environ['GITHUB_SHA'] and run.get('status') == 'completed' and run.get('conclusion') == 'success':
                  print(run['id'])
                  break
          PY
            )"
            if [ -n "$primary_run" ]; then break; fi
            sleep 5
          done
          if [ -z "$primary_run" ]; then
            echo 'No successful primary Research Math Verification run found for exact source SHA.' >&2
            exit 1
          fi
          test "$primary_run" != "$GITHUB_RUN_ID"
          echo "run_id=$primary_run" >> "$GITHUB_OUTPUT"
          echo "primary_run_id=$primary_run"
          echo "replay_run_id=$GITHUB_RUN_ID"

      - name: Read back primary bound artifact from first run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: math-live-assurance-${{ github.sha }}
          path: out/primary
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.primary.outputs.run_id }}

      - name: P12 cross-run consistency + receipt chain
        run: |
          set -euo pipefail
          mkdir -p out/p12
          python3 research_math/orchestrator/live_evidence.py compare \
            --first-binding out/primary/out/live-bound/live-math-assurance.json \
            --second-binding out/replay-bound/live-math-assurance.json \
            --source-sha "$GITHUB_SHA" \
            --output out/p12/cross-run-receipt-chain.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          chain=json.loads(Path('out/p12/cross-run-receipt-chain.json').read_text())
          assert chain['status']=='PASS'
          assert len(set(chain['run_ids']))==2
          assert all(v=='PASS' for v in chain['claim_statuses'].values())
          print('P12 SECOND ISOLATED LIVE REPLAY = PASS')
          print('P12 CROSS-RUN CONSISTENCY = PASS')
          print('P12 RECEIPT CHAIN =', chain['chain_sha256'])
          print('P12 RUN IDS =', chain['run_ids'])
          PY

      - name: Seal P12 evidence
        run: |
          set -euo pipefail
          find out/replay-input -type f -print0 | sort -z | xargs -0 sha256sum > out/p12/replay-files-sha256.txt
          sha256sum \
            out/primary/out/live-bound/live-math-assurance.json \
            out/replay-bound/live-math-assurance.json \
            out/p12/cross-run-receipt-chain.json \
            out/p12/replay-files-sha256.txt \
            | tee out/p12/p12-sha256.txt
          {
            echo '## P12 Second Isolated Live Replay'
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Primary run: ${{ steps.primary.outputs.run_id }}"
            echo "- Replay run: $GITHUB_RUN_ID"
            echo '- Cross-run source/input/engine/version/witness consistency: PASS'
            echo '- Four live claim statuses reproduced: PASS'
            echo '- Distinct run ID guard: PASS'
            echo '- Receipt-chain tamper protection: PASS'
            echo '- Claim ceiling: only this exact source snapshot and configured live claim set'
            echo '```'
            cat out/p12/p12-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve P12 cross-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p12-cross-run-${{ github.sha }}
          path: |
            out/replay-input
            out/replay-bound
            out/primary/out/live-bound/live-math-assurance.json
            out/p12
            research_math/orchestrator/live_claims.json
            research_math/orchestrator/live_evidence.py
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
