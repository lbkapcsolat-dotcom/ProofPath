name: Mantyl Enforced Scoped V1

on:
  push:
    branches:
      - alpha/mantyl-enforced-scoped-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: scoped-enforcement-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact enforcement branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - name: Verify exact Node
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
      - name: Run focused enforcement contract test
        shell: bash
        run: node --test .alpha/enforcement/enforce.test.mjs
