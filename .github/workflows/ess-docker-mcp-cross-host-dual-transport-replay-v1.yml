name: ess-docker-mcp-cross-host-dual-transport-replay-v1

on:
  workflow_dispatch:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-cross-host-dual-transport-replay-v1.yml'

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest
  QUERY_TEXT: higher category theory homotopy theory
  OPENAPI_EXPECTED_DIGEST: sha256:5da1c1870748cc3c7d9baa25549fa716a7d9dd24dbb78b73396cb2daebfbca6a

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        host_label: [host-a, host-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Freeze synthetic input, dual routes, and host identity
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="evidence/dual-cross-host/${{ matrix.host_label }}"
          mkdir -p "$ROOT"
          cat > "$ROOT/synthetic-openapi.yaml" <<'EOF'
          openapi: 3.0.3
          info:
            title: ESS Synthetic Canary API
            version: 1.0.0
          paths:
            /health:
              get:
                summary: Synthetic health endpoint
                responses:
                  '200':
                    description: OK
          EOF
          sed -i 's/^          //' "$ROOT/synthetic-openapi.yaml"
          chmod 0444 "$ROOT/synthetic-openapi.yaml"
          python - <<'PY'
          import hashlib,json,os,pathlib,socket,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from router import load_profile,load_policy,route_request

          root=pathlib.Path('evidence/dual-cross-host/${{ matrix.host_label }}')
          schema_sha=hashlib.sha256((root/'synthetic-openapi.yaml').read_bytes()).hexdigest()
          requests={
            'gateway':{
              'domain':'papers','intent':'search',
              'arguments':{'query':os.environ['QUERY_TEXT'],'max_results':3}
            },
            'direct_image':{
              'domain':'openapi_schema','intent':'list',
              'arguments':{'schema_sha256':schema_sha,'expected_endpoint':'/health'}
            }
          }
          profile=load_profile(pathlib.Path('ess_docker_mcp_router/ESS_DOCKER_MCP_13_PROVEN_LIVE_EXPERT_SURFACES_CONTROLLED_PROFILE_V1.json'))
          policy=load_policy(pathlib.Path('ess_docker_mcp_router/policy.json'))
          routes={k:route_request(v,profile,policy) for k,v in requests.items()}
          assert routes['gateway']['decision']=='ALLOW' and routes['gateway']['surface']=='paper-search' and routes['gateway']['tool']=='search_arxiv' and routes['gateway']['transport']=='gateway-profile', routes['gateway']
          assert routes['direct_image']['decision']=='ALLOW' and routes['direct_image']['surface']=='openapi-schema' and routes['direct_image']['tool']=='list-endpoints' and routes['direct_image']['transport']=='direct-image', routes['direct_image']
          assert routes['direct_image']['image_digest']==os.environ['OPENAPI_EXPECTED_DIGEST'], routes['direct_image']
          def read(path):
            try:return pathlib.Path(path).read_text().strip()
            except Exception:return None
          identity={
            'host_label':'${{ matrix.host_label }}',
            'hostname':socket.gethostname(),
            'boot_id':read('/proc/sys/kernel/random/boot_id'),
            'machine_id':read('/etc/machine-id'),
            'product_uuid':read('/sys/class/dmi/id/product_uuid'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_job':os.environ.get('GITHUB_JOB')
          }
          can=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          for name,obj in [('gateway-request',requests['gateway']),('direct-request',requests['direct_image']),('gateway-route',routes['gateway']),('direct-route',routes['direct_image'])]:
            (root/f'{name}.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
            (root/f'{name}.sha256').write_text(hashlib.sha256(can(obj)).hexdigest()+'\n')
          (root/'schema.sha256').write_text(schema_sha+'\n')
          (root/'host-identity.json').write_text(json.dumps(identity,indent=2,sort_keys=True)+'\n')
          PY

      - name: Install pinned gateway and freeze OpenAPI image authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="evidence/dual-cross-host/${{ matrix.host_label }}"
          mkdir -p "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
            f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
            headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r:rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/mcp-url').write_text(a['browser_download_url'])
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/mcp-url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee "$ROOT/docker-mcp-version.txt"
          grep -F "${MCP_GATEWAY_VERSION#v}" "$ROOT/docker-mcp-version.txt"
          docker mcp feature enable profiles > "$ROOT/profile-feature.log" 2>&1 || true
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > "$ROOT/catalog-pull.log" 2>&1
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" openapi-schema --format json > "$ROOT/openapi-inspect.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('evidence/dual-cross-host/${{ matrix.host_label }}')
          s=json.loads((root/'openapi-inspect.json').read_text())['snapshot']['server']
          assert s['image'].endswith(os.environ['OPENAPI_EXPECTED_DIGEST']),s['image']
          (root/'openapi-image-authority.json').write_text(json.dumps({'image':s['image'],'expected_digest':os.environ['OPENAPI_EXPECTED_DIGEST'],'disableNetwork':s.get('disableNetwork')},indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute gateway-profile Paper Search plane
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="evidence/dual-cross-host/${{ matrix.host_label }}"
          PROFILE_ID="ess-dual-paper-${{ matrix.host_label }}"
          docker mcp profile create --name "ESS Dual Paper ${{ matrix.host_label }}" --id "$PROFILE_ID" \
            --server catalog://mcp/docker-mcp-catalog/paper-search > "$ROOT/profile-create.log" 2>&1
          docker mcp profile show "$PROFILE_ID" --format yaml > "$ROOT/profile-show.yaml"
          docker mcp gateway run --dry-run --profile "$PROFILE_ID" --verify-signatures > "$ROOT/profile-dry-run.out" 2> "$ROOT/profile-dry-run.err"
          grep -F 'paper-search' "$ROOT/profile-show.yaml"
          grep -F 'search_arxiv' "$ROOT/profile-show.yaml"
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools --gateway-arg=--profile="$PROFILE_ID" --gateway-arg=--verify-signatures \
            call search_arxiv "query=${QUERY_TEXT}" 'max_results=3' \
            > "$ROOT/gateway-response.raw" 2> "$ROOT/gateway-response.err"
          test -s "$ROOT/gateway-response.raw"
          grep -Eiq 'arxiv|paper|title|category|homotopy' "$ROOT/gateway-response.raw"
          python - <<'PY'
          import hashlib,pathlib,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from normalized_replay import normalize_tool_response
          root=pathlib.Path('evidence/dual-cross-host/${{ matrix.host_label }}')
          raw=(root/'gateway-response.raw').read_text(errors='replace').replace('\r\n','\n').replace('\r','\n')
          professional=normalize_tool_response(raw)
          professional='\n'.join(line.rstrip() for line in professional.split('\n')).strip()+'\n'
          (root/'gateway-response.professional').write_text(professional)
          (root/'gateway-raw.sha256').write_text(hashlib.sha256(raw.encode()).hexdigest()+'\n')
          (root/'gateway-professional.sha256').write_text(hashlib.sha256(professional.encode()).hexdigest()+'\n')
          PY

      - name: Build bounded direct-image MCP client
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="evidence/dual-cross-host/${{ matrix.host_label }}"
          mkdir -p /tmp/ess-dual-direct-client
          cat > /tmp/ess-dual-direct-client/go.mod <<'EOF'
          module ess-dual-direct-client
          go 1.25.0
          require github.com/modelcontextprotocol/go-sdk v1.4.1
          EOF
          cat > /tmp/ess-dual-direct-client/main.go <<'EOF'
          package main
          import(
            "context"
            "encoding/json"
            "fmt"
            "os"
            "os/exec"
            "path/filepath"
            "strings"
            "time"
            "github.com/modelcontextprotocol/go-sdk/mcp"
          )
          func must(e error){if e!=nil{panic(e)}}
          func main(){
            root:=os.Getenv("EVIDENCE_DIR")
            p:=filepath.Join(root,"synthetic-openapi.yaml")
            image:="mcp/openapi-schema@"+os.Getenv("OPENAPI_DIGEST")
            ctx,cancel:=context.WithTimeout(context.Background(),120*time.Second);defer cancel()
            cmd:=exec.CommandContext(ctx,"docker","run","--rm","-i","--network","none","--read-only","--cap-drop","ALL","--security-opt","no-new-privileges","--pids-limit","256","--memory","512m","--cpus","1","--tmpfs","/tmp:rw,noexec,nosuid,size=64m","-v",p+":"+p+":ro",image)
            errf,e:=os.Create(filepath.Join(root,"direct-container-stderr.log"));must(e);defer errf.Close();cmd.Stderr=errf
            c:=mcp.NewClient(&mcp.Implementation{Name:"ess-dual-direct-image-canary",Version:"1.0.0"},nil)
            s,e:=c.Connect(ctx,&mcp.CommandTransport{Command:cmd},nil);must(e);defer s.Close()
            lt,e:=s.ListTools(ctx,&mcp.ListToolsParams{});must(e)
            found:=false;for _,t:=range lt.Tools{if t.Name=="list-endpoints"{found=true}}
            if !found{panic("list-endpoints missing")}
            res,e:=s.CallTool(ctx,&mcp.CallToolParams{Name:"list-endpoints",Arguments:map[string]any{"openapiSchemaPath":p}});must(e)
            if res.IsError{panic("tool returned IsError")}
            compact,e:=json.Marshal(res);must(e)
            if !strings.Contains(string(compact),"/health"){panic("/health evidence missing")}
            must(os.WriteFile(filepath.Join(root,"direct-response.canonical.json"),append(compact,'\n'),0644))
            pretty,e:=json.MarshalIndent(res,"","  ");must(e);must(os.WriteFile(filepath.Join(root,"direct-response.pretty.json"),append(pretty,'\n'),0644))
            fmt.Println("PASS_OPENAPI_DIRECT_IMAGE_READONLY_MCP_CALL")
          }
          EOF
          cd /tmp/ess-dual-direct-client
          go mod tidy
          sha256sum main.go go.mod go.sum > "$GITHUB_WORKSPACE/$ROOT/direct-client-source-sha256.txt"
          go build -o /tmp/ess-dual-direct-client/canary .
          sha256sum /tmp/ess-dual-direct-client/canary > "$GITHUB_WORKSPACE/$ROOT/direct-client-binary-sha256.txt"

      - name: Execute direct-image OpenAPI plane
        shell: bash
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence/dual-cross-host/${{ matrix.host_label }}
          OPENAPI_DIGEST: ${{ env.OPENAPI_EXPECTED_DIGEST }}
        run: |
          set -euxo pipefail
          ROOT="$EVIDENCE_DIR"
          timeout --signal=TERM --kill-after=10s 150s /tmp/ess-dual-direct-client/canary > "$ROOT/direct-client.out" 2> "$ROOT/direct-client.err"
          grep -F 'PASS_OPENAPI_DIRECT_IMAGE_READONLY_MCP_CALL' "$ROOT/direct-client.out"
          test -s "$ROOT/direct-response.canonical.json"
          grep -F '/health' "$ROOT/direct-response.canonical.json"
          python - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR'])
          b=(root/'direct-response.canonical.json').read_bytes()
          (root/'direct-response.sha256').write_text(hashlib.sha256(b).hexdigest()+'\n')
          after=hashlib.sha256((root/'synthetic-openapi.yaml').read_bytes()).hexdigest()
          before=(root/'schema.sha256').read_text().strip()
          assert after==before,(before,after)
          (root/'schema-after.sha256').write_text(after+'\n')
          PY

      - name: Build host dual-transport receipt and manifest
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="evidence/dual-cross-host/${{ matrix.host_label }}"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence/dual-cross-host/${{ matrix.host_label }}')
          identity=json.loads((root/'host-identity.json').read_text())
          gw_response=(root/'gateway-response.professional').read_text()
          direct_response=json.loads((root/'direct-response.canonical.json').read_text())
          receipt={
            'gate':'ESS_DOCKER_MCP_CROSS_HOST_DUAL_TRANSPORT_REPLAY_AND_RECEIPT_EQUALITY_V1',
            'read_only':True,
            'external_actuation':False,
            'gateway_plane':{
              'request_sha256':(root/'gateway-request.sha256').read_text().strip(),
              'route_sha256':(root/'gateway-route.sha256').read_text().strip(),
              'surface':'paper-search','tool':'search_arxiv','transport':'gateway-profile',
              'response_sha256':(root/'gateway-professional.sha256').read_text().strip(),
              'response':gw_response
            },
            'direct_image_plane':{
              'request_sha256':(root/'direct-request.sha256').read_text().strip(),
              'route_sha256':(root/'direct-route.sha256').read_text().strip(),
              'surface':'openapi-schema','tool':'list-endpoints','transport':'direct-image',
              'image_digest':'${{ env.OPENAPI_EXPECTED_DIGEST }}',
              'input_sha256':(root/'schema.sha256').read_text().strip(),
              'response_sha256':(root/'direct-response.sha256').read_text().strip(),
              'response':direct_response
            },
            'runtime_meta':identity
          }
          (root/'host-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes();rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Upload host dual evidence
        uses: actions/upload-artifact@v4
        with:
          name: ess-dual-cross-host-${{ matrix.host_label }}
          path: evidence/dual-cross-host/${{ matrix.host_label }}/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download both host artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ess-dual-cross-host-*
          path: evidence/downloaded-dual

      - name: Prove two-host dual-transport normalized equality
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/dual-cross-host-final
          python - <<'PY'
          import hashlib,json,pathlib,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from normalized_replay import normalize_gateway_receipt,normalized_receipts_equal
          base=pathlib.Path('evidence/downloaded-dual')
          aroot=base/'ess-dual-cross-host-host-a';broot=base/'ess-dual-cross-host-host-b'
          a=json.loads((aroot/'host-receipt.json').read_text());b=json.loads((broot/'host-receipt.json').read_text())
          ia=a['runtime_meta'];ib=b['runtime_meta']
          assert ia['host_label']!=ib['host_label']
          assert ia['boot_id'] and ib['boot_id'] and ia['boot_id']!=ib['boot_id'],(ia,ib)
          assert ia['product_uuid'] and ib['product_uuid'] and ia['product_uuid']!=ib['product_uuid'],(ia,ib)
          assert ia['runner_name'] and ib['runner_name'] and ia['runner_name']!=ib['runner_name'],(ia,ib)
          ga,gb=a['gateway_plane'],b['gateway_plane'];da,db=a['direct_image_plane'],b['direct_image_plane']
          assert ga['request_sha256']==gb['request_sha256']
          assert ga['route_sha256']==gb['route_sha256']
          assert ga['response_sha256']==gb['response_sha256']
          assert ga['response']==gb['response']
          assert da['request_sha256']==db['request_sha256']
          assert da['route_sha256']==db['route_sha256']
          assert da['input_sha256']==db['input_sha256']
          assert da['image_digest']==db['image_digest']
          assert da['response_sha256']==db['response_sha256']
          assert da['response']==db['response']
          assert normalized_receipts_equal(a,b)
          can=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          na=normalize_gateway_receipt(a);nb=normalize_gateway_receipt(b)
          assert can(na)==can(nb)
          raw_a=(aroot/'gateway-response.raw').read_bytes();raw_b=(broot/'gateway-response.raw').read_bytes()
          summary={
            'gate':'ESS_DOCKER_MCP_CROSS_HOST_DUAL_TRANSPORT_REPLAY_AND_RECEIPT_EQUALITY_V1',
            'status':'PASS_BOUNDED_TWO_DISTINCT_HOSTS_TWO_TRANSPORT_PLANES_NORMALIZED_RECEIPT_EQUALITY',
            'host_a_identity':ia,'host_b_identity':ib,
            'distinct_host_identity':True,
            'identity_authority_fields':['boot_id','product_uuid','runner_name'],
            'gateway_profile':{
              'surface':'paper-search','tool':'search_arxiv',
              'request_sha256_equal':True,'route_sha256_equal':True,
              'professional_response_sha256_equal':True,'professional_response_bytes_equal':True,
              'professional_response_sha256':ga['response_sha256'],
              'raw_response_equal':raw_a==raw_b,
              'normalization':'REMOVE_ONLY_LEADING_DOCKER_CLI_TOOL_CALL_TOOK_DURATION_LINE'
            },
            'direct_image':{
              'surface':'openapi-schema','tool':'list-endpoints',
              'request_sha256_equal':True,'route_sha256_equal':True,'input_sha256_equal':True,
              'image_digest_equal':True,'image_digest':da['image_digest'],
              'response_sha256_equal':True,'response_bytes_equal':True,
              'response_sha256':da['response_sha256'],
              'network_disabled':True,'read_only_mount':True
            },
            'raw_receipt_equal':can(a)==can(b),
            'normalized_receipt_equal':True,
            'normalized_receipt_sha256':hashlib.sha256(can(na)).hexdigest(),
            'receipt_normalization':'REMOVE_ONLY_RUNTIME_META',
            'zero_spend':True,'secret_injected':False,'external_actuation':False,
            'production_ready':False,'global_bind':False,
            'claim_boundary':'TWO_DISTINCT_GITHUB_HOSTED_RUNNER_VMS__TWO_EXECUTION_PLANES_GATEWAY_PROFILE_AND_DIRECT_IMAGE__PAPER_SEARCH_AND_OPENAPI_SCHEMA_ONLY__NOT_ALL_13_SURFACES__NOT_PRODUCTION_READY__NOT_GLOBAL_BIND'
          }
          assert summary['raw_receipt_equal'] is False
          out=pathlib.Path('evidence/dual-cross-host-final')
          (out/'bounded-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'normalized-receipt.json').write_bytes(can(na)+b'\n')
          (out/'host-a-receipt.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          (out/'host-b-receipt.json').write_text(json.dumps(b,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Verify host manifests and build final manifest
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,pathlib
          base=pathlib.Path('evidence/downloaded-dual')
          for name in ['ess-dual-cross-host-host-a','ess-dual-cross-host-host-b']:
            root=base/name;errs=[]
            for line in (root/'sha256-manifest.txt').read_text().splitlines():
              if not line.strip():continue
              sha,size,fn=line.split('  ',2);b=(root/fn).read_bytes()
              if hashlib.sha256(b).hexdigest()!=sha or len(b)!=int(size):errs.append(fn)
            assert not errs,(name,errs)
          out=pathlib.Path('evidence/dual-cross-host-final');rows=[]
          for p in sorted(out.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes();rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (out/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Upload final dual-transport evidence
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-cross-host-dual-transport-replay-v1
          path: evidence/dual-cross-host-final/
          if-no-files-found: error
          retention-days: 30
