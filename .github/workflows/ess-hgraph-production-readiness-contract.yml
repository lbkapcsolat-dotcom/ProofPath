name: ESS HGraph Production Readiness Contract

on:
  push:
    branches:
      - ess-hgraph-native-cpp-parity-canary-v1
    paths:
      - 'hgraph_canary/test_production_readiness_contract.py'
      - 'hgraph_canary/production_readiness.py'
      - '.github/workflows/ess-hgraph-production-readiness-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run bounded production readiness contract tests
        run: pytest -q hgraph_canary/test_production_readiness_contract.py
