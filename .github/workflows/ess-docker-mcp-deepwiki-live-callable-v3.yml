name: ess-docker-mcp-deepwiki-live-callable-v3

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-deepwiki-live-callable-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  deepwiki-static-live-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-deepwiki-v3 "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
            f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
            headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-deepwiki-v3/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-deepwiki-v3/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-deepwiki-v3/docker-mcp-version.txt

      - name: Freeze official Docker DeepWiki remote contract
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > evidence/docker-mcp-deepwiki-v3/catalog-pull.log 2>&1
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" deepwiki --format json > evidence/docker-mcp-deepwiki-v3/deepwiki-inspect.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence/docker-mcp-deepwiki-v3')
          o=json.loads((root/'deepwiki-inspect.json').read_text())
          s=o['snapshot']['server']; r=s.get('remote') or {}; tools=s.get('tools') or []
          names=[t.get('name') for t in tools]
          assert s.get('type')=='remote'
          assert not s.get('secrets')
          assert r.get('url')=='https://mcp.deepwiki.com/sse'
          assert r.get('transport_type')=='sse'
          assert {'read_wiki_structure','read_wiki_contents','ask_question'}.issubset(set(names)), names
          (root/'contract-summary.json').write_text(json.dumps({
            'server':'deepwiki','type':'remote','remote_url':r['url'],'transport_type':r['transport_type'],
            'secret_required':False,'catalog_tools':names,'catalog_contract':'PASS'
          },indent=2,sort_keys=True))
          print('PASS_DEEPWIKI_OFFICIAL_CATALOG_REMOTE_CONTRACT')
          PY

      - name: Disable dynamic tools and expose selected server surface
        run: |
          set -euxo pipefail
          docker mcp feature list > evidence/docker-mcp-deepwiki-v3/features-before.txt
          docker mcp feature disable dynamic-tools > evidence/docker-mcp-deepwiki-v3/dynamic-tools-disable.log 2>&1
          docker mcp feature list > evidence/docker-mcp-deepwiki-v3/features-after.txt
          grep -A1 'dynamic-tools' evidence/docker-mcp-deepwiki-v3/features-after.txt | grep -F 'disabled'
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools --format json \
              --gateway-arg=--servers=deepwiki \
              ls \
            > evidence/docker-mcp-deepwiki-v3/runtime-tools.json \
            2> evidence/docker-mcp-deepwiki-v3/runtime-tools.err
          grep -F 'read_wiki_structure' evidence/docker-mcp-deepwiki-v3/runtime-tools.json
          grep -F 'read_wiki_contents' evidence/docker-mcp-deepwiki-v3/runtime-tools.json
          grep -F 'ask_question' evidence/docker-mcp-deepwiki-v3/runtime-tools.json
          echo PASS_DEEPWIKI_STATIC_RUNTIME_TOOL_DISCOVERY | tee evidence/docker-mcp-deepwiki-v3/runtime-discovery-status.txt

      - name: Execute live read-only public repository structure query
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools \
              --gateway-arg=--servers=deepwiki \
              call read_wiki_structure 'repoName=docker/mcp-gateway' \
            > evidence/docker-mcp-deepwiki-v3/live-read-wiki-structure.out \
            2> evidence/docker-mcp-deepwiki-v3/live-read-wiki-structure.err
          test -s evidence/docker-mcp-deepwiki-v3/live-read-wiki-structure.out
          grep -Eiq 'gateway|docker|mcp|documentation|wiki|section|topic|overview|architecture' evidence/docker-mcp-deepwiki-v3/live-read-wiki-structure.out
          echo PASS_DOCKER_MCP_DEEPWIKI_PUBLIC_REPO_LIVE_CALLABLE | tee evidence/docker-mcp-deepwiki-v3/gate-status.txt

      - name: Build bounded receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-mcp-deepwiki-v3')
          c=json.loads((root/'contract-summary.json').read_text())
          receipt={
            'gate':'DEEPWIKI_LIVE_CALLABLE_V1',
            'implementation':'V3_STATIC_TOOL_SURFACE_REMOTE_SERVER_PATH',
            'status':'PASS_DOCKER_MCP_DEEPWIKI_PUBLIC_REPO_LIVE_CALLABLE',
            'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
            'server':'deepwiki','tool':'read_wiki_structure','repository':'docker/mcp-gateway',
            'remote_url':c['remote_url'],'transport_type':c['transport_type'],
            'dynamic_tools_enabled_for_canary':False,
            'zero_spend':True,'secret_injected':False,'public_repo_only':True,'read_only':True,
            'external_actuation':False,'production_ready':False,'global_bind':False,
            'v1_profile_method_invalid_for_remote_server':True,
            'v2_dynamic_surface_not_sufficient':True
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-deepwiki-live-callable-v3
          path: evidence/docker-mcp-deepwiki-v3/
          if-no-files-found: error
          retention-days: 30
