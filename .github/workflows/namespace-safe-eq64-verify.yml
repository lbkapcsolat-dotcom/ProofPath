name: Namespace Safe EQ64 Verify

on:
  push:
    branches:
      - design/namespace-safe-eq64
    paths:
      - 'formal/namespace-safe-eq64/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Lean and build namespace-safe EQ64
        if: hashFiles('formal/namespace-safe-eq64/lakefile.lean') != ''
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/namespace-safe-eq64
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Compile theorem harness and reject proof escapes
        if: hashFiles('formal/namespace-safe-eq64/NamespaceSafeEQ64Test.lean') != ''
        working-directory: formal/namespace-safe-eq64
        run: |
          set -euo pipefail
          ~/.elan/bin/lake env lean NamespaceSafeEQ64Test.lean
          ESCAPE_RE='(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*((private|protected|noncomputable)[[:space:]]+)*(axiom|unsafe)([[:space:]]|$)'
          if grep -nE "$ESCAPE_RE" NamespaceSafeEQ64.lean NamespaceSafeEQ64Test.lean; then
            echo 'FAIL_PROOF_ESCAPE_TOKEN'
            exit 41
          fi

      - name: Run namespace-safe Python reference tests
        if: hashFiles('formal/namespace-safe-eq64/tests/*.py') != ''
        working-directory: formal/namespace-safe-eq64
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
