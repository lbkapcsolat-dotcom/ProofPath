name: ess-docker-mcp-top20-secretless-live-callability-sweep-v1

on:
  workflow_dispatch:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-top20-secretless-live-callability-sweep-v1.yml'

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  top20-secretless-live-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-top20-sweep "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
            f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
            headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/mcp-url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-top20-sweep/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/mcp-url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-top20-sweep/docker-mcp-version.txt
          docker mcp feature enable profiles > evidence/docker-mcp-top20-sweep/profile-feature-enable.log 2>&1 || true
          docker mcp feature list > evidence/docker-mcp-top20-sweep/features.txt
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > evidence/docker-mcp-top20-sweep/catalog-pull.log 2>&1

      - name: Execute bounded top20 live callability sweep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,pathlib,shlex,time,os,re
          root=pathlib.Path('evidence/docker-mcp-top20-sweep')
          servers=[
            ('arxiv-mcp-server','LOCAL_IMAGE'),
            ('hugging-face','REMOTE'),
            ('atlas-docs','LOCAL_IMAGE'),
            ('paper-search','LOCAL_IMAGE'),
            ('context7','REMOTE'),
            ('astro-docs','REMOTE'),
            ('cloudflare-docs','REMOTE'),
            ('docker-docs','REMOTE'),
            ('gemini-api-docs','LOCAL_IMAGE'),
            ('javadocs','REMOTE'),
            ('openapi-schema','LOCAL_IMAGE'),
            ('rust-mcp-filesystem','LOCAL_IMAGE'),
            ('victorialogs','LOCAL_IMAGE'),
            ('victoriametrics','LOCAL_IMAGE'),
            ('victoriatraces','LOCAL_IMAGE'),
            ('maven-tools-mcp','LOCAL_IMAGE'),
            ('prometheus','LOCAL_IMAGE'),
            ('ros2','LOCAL_IMAGE'),
            ('aws-cdk-mcp-server','LOCAL_IMAGE'),
            ('aws-terraform','LOCAL_IMAGE'),
          ]

          def run(cmd,timeout=120):
            try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=timeout)
              return p.returncode,p.stdout,p.stderr
            except subprocess.TimeoutExpired as e:
              return 124,(e.stdout or '') if isinstance(e.stdout,str) else '',(e.stderr or '') if isinstance(e.stderr,str) else 'TIMEOUT'

          def find_tools(obj):
            found=[]
            def walk(x):
              if isinstance(x,dict):
                name=x.get('name')
                schema=x.get('inputSchema') or x.get('input_schema')
                if isinstance(name,str) and isinstance(schema,dict):
                  found.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(obj)
            uniq=[]; seen=set()
            for t in found:
              if t['name'] not in seen:
                seen.add(t['name']); uniq.append(t)
            return uniq

          def safe_zero_arg_tool(tools):
            cands=[]
            for t in tools:
              ann=t.get('annotations') if isinstance(t.get('annotations'),dict) else {}
              schema=t.get('inputSchema') or t.get('input_schema') or {}
              required=schema.get('required') or []
              destructive=ann.get('destructiveHint') is True
              read_only=ann.get('readOnlyHint') is True
              if read_only and not destructive and not required:
                cands.append(t)
            return cands[0] if cands else None

          rows=[]
          for idx,(server,plane) in enumerate(servers,1):
            sdir=root/f'{idx:02d}-{server}'
            sdir.mkdir(parents=True,exist_ok=True)
            profile=f'ess-sweep-{idx:02d}'
            rec={
              'rank':idx,'server':server,'plane':plane,'profile_id':profile,
              'signature_verification':True,'secret_injected':False,'zero_spend':True,
              'external_actuation':False,'status':'TRANSPORT_HOLD','tool_count':0,
              'selected_tool':None,'reason':None
            }

            rc,out,err=run(['docker','mcp','profile','create','--name',f'ESS_SWEEP_{idx:02d}','--id',profile,'--server',f'catalog://mcp/docker-mcp-catalog/{server}'],90)
            (sdir/'profile-create.out').write_text(out); (sdir/'profile-create.err').write_text(err)
            if rc!=0:
              rec['reason']=f'PROFILE_CREATE_EXIT_{rc}'
              rows.append(rec); continue

            rc,out,err=run(['docker','mcp','gateway','run','--dry-run','--profile',profile,'--verify-signatures'],120)
            (sdir/'dry-run.out').write_text(out); (sdir/'dry-run.err').write_text(err)
            if rc!=0:
              rec['reason']=f'GATEWAY_DRY_RUN_EXIT_{rc}'
              rows.append(rec); continue

            rc,out,err=run(['docker','mcp','tools','--format','json',f'--gateway-arg=--profile={profile}','--gateway-arg=--verify-signatures','ls'],120)
            (sdir/'runtime-tools.json').write_text(out); (sdir/'runtime-tools.err').write_text(err)
            if rc!=0:
              rec['reason']=f'TOOL_LIST_EXIT_{rc}'
              rows.append(rec); continue
            try:
              obj=json.loads(out or '[]')
            except Exception:
              rec['reason']='TOOL_LIST_INVALID_JSON'; rows.append(rec); continue
            tools=find_tools(obj)
            rec['tool_count']=len(tools)
            (sdir/'normalized-tools.json').write_text(json.dumps(tools,indent=2,sort_keys=True))
            if not tools:
              rec['reason']='NO_RUNTIME_TOOLS_EXPORTED'
              rows.append(rec); continue

            tool=safe_zero_arg_tool(tools)
            if tool is None:
              rec['status']='TOOL_CONTRACT_HOLD'
              rec['reason']='NO_ANNOTATED_READONLY_ZERO_REQUIRED_ARG_TOOL'
              rows.append(rec); continue

            tname=tool['name']; rec['selected_tool']=tname
            rc,out,err=run(['docker','mcp','tools',f'--gateway-arg=--profile={profile}','--gateway-arg=--verify-signatures','call',tname],120)
            (sdir/'live-call.out').write_text(out); (sdir/'live-call.err').write_text(err)
            if rc==0 and (out.strip() or err.strip()):
              rec['status']='LIVE_PASS'; rec['reason']='READONLY_ZERO_ARG_LIVE_CALL_SUCCEEDED'
            elif rc==0:
              rec['status']='LIVE_PASS'; rec['reason']='READONLY_ZERO_ARG_LIVE_CALL_EXIT_0_EMPTY_OUTPUT'
            else:
              low=(out+'\n'+err).lower()
              if any(k in low for k in ['required','validation','invalid argument','unknown tool','schema']):
                rec['status']='TOOL_CONTRACT_HOLD'; rec['reason']=f'LIVE_CALL_CONTRACT_EXIT_{rc}'
              elif rc==124 or 'timeout' in low or 'connection' in low or 'initialize' in low or 'transport' in low:
                rec['status']='TRANSPORT_HOLD'; rec['reason']=f'LIVE_CALL_TRANSPORT_EXIT_{rc}'
              else:
                rec['status']='BROKEN'; rec['reason']=f'LIVE_CALL_SERVER_ERROR_EXIT_{rc}'
            rows.append(rec)

          assert len(rows)==20
          allowed={'LIVE_PASS','TRANSPORT_HOLD','TOOL_CONTRACT_HOLD','BROKEN'}
          assert all(r['status'] in allowed for r in rows)
          root.joinpath('top20-live-callability-matrix.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          import csv
          with root.joinpath('top20-live-callability-matrix.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          from collections import Counter
          counts=Counter(r['status'] for r in rows)
          summary={
            'gate':'ESS_DOCKER_MCP_TOP20_SECRETLESS_LIVE_CALLABILITY_SWEEP_V1',
            'verdict':'PASS_SWEEP_EXECUTED_BOUNDED',
            'server_count':20,
            'status_counts':dict(counts),
            'live_pass_servers':[r['server'] for r in rows if r['status']=='LIVE_PASS'],
            'transport_hold_servers':[r['server'] for r in rows if r['status']=='TRANSPORT_HOLD'],
            'tool_contract_hold_servers':[r['server'] for r in rows if r['status']=='TOOL_CONTRACT_HOLD'],
            'broken_servers':[r['server'] for r in rows if r['status']=='BROKEN'],
            'selection_rule':'TOP_ESS_RELEVANCE_SECRETLESS_FROM_CORRECTED_V2_MATRIX__AUTH_REQUIRED_REF_EXCLUDED__AWS_TERRAFORM_PROMOTED',
            'live_call_rule':'ONLY_ANNOTATED_READONLY__DESTRUCTIVE_FALSE__ZERO_REQUIRED_ARGUMENT_TOOLS',
            'claim_ceiling':'BOUNDED_LIVE_CALLABILITY_SWEEP_ONLY__NO_BULK_ENABLE__NO_AUTH_BYPASS__ZERO_SPEND',
            'zero_spend':True,'external_actuation':False,'production_ready':False,'global_bind':False
          }
          root.joinpath('summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          root.joinpath('status.txt').write_text('\n'.join(f"{r['rank']:02d} {r['server']} | {r['status']} | tools={r['tool_count']} | tool={r['selected_tool'] or '-'} | {r['reason']}" for r in rows)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Hash evidence and build bounded receipt
        shell: bash
        run: |
          set -euxo pipefail
          cd evidence/docker-mcp-top20-sweep
          find . -type f ! -name sha256-manifest.txt -print0 | sort -z | xargs -0 sha256sum > sha256-manifest.txt
          python - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('.')
          s=json.loads((root/'summary.json').read_text())
          receipt={**s,
            'github_repository':os.environ.get('GITHUB_REPOSITORY'),
            'github_sha':os.environ.get('GITHUB_SHA'),
            'gateway_version':os.environ.get('MCP_GATEWAY_VERSION'),
            'sha256_manifest':'sha256-manifest.txt'
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          sha256sum bounded-receipt.json >> sha256-manifest.txt

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-top20-secretless-live-callability-sweep-v1
          path: evidence/docker-mcp-top20-sweep/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
