name: ess-docker-mcp-deepwiki-live-callable-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-deepwiki-live-callable-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest
  PROFILE_ID: ess-deepwiki-v1

jobs:
  deepwiki-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-deepwiki "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(
              f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  'X-GitHub-Api-Version':'2022-11-28'
              })
          with urllib.request.urlopen(req,timeout=60) as r:
              rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-deepwiki/gateway-release.json').write_text(
              json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-deepwiki/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-deepwiki/docker-mcp-version.txt

      - name: Inspect DeepWiki catalog contract and create controlled profile
        run: |
          set -euxo pipefail
          docker mcp feature enable profiles >/dev/null 2>&1 || true
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > evidence/docker-mcp-deepwiki/catalog-pull.log 2>&1
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" deepwiki --format json > evidence/docker-mcp-deepwiki/deepwiki-inspect.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence/docker-mcp-deepwiki')
          o=json.loads((root/'deepwiki-inspect.json').read_text())
          s=o['snapshot']['server']
          remote=s.get('remote') or {}
          assert not s.get('secrets'), s.get('secrets')
          assert remote.get('url') in ('https://mcp.deepwiki.com/sse','https://mcp.deepwiki.com/mcp'), remote
          assert remote.get('transport_type') in ('sse','streamable-http'), remote
          summary={
              'server':'deepwiki',
              'secret_required':False,
              'remote_url':remote.get('url'),
              'transport_type':remote.get('transport_type'),
              'catalog_contract':'PASS'
          }
          (root/'contract-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PASS_DEEPWIKI_CATALOG_CONTRACT')
          PY
          docker mcp profile create --name ESS_DEEPWIKI_V1 --id "$PROFILE_ID" \
            --server catalog://mcp/docker-mcp-catalog/deepwiki \
            > evidence/docker-mcp-deepwiki/profile-create.log 2>&1
          docker mcp profile show "$PROFILE_ID" --format yaml > evidence/docker-mcp-deepwiki/profile-show.yaml

      - name: Discover runtime tools and verify bounded tool surface
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools --format json --gateway-arg=--profile="$PROFILE_ID" ls \
            > evidence/docker-mcp-deepwiki/runtime-tools.json \
            2> evidence/docker-mcp-deepwiki/runtime-tools.err
          grep -F 'read_wiki_structure' evidence/docker-mcp-deepwiki/runtime-tools.json
          grep -F 'read_wiki_contents' evidence/docker-mcp-deepwiki/runtime-tools.json
          grep -F 'ask_question' evidence/docker-mcp-deepwiki/runtime-tools.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/docker-mcp-deepwiki/runtime-tools.json')
          o=json.loads(p.read_text())
          names=[]
          if isinstance(o,list):
              names=[x.get('name') for x in o if isinstance(x,dict)]
          elif isinstance(o,dict):
              xs=o.get('tools') or []
              names=[x.get('name') for x in xs if isinstance(x,dict)]
          required={'read_wiki_structure','read_wiki_contents','ask_question'}
          assert required.issubset(set(names)), names
          pathlib.Path('evidence/docker-mcp-deepwiki/runtime-tool-names.json').write_text(
              json.dumps(sorted(names),indent=2))
          print('PASS_DEEPWIKI_RUNTIME_TOOL_DISCOVERY')
          PY

      - name: Execute live read-only public repository structure query
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools --gateway-arg=--profile="$PROFILE_ID" \
            call read_wiki_structure 'repoName=docker/mcp-gateway' \
            > evidence/docker-mcp-deepwiki/live-read-wiki-structure.out \
            2> evidence/docker-mcp-deepwiki/live-read-wiki-structure.err
          test -s evidence/docker-mcp-deepwiki/live-read-wiki-structure.out
          grep -Eiq 'gateway|docker|mcp|documentation|wiki|section|topic' evidence/docker-mcp-deepwiki/live-read-wiki-structure.out
          echo PASS_DOCKER_MCP_DEEPWIKI_PUBLIC_REPO_LIVE_CALLABLE | tee evidence/docker-mcp-deepwiki/gate-status.txt

      - name: Build bounded receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-mcp-deepwiki')
          contract=json.loads((root/'contract-summary.json').read_text())
          receipt={
              'gate':'DEEPWIKI_LIVE_CALLABLE_V1',
              'status':'PASS_DOCKER_MCP_DEEPWIKI_PUBLIC_REPO_LIVE_CALLABLE',
              'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
              'server':'deepwiki',
              'tool':'read_wiki_structure',
              'repository':'docker/mcp-gateway',
              'remote_url':contract['remote_url'],
              'transport_type':contract['transport_type'],
              'zero_spend':True,
              'secret_injected':False,
              'public_repo_only':True,
              'read_only':True,
              'external_actuation':False,
              'production_ready':False,
              'global_bind':False
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='sha256-manifest.txt':
                  b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-deepwiki-live-callable-v1
          path: evidence/docker-mcp-deepwiki/
          if-no-files-found: error
          retention-days: 30
