          diff -u "$ROOT/replay-input-before.sha256" "$ROOT/replay-input-after.sha256" > "$ROOT/replay-input-diff.txt"
          python - <<'PY'
          import collections,hashlib,json,os,pathlib
          root=pathlib.Path('evidence/ess-router-executor-receipt-replay-bind-v1')
          comps=json.loads((root/'comparisons/replay-comparisons.json').read_text());neg=json.loads((root/'negative/receipt-negative-canaries.json').read_text());replay_rows=[json.loads(x) for x in (root/'replay-results.jsonl').read_text().splitlines() if x.strip()]
          assert len(comps)==12 and len(replay_rows)==12 and len(neg)==8
          assert all(x['status']=='REPLAY_RECEIPT_BOUND_PASS' for x in replay_rows)
          gateway=[x for x in comps if x['transport']=='gateway-profile'];direct=[x for x in comps if x['transport']=='direct-image']
          summary={
            'gate':'ESS_DOCKER_MCP_12_SURFACE_ROUTER_EXECUTOR_RECEIPT_AND_INDEPENDENT_REPLAY_BIND_V1',
            'verdict':'PASS_12_OF_12_PRIMARY_RESPONSE_RECEIPTS_BOUND__12_OF_12_INDEPENDENT_REPLAY_RECEIPTS_BOUND__2_OF_2_DIRECT_EXACT_RESPONSE_REPLAY__8_OF_8_RECEIPT_NEGATIVE_CANARIES_FAIL_CLOSED',
            'primary_run_id':int(os.environ['PRIMARY_RUN_ID']),'primary_head_sha':os.environ['PRIMARY_HEAD_SHA'],'primary_artifact_id':int(os.environ['PRIMARY_ARTIFACT_ID']),'primary_artifact_sha256':os.environ['PRIMARY_ARTIFACT_SHA256'],
            'replay_run_id':int(os.environ['GITHUB_RUN_ID']),'replay_head_sha':os.environ['GITHUB_SHA'],
            'primary_receipt_count':12,'independent_replay_receipt_count':12,'gateway_profile_replay_count':len(gateway),'direct_image_replay_count':len(direct),'direct_exact_response_sha_equal_count':sum(x['response_sha256_equal'] for x in direct),'gateway_response_sha_equal_count_observed':sum(x['response_sha256_equal'] for x in gateway),'receipt_negative_canary_count':len(neg),'receipt_negative_status_counts':dict(collections.Counter(x['status'] for x in neg)),
            'authority_bytes_equal_to_primary':True,'router_executor_source_equal_to_primary_head':True,'direct_inputs_immutable':True,'gemini_quarantine_preserved':True,'zero_spend':True,'secret_injected':False,'external_actuation':False,'production_ready':False,'runtime_admission':False,'global_bind':False,
            'remote_response_claim_boundary':'For 10 gateway-profile surfaces, each primary and replay response is independently SHA256-bound to its own validated receipt; cross-run response-byte equality is observed and recorded but is not required because upstream remote content may legitimately change.',
            'direct_response_claim_boundary':'For 2 digest-pinned local direct-image surfaces over byte-identical read-only synthetic inputs, cross-run response SHA256 equality is required and passed.',
            'claim_boundary':'POLICY_ROUTE_EXECUTOR_RESPONSE_RECEIPT_CHAIN_BOUND_OVER_12_READ_ONLY_SURFACES__PRIMARY_PROVIDER_ARTIFACT_PINNED_AND_REVERIFIED__FRESH_INDEPENDENT_REPLAY_ON_ALL_12__DIRECT_LOCAL_OUTPUTS_EXACT__REMOTE_OUTPUTS_INDIVIDUALLY_EXACTLY_BOUND_NOT_ASSUMED_CROSS_RUN_DETERMINISTIC__NO_PRODUCTION_READY__NO_RUNTIME_ADMISSION__NO_GLOBAL_BIND'
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n');(root/'bounded-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          entries=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='sha256-manifest.txt':
                  b=p.read_bytes();entries.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.relative_to(root)}')
          (root/'sha256-manifest.txt').write_text('\n'.join(entries)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

