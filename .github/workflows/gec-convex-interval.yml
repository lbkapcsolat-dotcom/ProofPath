name: GEC Convex Interval Invariance Gate

on:
  push:
    branches:
      - design/namespace-safe-eq64
    paths:
      - 'formal/namespace-safe-eq64/gec-convex-interval/**'
      - '.github/workflows/gec-convex-interval.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'formal/namespace-safe-eq64/gec-convex-interval/**'
      - '.github/workflows/gec-convex-interval.yml'

permissions:
  contents: read

jobs:
  gec-convex-interval-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and build isolated package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/namespace-safe-eq64/gec-convex-interval
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Verify pinned mathlib revision
        working-directory: formal/namespace-safe-eq64/gec-convex-interval
        run: |
          set -euo pipefail
          EXPECTED_MATHLIB_REV='0df444a360eaa60ab8c11dca51a86af692955474'
          ACTUAL_MATHLIB_REV="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          test "$ACTUAL_MATHLIB_REV" = "$EXPECTED_MATHLIB_REV"
          echo "PASS_MATHLIB_PIN=$ACTUAL_MATHLIB_REV"

      - name: Compile isolated GEC theorem harness
        working-directory: formal/namespace-safe-eq64/gec-convex-interval
        run: |
          set -euo pipefail
          ~/.elan/bin/lake env lean GECConvexIntervalTest.lean

      - name: Reject proof escapes
        working-directory: formal/namespace-safe-eq64/gec-convex-interval
        run: |
          set -euo pipefail
          ESCAPE_RE='(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*((private|protected|noncomputable)[[:space:]]+)*(axiom|unsafe)([[:space:]]|$)'
          if grep -nE "$ESCAPE_RE" GECConvexInterval.lean GECConvexIntervalTest.lean; then
            echo 'FAIL_PROOF_ESCAPE_TOKEN'
            exit 41
          fi
          echo 'PASS_GEC_CONVEX_INTERVAL_PROOF_ESCAPE_SCAN'
