name: Mantyl Preexec Crosshost Anchor V1

on:
  push:
    branches:
      - alpha/mantyl-preexec-control-plane-v1
  workflow_dispatch:

permissions: {}

env:
  MANTYL_VERSION: "0.5.0"
  EXPECTED_INTEGRITY: "sha512-hQI/oLTU0er9fuAc2uLsUB2mmptXrqW1S1psFe/0js0gK3w80eupiVBTWysag5V62unV9LYJuF6Va5VPdfh5Eg=="
  CROSS_HOST_RECEIPT_PATH: ".alpha/receipts/MANTYL_CROSS_HOST_RUN_33917109281.json"
  CROSS_HOST_RECEIPT_SHA256: "b34666d6d70b38c956250197fc3ba2ed3c4dfa43a72334d1e300e255a81bcc45"
  MAX_RECEIPT_AGE_SECONDS: "900"
  GRANT_TTL_SECONDS: "300"

jobs:
  cross_host_anchor:
    name: Verify canonical cross-host admission anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      anchor_sha256: ${{ steps.anchor.outputs.anchor_sha256 }}
    steps:
      - name: Fetch exact anchor from immutable workflow commit
        id: anchor
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cross-host-anchor"
          mkdir -p "$ROOT"
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$CROSS_HOST_RECEIPT_PATH"
          curl -fsSL "$URL" -o "$ROOT/anchor.json"
          ACTUAL_SHA="$(sha256sum "$ROOT/anchor.json" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$CROSS_HOST_RECEIPT_SHA256"
          export ANCHOR="$ROOT/anchor.json"
          node - <<'NODE'
          const r=require(process.env.ANCHOR);
          const ok=[
            r.gate==='MANTYL_SECOND_HOST_CROSS_REPLAY_AND_RECEIPT_EQUIVALENCE_V1',
            r.verdict==='PASS_BOUNDED',
            r.host_identity_distinct===true,
            r.package_identity_equal===true,
            r.bundle_identity_equal===true,
            r.passport_file_identity_equal===true,
            r.commit_equal===true,
            r.tree_equal===true,
            Number(r.clean_receive_exit)===0,
            Number(r.negative_receive_exit)===7,
            r.paid_layer_used===false,
            r.authority_promotion===false,
            r.global_bind===false,
            r.runtime_admission===false,
            r.production_readiness_claim===false
          ];
          if(!ok.every(Boolean)) process.exit(81);
          NODE
          printf 'anchor_sha256=%s\n' "$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          printf 'CROSS_HOST_ANCHOR_SHA256=%s\n' "$ACTUAL_SHA"

  fresh_receipt:
    name: Produce fresh project-specific Mantyl receipt
    needs: cross_host_anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      synthetic_commit: ${{ steps.receipt.outputs.synthetic_commit }}
      synthetic_tree: ${{ steps.receipt.outputs.synthetic_tree }}
    steps:
      - name: Pin Mantyl package and runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          git --version
          docker --version
          ROOT="$RUNNER_TEMP/mantyl-anchor-preexec"
          TOOL="$ROOT/tool"
          mkdir -p "$TOOL"
          cd "$TOOL"
          test "$(npm view "mantyl@$MANTYL_VERSION" version)" = "$MANTYL_VERSION"
          test "$(npm view "mantyl@$MANTYL_VERSION" dist.integrity)" = "$EXPECTED_INTEGRITY"
          npm pack "mantyl@$MANTYL_VERSION" --json > pack.json
          TARBALL="$(node -e 'console.log(require("./pack.json")[0].filename)')"
          test "$(node -e 'console.log(require("./pack.json")[0].integrity)')" = "$EXPECTED_INTEGRITY"
          export TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          npm install --prefix "$TOOL/install" "$TOOL/$TARBALL"
          printf 'MANTYL_BIN=%s\n' "$TOOL/install/node_modules/.bin/mantyl" >> "$GITHUB_ENV"
          printf 'MANTYL_TARBALL_SHA256=%s\n' "$TARBALL_SHA256" >> "$GITHUB_ENV"

      - name: Create and verify synthetic work unit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mantyl-anchor-preexec"
          SRC="$ROOT/source"
          mkdir -p "$SRC/src"
          cd "$SRC"
          cat > package.json <<'JSON'
          {"name":"alpha-mantyl-anchor-preexec-v1","version":"1.0.0","private":true,"type":"module","scripts":{"build":"node build.mjs","test":"node test.mjs"}}
          JSON
          printf 'ALPHA\n' > src/value.txt
          cat > build.mjs <<'JS'
          import fs from 'node:fs';
          fs.mkdirSync('dist',{recursive:true});
          fs.writeFileSync('dist/result.txt','ANCHOR_PREEXEC_OK\n');
          JS
          cat > test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.equal(fs.readFileSync('src/value.txt','utf8'),'ALPHA\n');
          console.log('TEST_OK');
          JS
          git init -b main
          git config user.name 'ALPHA Anchor Preexec Canary'
          git config user.email 'canary@example.invalid'
          "$MANTYL_BIN" init
          git add package.json build.mjs test.mjs src/value.txt mantyl.config.json
          GIT_AUTHOR_DATE='2026-09-04T00:00:00Z' GIT_COMMITTER_DATE='2026-09-04T00:00:00Z' git commit -m 'Synthetic anchor preexec work unit'
          "$MANTYL_BIN" scan
          "$MANTYL_BIN" verify
          "$MANTYL_BIN" generate
          printf 'SYNTH_REPO=%s\n' "$SRC" >> "$GITHUB_ENV"

      - name: Normalize fresh receipt bound to anchor
        id: receipt
        shell: bash
        env:
          CROSS_HOST_ANCHOR_SHA256: ${{ needs.cross_host_anchor.outputs.anchor_sha256 }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mantyl-anchor-preexec"
          SRC="$SYNTH_REPO"
          PASSPORT="$SRC/.mantyl/passport.json"
          RECEIPT="$ROOT/fresh-receipt.json"
          export SYNTH_COMMIT="$(git -C "$SRC" rev-parse HEAD)"
          export SYNTH_TREE="$(git -C "$SRC" rev-parse HEAD^{tree})"
          export PASSPORT_SHA256="$(sha256sum "$PASSPORT" | awk '{print $1}')"
          export PASSPORT_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.passportDigest)' "$PASSPORT")"
          export EVIDENCE_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.evidenceDigest)' "$PASSPORT")"
          export FILE_MANIFEST_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.fileManifestDigest)' "$PASSPORT")"
          node - <<'NODE' > "$RECEIPT"
          const r={
            gate:'MANTYL_PREEXEC_ANCHORED_SOURCE_RECEIPT_V1',timestamp_utc:new Date().toISOString(),
            workflow_run_id:process.env.GITHUB_RUN_ID,workflow_sha:process.env.GITHUB_SHA,
            cross_host_anchor_sha256:process.env.CROSS_HOST_ANCHOR_SHA256,
            mantyl_version:process.env.MANTYL_VERSION,registry_integrity:process.env.EXPECTED_INTEGRITY,
            package_tarball_sha256:process.env.MANTYL_TARBALL_SHA256,
            synthetic_commit:process.env.SYNTH_COMMIT,synthetic_tree:process.env.SYNTH_TREE,
            passport_sha256:process.env.PASSPORT_SHA256,passport_digest:process.env.PASSPORT_DIGEST,
            evidence_digest:process.env.EVIDENCE_DIGEST,file_manifest_digest:process.env.FILE_MANIFEST_DIGEST,
            verification_passed:true,paid_layer_used:false,authority_promotion:false,global_bind:false,production_readiness_claim:false,
            verdict:'PASS_BOUNDED'
          };
          process.stdout.write(JSON.stringify(r,null,2)+'\n');
          NODE
          RECEIPT_SHA="$(sha256sum "$RECEIPT" | awk '{print $1}')"
          printf 'receipt_sha256=%s\n' "$RECEIPT_SHA" >> "$GITHUB_OUTPUT"
          printf 'synthetic_commit=%s\n' "$SYNTH_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'synthetic_tree=%s\n' "$SYNTH_TREE" >> "$GITHUB_OUTPUT"
          cat "$RECEIPT"
          printf 'FRESH_RECEIPT_SHA256=%s\n' "$RECEIPT_SHA"

      - name: Upload anchored fresh receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-anchored-fresh-receipt
          path: ${{ runner.temp }}/mantyl-anchor-preexec/fresh-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  admission_gate:
    name: Issue least-authority scoped grant
    needs: [cross_host_anchor, fresh_receipt]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      grant_sha256: ${{ steps.issue.outputs.grant_sha256 }}
      nonce: ${{ steps.issue.outputs.nonce }}
    steps:
      - name: Download fresh receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mantyl-anchored-fresh-receipt
          path: ${{ runner.temp }}/gate
      - name: Validate anchor bind and issue grant
        id: issue
        shell: bash
        env:
          EXPECTED_ANCHOR_SHA: ${{ needs.cross_host_anchor.outputs.anchor_sha256 }}
          EXPECTED_RECEIPT_SHA: ${{ needs.fresh_receipt.outputs.receipt_sha256 }}
          EXPECTED_COMMIT: ${{ needs.fresh_receipt.outputs.synthetic_commit }}
          EXPECTED_TREE: ${{ needs.fresh_receipt.outputs.synthetic_tree }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gate"
          RECEIPT="$ROOT/fresh-receipt.json"
          GRANT="$ROOT/grant.json"
          test "$(sha256sum "$RECEIPT" | awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA"
          export RECEIPT GRANT
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const r=require(process.env.RECEIPT);
          const age=(Date.now()-Date.parse(r.timestamp_utc))/1000;
          const ok=[r.gate==='MANTYL_PREEXEC_ANCHORED_SOURCE_RECEIPT_V1',r.verdict==='PASS_BOUNDED',r.verification_passed===true,
            r.workflow_run_id===process.env.GITHUB_RUN_ID,r.workflow_sha===process.env.GITHUB_SHA,
            r.cross_host_anchor_sha256===process.env.EXPECTED_ANCHOR_SHA,
            r.synthetic_commit===process.env.EXPECTED_COMMIT,r.synthetic_tree===process.env.EXPECTED_TREE,
            r.mantyl_version===process.env.MANTYL_VERSION,r.registry_integrity===process.env.EXPECTED_INTEGRITY,
            r.paid_layer_used===false,r.authority_promotion===false,r.global_bind===false,r.production_readiness_claim===false,
            Number.isFinite(age)&&age>=0&&age<=Number(process.env.MAX_RECEIPT_AGE_SECONDS)];
          if(!ok.every(Boolean)) process.exit(82);
          const now=Date.now(),nonce=crypto.randomBytes(32).toString('hex');
          const g={gate:'MANTYL_PREEXEC_ANCHORED_GRANT_V1',source_receipt_sha256:process.env.EXPECTED_RECEIPT_SHA,
            cross_host_anchor_sha256:process.env.EXPECTED_ANCHOR_SHA,workflow_run_id:process.env.GITHUB_RUN_ID,workflow_sha:process.env.GITHUB_SHA,
            synthetic_commit:r.synthetic_commit,synthetic_tree:r.synthetic_tree,scope:'SYNTHETIC_PROTECTED_PAYLOAD_V1',nonce,
            issued_at:new Date(now).toISOString(),expires_at:new Date(now+Number(process.env.GRANT_TTL_SECONDS)*1000).toISOString(),
            authority:'NONE',github_permissions:'NONE',external_publish:false,paid_layer_used:false,verdict:'ADMIT_BOUNDED'};
          fs.writeFileSync(process.env.GRANT,JSON.stringify(g,null,2)+'\n');
          NODE
          GRANT_SHA="$(sha256sum "$GRANT" | awk '{print $1}')"
          NONCE="$(node -e 'const g=require(process.argv[1]);process.stdout.write(g.nonce)' "$GRANT")"
          printf 'grant_sha256=%s\n' "$GRANT_SHA" >> "$GITHUB_OUTPUT"
          printf 'nonce=%s\n' "$NONCE" >> "$GITHUB_OUTPUT"
          cat "$GRANT"
      - name: Upload scoped grant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-anchored-grant
          path: ${{ runner.temp }}/gate/grant.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  protected_payload:
    name: Execute payload only after anchored grant
    needs: [cross_host_anchor, fresh_receipt, admission_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download receipt and grant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mantyl-anchored-*
          path: ${{ runner.temp }}/payload
          merge-multiple: true
      - name: Verify grant and execute exactly once
        shell: bash
        env:
          EXPECTED_ANCHOR_SHA: ${{ needs.cross_host_anchor.outputs.anchor_sha256 }}
          EXPECTED_RECEIPT_SHA: ${{ needs.fresh_receipt.outputs.receipt_sha256 }}
          EXPECTED_COMMIT: ${{ needs.fresh_receipt.outputs.synthetic_commit }}
          EXPECTED_TREE: ${{ needs.fresh_receipt.outputs.synthetic_tree }}
          EXPECTED_GRANT_SHA: ${{ needs.admission_gate.outputs.grant_sha256 }}
          EXPECTED_NONCE: ${{ needs.admission_gate.outputs.nonce }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/payload"
          RECEIPT="$ROOT/fresh-receipt.json"
          GRANT="$ROOT/grant.json"
          LEDGER="$ROOT/nonce-ledger.txt"
          test "$(sha256sum "$RECEIPT" | awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA"
          test "$(sha256sum "$GRANT" | awk '{print $1}')" = "$EXPECTED_GRANT_SHA"
          export RECEIPT GRANT LEDGER
          node - <<'NODE'
          const fs=require('fs'); const r=require(process.env.RECEIPT),g=require(process.env.GRANT); const now=Date.now();
          const ok=[g.gate==='MANTYL_PREEXEC_ANCHORED_GRANT_V1',g.verdict==='ADMIT_BOUNDED',g.cross_host_anchor_sha256===process.env.EXPECTED_ANCHOR_SHA,
            g.source_receipt_sha256===process.env.EXPECTED_RECEIPT_SHA,g.workflow_run_id===process.env.GITHUB_RUN_ID,g.workflow_sha===process.env.GITHUB_SHA,
            g.synthetic_commit===process.env.EXPECTED_COMMIT,g.synthetic_tree===process.env.EXPECTED_TREE,g.scope==='SYNTHETIC_PROTECTED_PAYLOAD_V1',
            g.nonce===process.env.EXPECTED_NONCE,g.authority==='NONE',g.github_permissions==='NONE',g.external_publish===false,g.paid_layer_used===false,
            Date.parse(g.issued_at)<=now&&now<=Date.parse(g.expires_at),r.cross_host_anchor_sha256===g.cross_host_anchor_sha256];
          if(!ok.every(Boolean)) process.exit(83);
          let used=[];try{used=fs.readFileSync(process.env.LEDGER,'utf8').trim().split(/\n/).filter(Boolean)}catch{}
          if(used.includes(g.nonce)) process.exit(84); fs.appendFileSync(process.env.LEDGER,g.nonce+'\n');
          NODE
          printf 'ANCHORED_PROTECTED_PAYLOAD_EXECUTED\n' > "$ROOT/result.txt"
          test "$(cat "$ROOT/result.txt")" = 'ANCHORED_PROTECTED_PAYLOAD_EXECUTED'

  adversarial_matrix:
    name: Anchored fail-closed adversarial matrix
    needs: [cross_host_anchor, fresh_receipt, admission_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download receipt and grant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mantyl-anchored-*
          path: ${{ runner.temp }}/matrix
          merge-multiple: true
      - name: Run 8-case anchored matrix
        shell: bash
        env:
          EXPECTED_ANCHOR_SHA: ${{ needs.cross_host_anchor.outputs.anchor_sha256 }}
          EXPECTED_RECEIPT_SHA: ${{ needs.fresh_receipt.outputs.receipt_sha256 }}
          EXPECTED_COMMIT: ${{ needs.fresh_receipt.outputs.synthetic_commit }}
          EXPECTED_TREE: ${{ needs.fresh_receipt.outputs.synthetic_tree }}
          EXPECTED_GRANT_SHA: ${{ needs.admission_gate.outputs.grant_sha256 }}
          EXPECTED_NONCE: ${{ needs.admission_gate.outputs.nonce }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/matrix"; export RECEIPT="$ROOT/fresh-receipt.json" GRANT="$ROOT/grant.json"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const r=require(process.env.RECEIPT),g=require(process.env.GRANT);
          const rt=fs.readFileSync(process.env.RECEIPT,'utf8'),gt=fs.readFileSync(process.env.GRANT,'utf8');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          function verify(rr,rrt,gg,ggt,ledger,anchor=process.env.EXPECTED_ANCHOR_SHA){const now=Date.now();const ok=sha(rrt)===process.env.EXPECTED_RECEIPT_SHA&&sha(ggt)===process.env.EXPECTED_GRANT_SHA&&gg.gate==='MANTYL_PREEXEC_ANCHORED_GRANT_V1'&&gg.verdict==='ADMIT_BOUNDED'&&gg.cross_host_anchor_sha256===anchor&&rr.cross_host_anchor_sha256===anchor&&gg.source_receipt_sha256===sha(rrt)&&gg.workflow_run_id===process.env.GITHUB_RUN_ID&&gg.workflow_sha===process.env.GITHUB_SHA&&gg.synthetic_commit===process.env.EXPECTED_COMMIT&&gg.synthetic_tree===process.env.EXPECTED_TREE&&gg.scope==='SYNTHETIC_PROTECTED_PAYLOAD_V1'&&gg.nonce===process.env.EXPECTED_NONCE&&gg.authority==='NONE'&&gg.github_permissions==='NONE'&&Date.parse(gg.issued_at)<=now&&now<=Date.parse(gg.expires_at);if(!ok||ledger.has(gg.nonce))return false;ledger.add(gg.nonce);return true;}
          const out={};
          out.CLEAN_VALID=verify(r,rt,g,gt,new Set())===true;
          out.DIRECT_BYPASS_NO_GRANT=verify(r,rt,{},'{}',new Set())===false;
          const tr={...r,verification_passed:false},trt=JSON.stringify(tr,null,2)+'\n';out.TAMPERED_RECEIPT=verify(tr,trt,g,gt,new Set())===false;
          const wr={...r,synthetic_commit:'0'.repeat(40)},wrt=JSON.stringify(wr,null,2)+'\n';out.WRONG_COMMIT=verify(wr,wrt,g,gt,new Set())===false;
          const sr={...r,timestamp_utc:new Date(Date.now()-3600_000).toISOString()},srt=JSON.stringify(sr,null,2)+'\n';out.STALE_RECEIPT=sha(srt)!==process.env.EXPECTED_RECEIPT_SHA;
          const fg={...g,scope:'FORGED_SCOPE'},fgt=JSON.stringify(fg,null,2)+'\n';out.FORGED_GRANT=verify(r,rt,fg,fgt,new Set())===false;
          const ledger=new Set();out.REPLAYED_NONCE=verify(r,rt,g,gt,ledger)===true&&verify(r,rt,g,gt,ledger)===false;
          out.WRONG_CROSS_HOST_ANCHOR=verify(r,rt,g,gt,new Set(),'0'.repeat(64))===false;
          console.log(JSON.stringify(out,null,2));if(!Object.values(out).every(Boolean))process.exit(85);console.log(`ANCHORED_MATRIX_PASS=${Object.keys(out).length}/${Object.keys(out).length}`);
          NODE

  final_receipt:
    name: Normalize anchored control-plane receipt
    needs: [cross_host_anchor, fresh_receipt, admission_gate, protected_payload, adversarial_matrix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all gates and normalize
        shell: bash
        env:
          ANCHOR_RESULT: ${{ needs.cross_host_anchor.result }}
          FRESH_RESULT: ${{ needs.fresh_receipt.result }}
          GATE_RESULT: ${{ needs.admission_gate.result }}
          PAYLOAD_RESULT: ${{ needs.protected_payload.result }}
          MATRIX_RESULT: ${{ needs.adversarial_matrix.result }}
          ANCHOR_SHA: ${{ needs.cross_host_anchor.outputs.anchor_sha256 }}
          FRESH_RECEIPT_SHA: ${{ needs.fresh_receipt.outputs.receipt_sha256 }}
          GRANT_SHA: ${{ needs.admission_gate.outputs.grant_sha256 }}
        run: |
          set -euo pipefail
          test "$ANCHOR_RESULT" = success
          test "$FRESH_RESULT" = success
          test "$GATE_RESULT" = success
          test "$PAYLOAD_RESULT" = success
          test "$MATRIX_RESULT" = success
          RECEIPT="$RUNNER_TEMP/mantyl-anchored-preexec-final.json"
          node - <<'NODE' > "$RECEIPT"
          const r={gate:'MANTYL_CROSS_HOST_RECEIPT_CANONICAL_PERSISTENCE_AND_PREEXEC_FAIL_CLOSED_GATE_V1',timestamp_utc:new Date().toISOString(),
            workflow_run_id:process.env.GITHUB_RUN_ID,workflow_sha:process.env.GITHUB_SHA,
            canonical_cross_host_anchor_sha256:process.env.ANCHOR_SHA,cross_host_anchor_bound:true,
            fresh_project_receipt_sha256:process.env.FRESH_RECEIPT_SHA,scoped_grant_sha256:process.env.GRANT_SHA,
            mandatory_gate_inside_frozen_wrapper:true,protected_payload_requires_gate_job:true,
            adversarial_matrix:'8/8',direct_bypass_without_grant_denied:true,tampered_receipt_denied:true,wrong_commit_denied:true,
            stale_receipt_denied:true,forged_grant_denied:true,replayed_nonce_denied:true,wrong_cross_host_anchor_denied:true,
            least_privilege_github_permissions:'NONE',paid_layer_used:false,authority_promotion:false,global_bind:false,production_readiness_claim:false,
            runtime_admission:'TRUE_BOUNDED_SYNTHETIC_WRAPPER_ONLY',claim_ceiling:'Cross-host tool-behavior anchor plus fresh project receipt enforced inside frozen synthetic wrapper only; no external-wrapper bypass prevention or global authority claim.',
            verdict:'PASS_BOUNDED'};
          process.stdout.write(JSON.stringify(r,null,2)+'\n');
          NODE
          cat "$RECEIPT"
          printf 'FINAL_ANCHORED_RECEIPT_SHA256=%s\n' "$(sha256sum "$RECEIPT" | awk '{print $1}')"
      - name: Upload anchored final receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-anchored-preexec-final
          path: ${{ runner.temp }}/mantyl-anchored-preexec-final.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
