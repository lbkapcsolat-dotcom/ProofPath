name: Research Math P13 N-Run Reproducibility

on:
  push:
    branches:
      - research-math-p0-verifier
    paths:
      - "research_math/**"
      - ".github/workflows/research-math-p0.yml"
      - ".github/workflows/research-math-p3.yml"
      - ".github/workflows/research-math-p12-replay.yml"
      - ".github/workflows/research-math-p13-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  third-lean:
    name: P13 Third Run Lean + Mathlib
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install hash-verified Elan 4.2.4
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -o /tmp/elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize pinned Lake manifest
        working-directory: research_math/lean
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" update
          test -s lake-manifest.json
      - name: Kernel build + independent leanchecker
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: research_math/lean
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          leanchecker: true
          nanoda: false
      - name: Emit third-run Lean receipt
        run: |
          set -euo pipefail
          if git grep --line-number -E '\b(sorry|admit)\b' -- 'research_math/lean/*.lean'; then
            echo 'Forbidden proof placeholder found in tracked project source.' >&2
            exit 1
          fi
          mkdir -p out/p13/lean
          (
            cd research_math/lean
            lake env lean --version
            echo 'PROOFPATH_EVIDENCE THM-LIVE formal_kernel_proof formal_target=ResearchMathP0.square_nonnegative'
            echo 'lean_kernel_build=PASS'
            echo 'leanchecker=PASS'
            echo 'placeholder_gate=PASS'
          ) | tee out/p13/lean/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile lean --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/p13/lean/raw.log --repo-root . \
            --output out/p13/lean/receipt.json
      - name: Preserve third-run Lean receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p13-lean-${{ github.sha }}
          path: out/p13/lean
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  third-arb:
    name: P13 Third Run FLINT/Arb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Create isolated Python environment
        run: python3 -m venv .venv
      - name: Install hash-pinned python-flint
        run: .venv/bin/python -m pip install --require-hashes -r research_math/flint/requirements.txt
      - name: Execute third-run Arb witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/p13/arb
          .venv/bin/python research_math/flint/canary.py | tee out/p13/arb/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile arb --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/p13/arb/raw.log --repo-root . \
            --output out/p13/arb/receipt.json
      - name: Preserve third-run Arb receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p13-arb-${{ github.sha }}
          path: out/p13/arb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  third-julia:
    name: P13 Third Run Julia/HPC
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install exact Julia 1.12.7
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12.7'
          arch: 'x64'
      - name: Execute third-run Julia witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/p13/julia
          julia research_math/julia/canary.jl | tee out/p13/julia/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile julia --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/p13/julia/raw.log --repo-root . \
            --output out/p13/julia/receipt.json
      - name: Preserve third-run Julia receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p13-julia-${{ github.sha }}
          path: out/p13/julia
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  third-sage:
    name: P13 Third Run SageMath
    runs-on: ubuntu-latest
    env:
      SAGE_IMAGE: sagemath/sagemath@sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Pull exact SageMath 10.9 image digest
        run: |
          set -euo pipefail
          docker pull "$SAGE_IMAGE"
          resolved="$(docker image inspect --format='{{index .RepoDigests 0}}' "$SAGE_IMAGE")"
          test "$resolved" = "$SAGE_IMAGE"
      - name: Execute third-run Sage witness and receipt
        run: |
          set -euo pipefail
          mkdir -p out/p13/sage
          docker run --rm -v "$PWD:/work:ro" -w /work "$SAGE_IMAGE" \
            sage -python research_math/sage/canary.py | tee out/p13/sage/raw.log
          python3 research_math/orchestrator/live_evidence.py emit \
            --profile sage --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job "$GITHUB_JOB" --raw-log out/p13/sage/raw.log --repo-root . \
            --output out/p13/sage/receipt.json
      - name: Preserve third-run Sage receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p13-sage-${{ github.sha }}
          path: out/p13/sage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  n-run-registry:
    name: P13 N-Run Reproducibility + Divergence Registry
    needs: [third-lean, third-arb, third-julia, third-sage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read back third-run engine artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-p13-*-${{ github.sha }}
          path: out/p13-input
          merge-multiple: false

      - name: Build third live binding
        run: |
          set -euo pipefail
          mkdir -p out/p13-third
          python3 research_math/orchestrator/live_evidence.py bind \
            --receipts-root out/p13-input --repo-root . \
            --claims research_math/orchestrator/live_claims.json \
            --source-sha "$GITHUB_SHA" \
            --output out/p13-third/live-math-assurance.json

      - name: Resolve exact-SHA primary and P12 runs
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/prior-meta
          primary=''
          replay=''
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/research-math-p0.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=10" \
              > out/prior-meta/primary.json
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/research-math-p12-replay.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=10" \
              > out/prior-meta/replay.json
            read -r primary replay < <(python3 - <<'PY'
          import json, os
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']
          def choose(path):
              data=json.loads(Path(path).read_text())
              for run in data.get('workflow_runs', []):
                  if run.get('head_sha')==sha and run.get('status')=='completed' and run.get('conclusion')=='success':
                      return str(run['id'])
              return ''
          print(choose('out/prior-meta/primary.json'), choose('out/prior-meta/replay.json'))
          PY
            )
            if [ -n "$primary" ] && [ -n "$replay" ]; then break; fi
            sleep 5
          done
          if [ -z "$primary" ] || [ -z "$replay" ]; then
            echo 'Missing successful exact-SHA primary or P12 run.' >&2
            exit 1
          fi
          test "$primary" != "$replay"
          test "$primary" != "$GITHUB_RUN_ID"
          test "$replay" != "$GITHUB_RUN_ID"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "replay=$replay" >> "$GITHUB_OUTPUT"
          echo "primary_run_id=$primary"
          echo "p12_run_id=$replay"
          echo "p13_run_id=$GITHUB_RUN_ID"

      - name: Read back primary P11 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: math-live-assurance-${{ github.sha }}
          path: out/primary
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior.outputs.primary }}

      - name: Read back P12 cross-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: math-p12-cross-run-${{ github.sha }}
          path: out/p12-prior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior.outputs.replay }}

      - name: Build three sealed run manifests
        run: |
          set -euo pipefail
          mkdir -p out/p13-registry/manifests
          primary_binding=out/primary/out/live-bound/live-math-assurance.json
          primary_arb="out/primary/out/live-input/math-live-arb-$GITHUB_SHA/raw.log"
          replay_binding=out/p12-prior/out/replay-bound/live-math-assurance.json
          replay_arb="out/p12-prior/out/replay-input/math-replay-arb-$GITHUB_SHA/raw.log"
          third_binding=out/p13-third/live-math-assurance.json
          third_arb="out/p13-input/math-p13-arb-$GITHUB_SHA/raw.log"
          for path in "$primary_binding" "$primary_arb" "$replay_binding" "$replay_arb" "$third_binding" "$third_arb"; do
            test -f "$path" || { echo "Missing P13 input: $path" >&2; find out -maxdepth 6 -type f | sort; exit 1; }
          done
          python3 research_math/orchestrator/reproducibility_registry.py manifest \
            --binding "$primary_binding" --source-sha "$GITHUB_SHA" \
            --policy research_math/orchestrator/reproducibility_policy.json \
            --metric-log "arb=$primary_arb" \
            --output out/p13-registry/manifests/primary.json
          python3 research_math/orchestrator/reproducibility_registry.py manifest \
            --binding "$replay_binding" --source-sha "$GITHUB_SHA" \
            --policy research_math/orchestrator/reproducibility_policy.json \
            --metric-log "arb=$replay_arb" \
            --output out/p13-registry/manifests/p12.json
          python3 research_math/orchestrator/reproducibility_registry.py manifest \
            --binding "$third_binding" --source-sha "$GITHUB_SHA" \
            --policy research_math/orchestrator/reproducibility_policy.json \
            --metric-log "arb=$third_arb" \
            --output out/p13-registry/manifests/p13.json

      - name: P13 N-run registry gate
        run: |
          set -euo pipefail
          python3 research_math/orchestrator/reproducibility_registry.py registry \
            --manifest out/p13-registry/manifests/primary.json \
            --manifest out/p13-registry/manifests/p12.json \
            --manifest out/p13-registry/manifests/p13.json \
            --source-sha "$GITHUB_SHA" \
            --policy research_math/orchestrator/reproducibility_policy.json \
            --output out/p13-registry/divergence-registry.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/p13-registry/divergence-registry.json').read_text())
          assert r['status']=='PASS'
          assert r['run_count'] >= 3
          assert len(set(r['run_ids'])) == r['run_count']
          claims={x['claim_id']:x for x in r['claims']}
          for cid in ['ALG-LIVE','THM-LIVE','HPC-LIVE']:
              assert claims[cid]['mode']=='BIT_EXACT' and claims[cid]['status']=='PASS'
          rig=claims['RIG-LIVE']
          assert rig['mode']=='BOUNDED_NUMERIC' and rig['status']=='PASS'
          m=rig['metrics']['arb_residual_radius']
          assert m['status']=='PASS'
          print('P13 N-RUN REPRODUCIBILITY = PASS')
          print('P13 BIT-EXACT CLAIMS = PASS')
          print('P13 BOUNDED NUMERIC TOLERANCE = PASS')
          print('P13 RUN IDS =', r['run_ids'])
          print('P13 ARB RANGE =', m['observed_min'], m['observed_max'], 'spread=', m['observed_spread'])
          print('P13 REGISTRY SHA256 =', r['registry_sha256'])
          PY

      - name: Seal P13 evidence
        run: |
          set -euo pipefail
          find out/p13-input -type f -print0 | sort -z | xargs -0 sha256sum > out/p13-registry/third-run-files-sha256.txt
          sha256sum \
            research_math/orchestrator/reproducibility_policy.json \
            research_math/orchestrator/reproducibility_registry.py \
            out/p13-registry/manifests/primary.json \
            out/p13-registry/manifests/p12.json \
            out/p13-registry/manifests/p13.json \
            out/p13-registry/divergence-registry.json \
            out/p13-registry/third-run-files-sha256.txt \
            | tee out/p13-registry/p13-sha256.txt
          {
            echo '## P13 N-Run Reproducibility + Divergence Registry'
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Primary run: ${{ steps.prior.outputs.primary }}"
            echo "- P12 replay run: ${{ steps.prior.outputs.replay }}"
            echo "- P13 third run: $GITHUB_RUN_ID"
            echo '- N>=3 distinct run gate: PASS'
            echo '- ALG/THM/HPC exact semantic fingerprints: PASS'
            echo '- RIG bounded numeric tolerance: PASS'
            echo '- Any unapproved divergence is HOLD by policy'
            echo '- Claim ceiling: exact snapshot + configured live claims + declared P13 policy only'
            echo '```'
            cat out/p13-registry/p13-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve P13 N-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-p13-n-run-${{ github.sha }}
          path: |
            out/p13-input
            out/p13-third
            out/p13-registry
            research_math/orchestrator/reproducibility_policy.json
            research_math/orchestrator/reproducibility_registry.py
            research_math/orchestrator/live_claims.json
            research_math/orchestrator/live_evidence.py
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
