name: Mantyl Real ALPHA Shadow V3

on:
  push:
    branches:
      - alpha/mantyl-real-shadow-v3
  workflow_dispatch:

permissions:
  contents: read

env:
  REAL_MAIN_SHA: "5952ba59762bc9cb800e3fa82ab61748b25728c3"
  REAL_REFERENCE_TREE: "efd70b2eccea206e9a7a51f1d115cfeb29180b89"
  MANTYL_VERSION: "0.5.0"
  EXPECTED_INTEGRITY: "sha512-hQI/oLTU0er9fuAc2uLsUB2mmptXrqW1S1psFe/0js0gK3w80eupiVBTWysag5V62unV9LYJuF6Va5VPdfh5Eg=="
  CROSS_HOST_ANCHOR_SHA: "b34666d6d70b38c956250197fc3ba2ed3c4dfa43a72334d1e300e255a81bcc45"
  PREEXEC_ANCHOR_SHA: "a73941023f5050130bc00d2c383411a93bdc16c05d894bc7f8e07456a05cdc53"
  EXPECTED_REPORT_SHA: "cb6452ab0fdb2d90f797400762b2734020e4566d10571458c3fe3486ece73748"
  EXPECTED_MANIFEST_SHA: "1236fac1bef8f780cd2bc298cd89475b79ff70c553b5d816764a1779d6ffe59d"
  EXPECTED_CLOSURE_SHA: "c92a5d3e631dd471c2291fb99317aad7f5abce56e54bbf3a0d70b9716b2f514d"
  MAX_RECEIPT_AGE_SECONDS: "900"
  GRANT_TTL_SECONDS: "300"

jobs:
  evidence:
    name: Real baseline plus Mantyl evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      receipt_sha: ${{ steps.receipt.outputs.receipt_sha }}
      report_sha: ${{ steps.receipt.outputs.report_sha }}
      manifest_sha: ${{ steps.receipt.outputs.manifest_sha }}
      closure_sha: ${{ steps.receipt.outputs.closure_sha }}
      passport_sha: ${{ steps.receipt.outputs.passport_sha }}
      passport_digest: ${{ steps.receipt.outputs.passport_digest }}
    steps:
      - name: Checkout immutable control evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout exact real main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REAL_MAIN_SHA }}
          path: real
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify source and anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C real rev-parse HEAD)" = "$REAL_MAIN_SHA"
          test "$(git -C real rev-parse HEAD:reference_engine)" = "$REAL_REFERENCE_TREE"
          test "$(sha256sum control/.alpha/receipts/MANTYL_CROSS_HOST_RUN_33917109281.json | awk '{print $1}')" = "$CROSS_HOST_ANCHOR_SHA"
          test "$(sha256sum control/.alpha/receipts/MANTYL_ANCHORED_PREEXEC_CONTROL_PLANE_RUN_33918597107.json | awk '{print $1}')" = "$PREEXEC_ANCHOR_SHA"
      - name: Run existing ungated baseline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1
          cd real/reference_engine
          python -m pytest -q
          python scripts/run_reference_closure.py --out /tmp/reference-baseline
          python scripts/run_adversarial_closure.py --out /tmp/adversarial-baseline
          REPORT_SHA="$(sha256sum /tmp/adversarial-baseline/run_a/report.json | awk '{print $1}')"
          MANIFEST_SHA="$(sha256sum /tmp/adversarial-baseline/run_a/manifest.sha256 | awk '{print $1}')"
          CLOSURE_SHA="$(sha256sum /tmp/adversarial-baseline/closure_report.json | awk '{print $1}')"
          test "$REPORT_SHA" = "$EXPECTED_REPORT_SHA"
          test "$MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA"
          test "$CLOSURE_SHA" = "$EXPECTED_CLOSURE_SHA"
          printf 'BASE_REPORT_SHA=%s\nBASE_MANIFEST_SHA=%s\nBASE_CLOSURE_SHA=%s\n' "$REPORT_SHA" "$MANIFEST_SHA" "$CLOSURE_SHA" >> "$GITHUB_ENV"
      - name: Pin Mantyl and verify exact real work-unit copy
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mantyl-real-v3"; TOOL="$ROOT/tool"; WORK="$ROOT/reference_engine"
          mkdir -p "$TOOL" "$WORK"; cp -a real/reference_engine/. "$WORK/"
          cd "$TOOL"
          test "$(npm view "mantyl@$MANTYL_VERSION" version)" = "$MANTYL_VERSION"
          test "$(npm view "mantyl@$MANTYL_VERSION" dist.integrity)" = "$EXPECTED_INTEGRITY"
          npm pack "mantyl@$MANTYL_VERSION" --json > pack.json
          TARBALL="$(node -e 'console.log(require("./pack.json")[0].filename)')"
          test "$(node -e 'console.log(require("./pack.json")[0].integrity)')" = "$EXPECTED_INTEGRITY"
          npm install --prefix "$TOOL/install" "$TOOL/$TARBALL"
          MANTYL_BIN="$TOOL/install/node_modules/.bin/mantyl"
          printf 'MANTYL_TARBALL_SHA256=%s\n' "$(sha256sum "$TARBALL" | awk '{print $1}')" >> "$GITHUB_ENV"
          cd "$WORK"
          git init -b main; git config user.name 'ALPHA Real Shadow Canary'; git config user.email 'canary@example.invalid'
          "$MANTYL_BIN" init
          git add .
          GIT_AUTHOR_DATE='2026-09-04T00:00:00Z' GIT_COMMITTER_DATE='2026-09-04T00:00:00Z' git commit -m 'Exact real reference-engine work unit plus Mantyl config'
          "$MANTYL_BIN" scan
          "$MANTYL_BIN" verify
          "$MANTYL_BIN" generate
          test -s .mantyl/passport.json
          printf 'REAL_WORK=%s\nMANTYL_BIN=%s\n' "$WORK" "$MANTYL_BIN" >> "$GITHUB_ENV"
      - name: Normalize real evidence receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          PASSPORT="$REAL_WORK/.mantyl/passport.json"
          export PASSPORT_SHA="$(sha256sum "$PASSPORT" | awk '{print $1}')"
          export PASSPORT_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.passportDigest)' "$PASSPORT")"
          export EVIDENCE_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.evidenceDigest)' "$PASSPORT")"
          export FILE_MANIFEST_DIGEST="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.integrity.fileManifestDigest)' "$PASSPORT")"
          RECEIPT="$RUNNER_TEMP/mantyl-real-v3-receipt.json"
          node - <<'NODE' > "$RECEIPT"
          const r={gate:'MANTYL_REAL_ALPHA_REFERENCE_ENGINE_RECEIPT_V3',timestamp_utc:new Date().toISOString(),workflow_run_id:process.env.GITHUB_RUN_ID,workflow_sha:process.env.GITHUB_SHA,
            source_main_sha:process.env.REAL_MAIN_SHA,source_reference_engine_tree:process.env.REAL_REFERENCE_TREE,cross_host_anchor_sha256:process.env.CROSS_HOST_ANCHOR_SHA,preexec_anchor_sha256:process.env.PREEXEC_ANCHOR_SHA,
            baseline_report_sha256:process.env.BASE_REPORT_SHA,baseline_manifest_sha256:process.env.BASE_MANIFEST_SHA,baseline_closure_sha256:process.env.BASE_CLOSURE_SHA,
            mantyl_version:process.env.MANTYL_VERSION,registry_integrity:process.env.EXPECTED_INTEGRITY,package_tarball_sha256:process.env.MANTYL_TARBALL_SHA256,
            passport_sha256:process.env.PASSPORT_SHA,passport_digest:process.env.PASSPORT_DIGEST,evidence_digest:process.env.EVIDENCE_DIGEST,file_manifest_digest:process.env.FILE_MANIFEST_DIGEST,
            verification_command_exit_zero:true,external_publish:false,paid_layer_used:false,authority_promotion:false,global_bind:false,production_readiness_claim:false,verdict:'PASS_BOUNDED'};
          process.stdout.write(JSON.stringify(r,null,2)+'\n');
          NODE
          RECEIPT_SHA="$(sha256sum "$RECEIPT" | awk '{print $1}')"
          printf 'receipt_sha=%s\nreport_sha=%s\nmanifest_sha=%s\nclosure_sha=%s\npassport_sha=%s\npassport_digest=%s\n' "$RECEIPT_SHA" "$BASE_REPORT_SHA" "$BASE_MANIFEST_SHA" "$BASE_CLOSURE_SHA" "$PASSPORT_SHA" "$PASSPORT_DIGEST" >> "$GITHUB_OUTPUT"
          cat "$RECEIPT"; printf 'REAL_EVIDENCE_RECEIPT_SHA256=%s\n' "$RECEIPT_SHA"
      - name: Upload evidence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-real-v3-evidence
          path: ${{ runner.temp }}/mantyl-real-v3-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  gate:
    name: Issue two bounded one-shot grants
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      grants_sha: ${{ steps.issue.outputs.grants_sha }}
    steps:
      - name: Download evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mantyl-real-v3-evidence
          path: ${{ runner.temp }}/gate
      - name: Validate evidence and issue grants
        id: issue
        shell: bash
        env:
          EXPECTED_RECEIPT_SHA: ${{ needs.evidence.outputs.receipt_sha }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/gate/mantyl-real-v3-receipt.json"; GRANTS="$RUNNER_TEMP/gate/grants.json"
          test "$(sha256sum "$RECEIPT" | awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA"
          export RECEIPT GRANTS
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'); const r=JSON.parse(fs.readFileSync(process.env.RECEIPT,'utf8')); const age=(Date.now()-Date.parse(r.timestamp_utc))/1000;
          const ok=r.gate==='MANTYL_REAL_ALPHA_REFERENCE_ENGINE_RECEIPT_V3'&&r.verdict==='PASS_BOUNDED'&&r.verification_command_exit_zero===true&&r.source_main_sha===process.env.REAL_MAIN_SHA&&
            r.source_reference_engine_tree===process.env.REAL_REFERENCE_TREE&&r.cross_host_anchor_sha256===process.env.CROSS_HOST_ANCHOR_SHA&&r.preexec_anchor_sha256===process.env.PREEXEC_ANCHOR_SHA&&
            r.baseline_report_sha256===process.env.EXPECTED_REPORT_SHA&&r.baseline_manifest_sha256===process.env.EXPECTED_MANIFEST_SHA&&r.baseline_closure_sha256===process.env.EXPECTED_CLOSURE_SHA&&
            r.mantyl_version===process.env.MANTYL_VERSION&&r.registry_integrity===process.env.EXPECTED_INTEGRITY&&r.external_publish===false&&r.paid_layer_used===false&&r.authority_promotion===false&&r.global_bind===false&&r.production_readiness_claim===false&&
            Number.isFinite(age)&&age>=0&&age<=Number(process.env.MAX_RECEIPT_AGE_SECONDS); if(!ok)process.exit(73);
          const mk=run=>{const issued=new Date(),expires=new Date(issued.getTime()+Number(process.env.GRANT_TTL_SECONDS)*1000);return {gate:'MANTYL_REAL_ALPHA_SCOPED_GRANT_V3',run,source_receipt_sha256:process.env.EXPECTED_RECEIPT_SHA,source_main_sha:process.env.REAL_MAIN_SHA,source_reference_engine_tree:process.env.REAL_REFERENCE_TREE,cross_host_anchor_sha256:process.env.CROSS_HOST_ANCHOR_SHA,preexec_anchor_sha256:process.env.PREEXEC_ANCHOR_SHA,scope:'REFERENCE_ENGINE_EXISTING_VERIFICATION_COMMANDS_ONLY',nonce:crypto.randomBytes(32).toString('hex'),issued_at:issued.toISOString(),expires_at:expires.toISOString(),authority:'NONE',github_permissions:'CONTENTS_READ_ONLY',external_publish:false,paid_layer_used:false,verdict:'ADMIT_BOUNDED'};};
          fs.writeFileSync(process.env.GRANTS,JSON.stringify({A:mk('A'),B:mk('B')},null,2)+'\n');
          NODE
          SHA="$(sha256sum "$GRANTS"|awk '{print $1}')"; printf 'grants_sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"; cat "$GRANTS"; printf 'GRANTS_SHA256=%s\n' "$SHA"
      - name: Upload grants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-real-v3-grants
          path: ${{ runner.temp }}/gate/grants.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  shadow:
    name: Real gated shadow, fail-closed matrix, rollback, replay
    needs: [evidence, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      normalized_sha: ${{ steps.shadow.outputs.normalized_sha }}
    steps:
      - name: Checkout exact real main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REAL_MAIN_SHA }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install existing test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Download evidence and grants
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mantyl-real-v3-*
          path: ${{ runner.temp }}/shadow
          merge-multiple: true
      - name: Execute matrix, rollback and two exact payload runs
        id: shadow
        shell: bash
        env:
          EXPECTED_RECEIPT_SHA: ${{ needs.evidence.outputs.receipt_sha }}
          EXPECTED_GRANTS_SHA: ${{ needs.gate.outputs.grants_sha }}
          BASE_REPORT_SHA: ${{ needs.evidence.outputs.report_sha }}
          BASE_MANIFEST_SHA: ${{ needs.evidence.outputs.manifest_sha }}
          BASE_CLOSURE_SHA: ${{ needs.evidence.outputs.closure_sha }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/shadow"; RECEIPT="$ROOT/mantyl-real-v3-receipt.json"; GRANTS="$ROOT/grants.json"; export RECEIPT GRANTS
          test "$(sha256sum "$RECEIPT"|awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA"; test "$(sha256sum "$GRANTS"|awk '{print $1}')" = "$EXPECTED_GRANTS_SHA"
          cat > "$RUNNER_TEMP/verify-grant.js" <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.RECEIPT,'utf8')),gs=JSON.parse(fs.readFileSync(process.env.GRANTS,'utf8')); const run=process.argv[2],ledger=process.argv[3],g=gs[run],now=Date.now();
          const receiptSha=crypto.createHash('sha256').update(fs.readFileSync(process.env.RECEIPT,'utf8')).digest('hex');
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=cp.execFileSync('git',['rev-parse','HEAD:reference_engine'],{encoding:'utf8'}).trim();
          const dirty=cp.spawnSync('git',['diff','--quiet','--','reference_engine']).status!==0;
          const valid=g&&g.gate==='MANTYL_REAL_ALPHA_SCOPED_GRANT_V3'&&g.verdict==='ADMIT_BOUNDED'&&g.run===run&&g.source_receipt_sha256===receiptSha&&g.source_main_sha===head&&head===process.env.REAL_MAIN_SHA&&
            g.source_reference_engine_tree===tree&&tree===process.env.REAL_REFERENCE_TREE&&!dirty&&g.cross_host_anchor_sha256===process.env.CROSS_HOST_ANCHOR_SHA&&g.preexec_anchor_sha256===process.env.PREEXEC_ANCHOR_SHA&&
            g.scope==='REFERENCE_ENGINE_EXISTING_VERIFICATION_COMMANDS_ONLY'&&g.authority==='NONE'&&g.github_permissions==='CONTENTS_READ_ONLY'&&g.external_publish===false&&g.paid_layer_used===false&&Date.parse(g.issued_at)<=now&&now<=Date.parse(g.expires_at)&&
            r.source_main_sha===g.source_main_sha&&r.source_reference_engine_tree===g.source_reference_engine_tree;
          let used=[];try{used=fs.readFileSync(ledger,'utf8').trim().split(/\n/).filter(Boolean)}catch{} if(!valid||used.includes(g.nonce))process.exit(74);fs.appendFileSync(ledger,g.nonce+'\n');
          NODE
          run_payload(){ L="$1"; REF="/tmp/ref-$L"; ADV="/tmp/adv-$L"; rm -rf "$REF" "$ADV"; (cd reference_engine && python -m pytest -q && python scripts/run_reference_closure.py --out "$REF" && python scripts/run_adversarial_closure.py --out "$ADV"); R="$(sha256sum "$ADV/run_a/report.json"|awk '{print $1}')"; M="$(sha256sum "$ADV/run_a/manifest.sha256"|awk '{print $1}')"; C="$(sha256sum "$ADV/closure_report.json"|awk '{print $1}')"; test "$R" = "$BASE_REPORT_SHA"; test "$M" = "$BASE_MANIFEST_SHA"; test "$C" = "$BASE_CLOSURE_SHA"; printf '{"main_sha":"%s","tree":"%s","report":"%s","manifest":"%s","closure":"%s","cross_host_anchor":"%s","preexec_anchor":"%s","mantyl":"%s"}\n' "$REAL_MAIN_SHA" "$REAL_REFERENCE_TREE" "$R" "$M" "$C" "$CROSS_HOST_ANCHOR_SHA" "$PREEXEC_ANCHOR_SHA" "$MANTYL_VERSION" > "$RUNNER_TEMP/norm-$L.json"; }
          LEDGER="$RUNNER_TEMP/ledger"; node "$RUNNER_TEMP/verify-grant.js" A "$LEDGER"; run_payload A
          if node "$RUNNER_TEMP/verify-grant.js" A "$LEDGER"; then exit 81; else echo REPLAYED_NONCE_DENIED; fi
          if node "$RUNNER_TEMP/verify-grant.js" C "$RUNNER_TEMP/missing"; then exit 82; else echo MISSING_GRANT_DENIED; fi
          cp "$RECEIPT" "$RUNNER_TEMP/tampered.json"; printf ' ' >> "$RUNNER_TEMP/tampered.json"; R0="$RECEIPT"; export RECEIPT="$RUNNER_TEMP/tampered.json"; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/tamper"; then exit 83; else echo TAMPERED_RECEIPT_DENIED; fi; export RECEIPT="$R0"
          cp "$RECEIPT" "$RUNNER_TEMP/stale.json"; node -e 'const fs=require("fs");const p=process.argv[1],o=require(p);o.timestamp_utc="2000-01-01T00:00:00.000Z";fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n")' "$RUNNER_TEMP/stale.json"; export RECEIPT="$RUNNER_TEMP/stale.json"; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/stale-ledger"; then exit 84; else echo STALE_RECEIPT_DENIED; fi; export RECEIPT="$R0"
          cp "$GRANTS" "$RUNNER_TEMP/forged.json"; node -e 'const fs=require("fs");const p=process.argv[1],o=require(p);o.B.scope="FORGED_SCOPE";fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n")' "$RUNNER_TEMP/forged.json"; G0="$GRANTS"; export GRANTS="$RUNNER_TEMP/forged.json"; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/forged-ledger"; then exit 85; else echo FORGED_GRANT_DENIED; fi; export GRANTS="$G0"
          cp "$GRANTS" "$RUNNER_TEMP/wrongtree.json"; node -e 'const fs=require("fs");const p=process.argv[1],o=require(p);o.B.source_reference_engine_tree="0000000000000000000000000000000000000000";fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n")' "$RUNNER_TEMP/wrongtree.json"; export GRANTS="$RUNNER_TEMP/wrongtree.json"; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/wrongtree-ledger"; then exit 86; else echo WRONG_TREE_DENIED; fi; export GRANTS="$G0"
          cp "$GRANTS" "$RUNNER_TEMP/wronganchor.json"; node -e 'const fs=require("fs");const p=process.argv[1],o=require(p);o.B.cross_host_anchor_sha256="0".repeat(64);fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n")' "$RUNNER_TEMP/wronganchor.json"; export GRANTS="$RUNNER_TEMP/wronganchor.json"; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/wronganchor-ledger"; then exit 87; else echo WRONG_ANCHOR_DENIED; fi; export GRANTS="$G0"
          printf '\n# rollback-canary\n' >> reference_engine/pyproject.toml; if node "$RUNNER_TEMP/verify-grant.js" B "$RUNNER_TEMP/dirty-ledger"; then exit 88; else echo DIRTY_WORKTREE_DENIED; fi
          git checkout -- reference_engine/pyproject.toml; git clean -fdx reference_engine >/dev/null; git diff --quiet -- reference_engine; test "$(git rev-parse HEAD:reference_engine)" = "$REAL_REFERENCE_TREE"; echo ROLLBACK_TO_EXACT_SOURCE_PASS
          node "$RUNNER_TEMP/verify-grant.js" B "$LEDGER"; run_payload B
          A="$(sha256sum "$RUNNER_TEMP/norm-A.json"|awk '{print $1}')"; B="$(sha256sum "$RUNNER_TEMP/norm-B.json"|awk '{print $1}')"; test "$A" = "$B"; printf 'normalized_sha=%s\n' "$A" >> "$GITHUB_OUTPUT"; printf 'NORMALIZED_EQUALITY_SHA256=%s\n' "$A"; echo FAIL_CLOSED_MATRIX_PASS=7_DENIALS_PLUS_ROLLBACK
      - name: Upload normalized receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mantyl-real-v3-normalized
          path: |
            ${{ runner.temp }}/norm-A.json
            ${{ runner.temp }}/norm-B.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  final:
    name: Final real-workflow bounded admission receipt
    needs: [evidence, gate, shadow]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Normalize final receipt
        shell: bash
        env:
          REAL_RECEIPT_SHA: ${{ needs.evidence.outputs.receipt_sha }}
          REPORT_SHA: ${{ needs.evidence.outputs.report_sha }}
          MANIFEST_SHA: ${{ needs.evidence.outputs.manifest_sha }}
          CLOSURE_SHA: ${{ needs.evidence.outputs.closure_sha }}
          PASSPORT_SHA: ${{ needs.evidence.outputs.passport_sha }}
          PASSPORT_DIGEST: ${{ needs.evidence.outputs.passport_digest }}
          GRANTS_SHA: ${{ needs.gate.outputs.grants_sha }}
          NORMALIZED_SHA: ${{ needs.shadow.outputs.normalized_sha }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/mantyl-real-alpha-shadow-v3-final.json"
          node - <<'NODE' > "$RECEIPT"
          const r={gate:'MANTYL_REAL_ALPHA_SHADOW_WORKFLOW_AND_BOUNDED_RUNTIME_ADMISSION_V1',implementation_revision:'V3_REAL_WORKTREE_VERIFIER',timestamp_utc:new Date().toISOString(),workflow_run_id:process.env.GITHUB_RUN_ID,workflow_sha:process.env.GITHUB_SHA,
            real_source_main_sha:process.env.REAL_MAIN_SHA,real_reference_engine_tree:process.env.REAL_REFERENCE_TREE,cross_host_anchor_sha256:process.env.CROSS_HOST_ANCHOR_SHA,preexec_anchor_sha256:process.env.PREEXEC_ANCHOR_SHA,
            real_project_receipt_sha256:process.env.REAL_RECEIPT_SHA,mantyl_passport_sha256:process.env.PASSPORT_SHA,mantyl_passport_digest:process.env.PASSPORT_DIGEST,scoped_grants_sha256:process.env.GRANTS_SHA,
            baseline_report_sha256:process.env.REPORT_SHA,baseline_manifest_sha256:process.env.MANIFEST_SHA,baseline_closure_sha256:process.env.CLOSURE_SHA,gated_shadow_matches_baseline:true,second_clean_replay:true,normalized_receipt_equality:true,normalized_receipt_sha256:process.env.NORMALIZED_SHA,
            missing_grant_denied:true,replayed_nonce_denied:true,tampered_receipt_denied:true,stale_receipt_denied:true,forged_grant_denied:true,wrong_source_tree_denied:true,wrong_cross_host_anchor_denied:true,dirty_worktree_denied:true,rollback_to_exact_source_passed:true,
            false_deny_observed:false,false_admit_observed:false,least_authority:'CONTENTS_READ_ONLY',external_publish:false,paid_layer_used:false,runtime_admission:'TRUE_BOUNDED_REAL_REFERENCE_ENGINE_SHADOW_ONLY',authority_promotion:false,global_bind:false,production_readiness_claim:false,
