name: ess-docker-mcp-paper-search-live-canary-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-paper-search-live-canary-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest

jobs:
  paper-search-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p evidence/docker-mcp-paper-search "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          matches=[a for a in rel['assets'] if a['name']=='docker-mcp-linux-amd64.tar.gz']
          assert len(matches)==1,matches
          a=matches[0]
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          pathlib.Path('evidence/docker-mcp-paper-search/gateway-release.json').write_text(json.dumps({'tag':tag,'asset':a['name'],'bytes':a['size']},indent=2,sort_keys=True))
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee evidence/docker-mcp-paper-search/docker-mcp-version.txt
          grep -F "${MCP_GATEWAY_VERSION#v}" evidence/docker-mcp-paper-search/docker-mcp-version.txt

      - name: Pull catalog and prove Paper Search tool contract
        run: |
          set -euxo pipefail
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" 2>&1 | tee evidence/docker-mcp-paper-search/catalog-pull.log
          docker mcp catalog server inspect "$DOCKER_MCP_CATALOG" paper-search --format json > evidence/docker-mcp-paper-search/paper-search-inspect.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/docker-mcp-paper-search/paper-search-inspect.json')
          o=json.loads(p.read_text())
          text=json.dumps(o)
          assert 'search_arxiv' in text, 'HOLD_SEARCH_ARXIV_NOT_IN_CATALOG_CONTRACT'
          # Paper Search itself must not require a mandatory secret for this canary.
          server=o.get('snapshot',{}).get('server',{})
          assert not server.get('secrets'), f'HOLD_UNEXPECTED_REQUIRED_SECRETS:{server.get("secrets")}'
          print('PASS_PAPER_SEARCH_CATALOG_CONTRACT_SEARCH_ARXIV')
          PY

      - name: Execute live search_arxiv through Docker MCP Gateway
        run: |
          set -euxo pipefail
          docker mcp tools call --help > evidence/docker-mcp-paper-search/tools-call-help.txt 2>&1
          timeout --signal=TERM --kill-after=10s 120s \
            docker mcp tools --gateway-arg=--servers=paper-search call search_arxiv \
            'query=higher category theory homotopy theory' \
            > evidence/docker-mcp-paper-search/search-arxiv-live.out \
            2> evidence/docker-mcp-paper-search/search-arxiv-live.err
          test -s evidence/docker-mcp-paper-search/search-arxiv-live.out
          grep -Eiq 'arxiv|paper|title|category|homotopy' evidence/docker-mcp-paper-search/search-arxiv-live.out
          echo PASS_DOCKER_MCP_PAPER_SEARCH_LIVE_CALLABLE | tee evidence/docker-mcp-paper-search/gate-status.txt

      - name: Build bounded receipt and SHA manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('evidence/docker-mcp-paper-search')
          receipt={
            'gate':'ESS_DOCKER_MCP_PAPER_SEARCH_LIVE_CALLABLE_CANARY_V1',
            'status':'PASS_DOCKER_MCP_PAPER_SEARCH_LIVE_CALLABLE',
            'gateway_version':os.environ['MCP_GATEWAY_VERSION'],
            'server':'paper-search',
            'tool':'search_arxiv',
            'query':'higher category theory homotopy theory',
            'zero_spend':True,
            'secret_injected':False,
            'external_actuation':False,
            'production_ready':False,
            'global_bind':False,
          }
          (root/'bounded-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='sha256-manifest.txt':
                  b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-paper-search-live-canary-v1
          path: evidence/docker-mcp-paper-search/
          if-no-files-found: error
          retention-days: 30
