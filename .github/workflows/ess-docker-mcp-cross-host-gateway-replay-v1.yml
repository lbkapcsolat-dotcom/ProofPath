name: ess-docker-mcp-cross-host-gateway-replay-v1

on:
  push:
    branches: [equilibrium-human-operator-runtime-evidence-v1]
    paths:
      - '.github/workflows/ess-docker-mcp-cross-host-gateway-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_GATEWAY_VERSION: v0.43.3
  DOCKER_MCP_CATALOG: mcp/docker-mcp-catalog:latest
  QUERY_TEXT: higher category theory homotopy theory

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        host_label: [host-a, host-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Freeze request, route, and host identity
        run: |
          set -euxo pipefail
          ROOT="evidence/cross-host/${{ matrix.host_label }}"
          mkdir -p "$ROOT"
          python - <<'PY'
          import hashlib,json,os,pathlib,socket,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from router import load_profile,load_policy,route_request
          root=pathlib.Path('evidence/cross-host/${{ matrix.host_label }}')
          request={'domain':'papers','intent':'search','arguments':{'query':os.environ['QUERY_TEXT'],'max_results':3}}
          profile=load_profile(pathlib.Path('ess_docker_mcp_router/ESS_DOCKER_MCP_13_PROVEN_LIVE_EXPERT_SURFACES_CONTROLLED_PROFILE_V1.json'))
          policy=load_policy(pathlib.Path('ess_docker_mcp_router/policy.json'))
          route=route_request(request,profile,policy)
          assert route['decision']=='ALLOW' and route['surface']=='paper-search' and route['tool']=='search_arxiv' and route['transport']=='gateway-profile',route
          def read(p):
            try:return pathlib.Path(p).read_text().strip()
            except Exception:return None
          identity={
            'host_label':'${{ matrix.host_label }}','hostname':socket.gethostname(),
            'boot_id':read('/proc/sys/kernel/random/boot_id'),'machine_id':read('/etc/machine-id'),
            'product_uuid':read('/sys/class/dmi/id/product_uuid'),'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),'github_run_id':os.environ.get('GITHUB_RUN_ID'),'github_job':os.environ.get('GITHUB_JOB')}
          for name,obj in [('request',request),('route',route),('host-identity',identity)]:
            (root/f'{name}.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          for name,obj in [('request',request),('route',route)]:
            b=json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
            (root/f'{name}.sha256').write_text(hashlib.sha256(b).hexdigest()+'\n')
          print(json.dumps(identity,indent=2,sort_keys=True))
          PY

      - name: Install pinned Docker MCP Gateway CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ROOT="evidence/cross-host/${{ matrix.host_label }}"
          mkdir -p "$HOME/.docker/cli-plugins" /tmp/mcp-extract
          python - <<'PY'
          import json,os,pathlib,urllib.request
          tag=os.environ['MCP_GATEWAY_VERSION']
          req=urllib.request.Request(f'https://api.github.com/repos/docker/mcp-gateway/releases/tags/{tag}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: rel=json.load(r)
          a=next(x for x in rel['assets'] if x['name']=='docker-mcp-linux-amd64.tar.gz')
          pathlib.Path('/tmp/url').write_text(a['browser_download_url'])
          PY
          curl --fail --location --silent --show-error --max-time 180 "$(cat /tmp/url)" -o /tmp/docker-mcp.tgz
          tar -xzf /tmp/docker-mcp.tgz -C /tmp/mcp-extract
          install -m 0755 /tmp/mcp-extract/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version | tee "$ROOT/docker-mcp-version.txt"
          grep -F "${MCP_GATEWAY_VERSION#v}" "$ROOT/docker-mcp-version.txt"

      - name: Create isolated profile and verify signature-bound gateway
        run: |
          set -euxo pipefail
          ROOT="evidence/cross-host/${{ matrix.host_label }}"
          PROFILE_ID="ess-paper-cross-${{ matrix.host_label }}"
          echo "$PROFILE_ID" > "$ROOT/profile-id.txt"
          docker mcp feature enable profiles > "$ROOT/profile-feature.log" 2>&1 || true
          docker mcp catalog pull "$DOCKER_MCP_CATALOG" > "$ROOT/catalog-pull.log" 2>&1
          docker mcp profile create --name "ESS_PAPER_CROSS_${{ matrix.host_label }}" --id "$PROFILE_ID" --server catalog://mcp/docker-mcp-catalog/paper-search > "$ROOT/profile-create.log" 2>&1
          docker mcp profile show "$PROFILE_ID" --format yaml > "$ROOT/profile-show.yaml"
          docker mcp gateway run --dry-run --profile "$PROFILE_ID" --verify-signatures > "$ROOT/profile-dry-run.out" 2> "$ROOT/profile-dry-run.err"
          grep -F 'paper-search' "$ROOT/profile-show.yaml"
          grep -F 'search_arxiv' "$ROOT/profile-show.yaml"

      - name: Execute live call and apply bounded response normalization
        run: |
          set -euxo pipefail
          ROOT="evidence/cross-host/${{ matrix.host_label }}"
          PROFILE_ID="$(cat "$ROOT/profile-id.txt")"
          timeout --signal=TERM --kill-after=10s 120s docker mcp tools \
            --gateway-arg=--profile="$PROFILE_ID" --gateway-arg=--verify-signatures \
            call search_arxiv "query=${QUERY_TEXT}" 'max_results=3' \
            > "$ROOT/live-response.raw" 2> "$ROOT/live-response.err"
          test -s "$ROOT/live-response.raw"
          grep -Eiq 'arxiv|paper|title|category|homotopy' "$ROOT/live-response.raw"
          python - <<'PY'
          import hashlib,json,pathlib,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from normalized_replay import normalize_tool_response
          root=pathlib.Path('evidence/cross-host/${{ matrix.host_label }}')
          raw=(root/'live-response.raw').read_text(errors='replace')
          transport='\n'.join(line.rstrip() for line in raw.replace('\r\n','\n').replace('\r','\n').split('\n')).strip()+'\n'
          professional=normalize_tool_response(transport)
          assert professional!=transport,'Expected Docker CLI timing prefix was not removed'
          assert 'paper_id' in professional or 'title' in professional.lower() or 'arxiv' in professional.lower()
          (root/'live-response.transport-normalized').write_text(transport)
          (root/'live-response.professional').write_text(professional)
          raw_sha=hashlib.sha256(transport.encode()).hexdigest()
          response_sha=hashlib.sha256(professional.encode()).hexdigest()
          (root/'raw-response.sha256').write_text(raw_sha+'\n')
          (root/'response.sha256').write_text(response_sha+'\n')
          request=json.loads((root/'request.json').read_text()); route=json.loads((root/'route.json').read_text()); identity=json.loads((root/'host-identity.json').read_text())
          identity['raw_response_sha256']=raw_sha
          receipt={
            'decision':route['decision'],'reason':route['reason'],'read_only':True,'external_actuation':False,
            'request_sha256':(root/'request.sha256').read_text().strip(),'route_sha256':(root/'route.sha256').read_text().strip(),
            'surface':route['surface'],'tool':route['tool'],'transport':route['transport'],
            'response_sha256':response_sha,'response':professional,'runtime_meta':identity}
          (root/'raw-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build host manifest
        run: |
          set -euxo pipefail
          ROOT="evidence/cross-host/${{ matrix.host_label }}"
          python - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('evidence/cross-host/${{ matrix.host_label }}'); rows=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (root/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Upload host evidence
        uses: actions/upload-artifact@v4
        with:
          name: ess-cross-host-${{ matrix.host_label }}
          path: evidence/cross-host/${{ matrix.host_label }}/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download both host artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ess-cross-host-*
          path: evidence/downloaded

      - name: Prove distinct hosts and bounded normalized equality
        run: |
          set -euxo pipefail
          mkdir -p evidence/cross-host-final
          python - <<'PY'
          import hashlib,json,pathlib,sys
          sys.path.insert(0,'ess_docker_mcp_router')
          from normalized_replay import normalize_gateway_receipt,normalized_receipts_equal
          base=pathlib.Path('evidence/downloaded'); aroot=base/'ess-cross-host-host-a'; broot=base/'ess-cross-host-host-b'
          a=json.loads((aroot/'raw-receipt.json').read_text()); b=json.loads((broot/'raw-receipt.json').read_text())
          ia=a['runtime_meta']; ib=b['runtime_meta']
          assert ia['host_label']!=ib['host_label']
          assert ia['boot_id'] and ib['boot_id'] and ia['boot_id']!=ib['boot_id'],(ia,ib)
          assert ia['product_uuid'] and ib['product_uuid'] and ia['product_uuid']!=ib['product_uuid'],(ia,ib)
          assert ia['runner_name'] and ib['runner_name'] and ia['runner_name']!=ib['runner_name'],(ia,ib)
          assert a['request_sha256']==b['request_sha256']; assert a['route_sha256']==b['route_sha256']
          raw_a=(aroot/'live-response.transport-normalized').read_bytes(); raw_b=(broot/'live-response.transport-normalized').read_bytes()
          raw_response_equal=raw_a==raw_b
          assert not raw_response_equal,'Cross-host raw CLI responses unexpectedly identical; timing-noise witness absent'
          assert a['response_sha256']==b['response_sha256']; assert a['response']==b['response']
          assert normalized_receipts_equal(a,b)
          na=normalize_gateway_receipt(a); nb=normalize_gateway_receipt(b)
          can=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert can(na)==can(nb)
          raw_receipt_equal=can(a)==can(b); assert not raw_receipt_equal
          summary={
            'gate':'ESS_DOCKER_MCP_CROSS_HOST_GATEWAY_REPLAY_AND_NORMALIZED_RECEIPT_EQUALITY_V1',
            'implementation':'V3_VM_AUTHORITY_PLUS_BOUNDED_CLI_TIMING_PREFIX_NORMALIZATION',
            'status':'PASS_BOUNDED_TWO_DISTINCT_GITHUB_HOSTED_RUNNER_REPLAY_AND_NORMALIZED_RECEIPT_EQUALITY',
            'host_a_identity':ia,'host_b_identity':ib,'distinct_host_identity':True,
            'identity_authority_fields':['boot_id','product_uuid','runner_name'],
            'shared_template_hostname_allowed':ia.get('hostname')==ib.get('hostname'),
            'request_sha256_equal':True,'route_sha256_equal':True,
            'raw_response_equal':raw_response_equal,'professional_response_sha256_equal':True,'professional_response_bytes_equal':True,
            'raw_receipt_equal':raw_receipt_equal,'normalized_receipt_equal':True,
            'normalized_receipt_sha256':hashlib.sha256(can(na)).hexdigest(),'professional_response_sha256':a['response_sha256'],
            'surface':a['surface'],'tool':a['tool'],'transport':a['transport'],
            'response_normalization':'REMOVE_ONLY_LEADING_DOCKER_CLI_TOOL_CALL_TOOK_DURATION_LINE',
            'receipt_normalization':'REMOVE_ONLY_RUNTIME_META',
            'zero_spend':True,'secret_injected':False,'external_actuation':False,'production_ready':False,'global_bind':False,
            'claim_boundary':'TWO_DISTINCT_GITHUB_HOSTED_RUNNER_VMS__SAME_ROUTER_SELECTED_PAPER_SEARCH_GATEWAY_PROFILE_ROUTE__EXACT_PROFESSIONAL_RESPONSE_EQUALITY_AFTER_ONLY_CLI_TIMING_PREFIX_REMOVAL__NORMALIZED_RECEIPT_EQUALITY_AFTER_ONLY_RUNTIME_META_REMOVAL__NOT_ALL_13_SURFACES__NOT_PRODUCTION_READY__NOT_GLOBAL_BIND'}
          out=pathlib.Path('evidence/cross-host-final')
          (out/'bounded-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'normalized-receipt.json').write_bytes(can(na)+b'\n')
          (out/'professional-response.txt').write_text(a['response'])
          (out/'host-a-receipt.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          (out/'host-b-receipt.json').write_text(json.dumps(b,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Verify source manifests and build final manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib,pathlib
          base=pathlib.Path('evidence/downloaded')
          for name in ['ess-cross-host-host-a','ess-cross-host-host-b']:
            root=base/name; errs=[]
            for line in (root/'sha256-manifest.txt').read_text().splitlines():
              if not line.strip():continue
              sha,size,fn=line.split('  ',2); b=(root/fn).read_bytes()
              if hashlib.sha256(b).hexdigest()!=sha or len(b)!=int(size):errs.append(fn)
            assert not errs,(name,errs)
          out=pathlib.Path('evidence/cross-host-final'); rows=[]
          for p in sorted(out.iterdir()):
            if p.is_file() and p.name!='sha256-manifest.txt':
              b=p.read_bytes(); rows.append(f'{hashlib.sha256(b).hexdigest()}  {len(b)}  {p.name}')
          (out/'sha256-manifest.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Upload final cross-host evidence
        uses: actions/upload-artifact@v4
        with:
          name: ess-docker-mcp-cross-host-gateway-replay-v1
          path: evidence/cross-host-final/
          if-no-files-found: error
          retention-days: 30
