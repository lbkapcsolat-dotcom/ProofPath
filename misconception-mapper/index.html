<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misconception Mapper V1</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="shell"><header><p class="eyebrow">PROMETHEUS SEPTEMBER AI CHALLENGE 2</p><h1>Misconception Mapper</h1><p>Map a bounded misconception pattern, get one Socratic hint, then retry.</p></header>
<section class="panel input-panel"><label>Concept<select id="concept"><option value="algebra">Introductory algebra</option><option value="physics">Introductory physics</option></select></label><label>Problem<textarea id="problem">Solve 3x + 5 = 20.</textarea></label><label>Your attempt<textarea id="attempt">3x = 25, x = 8.33</textarea></label><button id="analyze">Analyze attempt</button></section>
<section class="panel result-panel"><p class="eyebrow">LIKELY MISCONCEPTION</p><h2 id="diagnosis">No diagnosis yet.</h2><p id="why">Map an attempt to see a bounded explanation.</p><div class="hint"><strong>Try this next</strong><p id="hint">No hint yet.</p></div></section>
<section class="panel retry-panel"><label>Retry<textarea id="retry"></textarea></label><button id="retryButton">Check retry</button><p id="learningState">No retry yet.</p></section>
</main><script type="module" src="./app.js"></script></body></html>
